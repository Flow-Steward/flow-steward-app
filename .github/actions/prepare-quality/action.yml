name: Prepare hosted Docker quality gate
description: Build the canonical audit toolchain with bounded remote caches
inputs:
  postgres:
    description: Also build the PostgreSQL image; jobs that load the run's prebuilt image pass 'false'
    required: false
    default: 'true'
  cache-to:
    description: Write the audit image layers back to the Actions cache; one job per run is enough
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Prepare owned runtime paths and canonical toolchain identity
      id: runtime
      shell: bash
      run: ./core/entrypoints/cli/scripts/hosted-quality.sh prepare
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (Node 24)
    - name: Restore package downloads (never cached pass evidence)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
      with:
        path: ${{ runner.temp }}/fs-quality-packages/npm
        key: quality-npm-v1-${{ runner.os }}-${{ hashFiles('assets/frontend/package-lock.json') }}
    - name: Make owned bind mounts writable by the container group
      shell: bash
      run: |
        # Hosted runner UID and image UID differ. Preserve the host owner and
        # executable bits; share only this disposable checkout/cache with fs.
        sudo chgrp -R 1000 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fs-quality-packages"
        sudo chmod -R g+rwX "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fs-quality-packages"
    - name: Build and load canonical audit image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (Node 24)
      with:
        context: .
        file: infra/docker/Dockerfile
        target: audit
        load: true
        push: false
        tags: ${{ steps.runtime.outputs.audit_image }}
        build-args: AUDIT_TOOLCHAIN_DIGEST=${{ steps.runtime.outputs.audit_digest }}
        cache-from: type=gha,scope=quality-audit-amd64
        # Keep frontend intermediate stages too: mode=min rebuilt npm/TypeScript
        # even when only backend/tooling source changed in the measured pilot.
        cache-to: ${{ inputs.cache-to == 'true' && 'type=gha,scope=quality-audit-amd64,mode=max' || '' }}
    - name: Build canonical PostgreSQL image for disposable test infrastructure
      if: inputs.postgres == 'true'
      shell: bash
      run: ./core/entrypoints/cli/scripts/hosted-quality.sh prepare-postgres
