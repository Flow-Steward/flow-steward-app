name: Request documentation update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    if: github.repository == 'Flow-Steward/flow-steward-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mint documentation dispatch token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (Node 24)
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: Flow-Steward
          repositories: documentation-site
          permission-contents: write
      - name: Request cumulative documentation reconciliation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'Flow-Steward', repo: 'documentation-site',
              event_type: 'product-docs-sync',
              client_payload: {source_sha: context.sha}
            });
