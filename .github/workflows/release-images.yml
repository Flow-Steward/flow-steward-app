name: Publish official images
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable stable tag (vX.Y.Z)
        required: true
        type: string
      artifact_run_id:
        description: Retry publication using native archives from this workflow run ID (leave empty for a new build)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    if: >-
      github.repository == 'Flow-Steward/flow-steward-app' &&
      (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      artifact_run_id: ${{ steps.identity.outputs.artifact_run_id }}
      reuse: ${{ steps.identity.outputs.reuse }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve clean public tag and main ancestry
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          python3 -c 'import os; from core.application.tooling.release_automation import stable_version; stable_version(os.environ["RELEASE_TAG"])'
          revision="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git checkout --detach "$revision"
          python3 core/entrypoints/cli/scripts/release-automation.py identity --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
            printf 'artifact_run_id=%s\nreuse=true\n' "$ARTIFACT_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            printf 'artifact_run_id=%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
              printf 'reuse=false\n' >> "$GITHUB_OUTPUT"
            else
              printf 'reuse=true\n' >> "$GITHUB_OUTPUT"
            fi
          fi
  quality:
    needs: resolve
    runs-on: ${{ vars.RELEASE_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      FS_STACK_ENV_FILE: /dev/null
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find an already successful exact-SHA cumulative gate
        id: previous-quality
        if: needs.resolve.outputs.tag != 'v0.9.9'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
        with:
          script: |
            const fs = require('fs');
            const choose = require(`${process.env.GITHUB_WORKSPACE}/scripts/release/select-verified-quality.cjs`);
            const repositoryId = Number(process.env.GITHUB_REPOSITORY_ID);
            const workflow = await github.rest.actions.getWorkflow({...context.repo, workflow_id: 'remote-quality.yml'});
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: workflow.data.id, head_sha: process.env.RELEASE_REVISION,
              status: 'success', per_page: 100,
            });
            let matched = null;
            for (const run of runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                ...context.repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
              });
              if (choose(run, jobs, process.env.RELEASE_REVISION, repositoryId, workflow.data.id)) {
                matched = run;
                break;
              }
            }
            if (matched) {
              fs.mkdirSync('logs/quality/hosted', {recursive: true});
              fs.writeFileSync('logs/quality/hosted/reused-gate.json', JSON.stringify({
                revision: process.env.RELEASE_REVISION, run_id: matched.id,
                run_attempt: matched.run_attempt, url: matched.html_url,
              }, null, 2) + '\n');
              await core.summary.addRaw(`Reused successful exact-SHA Tier 2 + Tier 3 gate: ${matched.html_url}`).write();
            }
            core.setOutput('reuse', matched ? 'true' : 'false');
      - uses: ./.github/actions/prepare-quality
        if: needs.resolve.outputs.tag == 'v0.9.9' || steps.previous-quality.outcome != 'success' || steps.previous-quality.outputs.reuse != 'true'
      - name: Build the canonical disposable PostgreSQL image
        if: needs.resolve.outputs.tag == 'v0.9.9' || steps.previous-quality.outcome != 'success' || steps.previous-quality.outputs.reuse != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/postgres-extended/Dockerfile
          load: true
          push: false
          tags: fs-postgres-extended:0.1.0-pgvector-0.8.5
          cache-from: type=gha,scope=quality-postgres-amd64
          cache-to: type=gha,scope=quality-postgres-amd64,mode=min
      - name: Complete exact-SHA Tier 2 and Tier 3 gate
        if: needs.resolve.outputs.tag != 'v0.9.9' && (steps.previous-quality.outcome != 'success' || steps.previous-quality.outputs.reuse != 'true')
        env:
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -o pipefail
          ./core/entrypoints/cli/scripts/lint.sh --full --fingerprint-source commit --commit-sha "$RELEASE_REVISION" \
            2>&1 | tee logs/quality/hosted/full.log
      - name: Focused acceptance (full suite not rerun)
        if: needs.resolve.outputs.tag == 'v0.9.9'
        env:
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_REVISION" ]]
          git merge-base --is-ancestor c876d3efb66cadba95c99e6677cba20e45a8d514 "$RELEASE_REVISION"
          mkdir -p logs/quality/hosted
          {
            echo 'Focused acceptance for v0.9.9; full suite not rerun.'
            echo "Final revision: $RELEASE_REVISION"
            echo 'The v0.9.8 publication gate failed: https://github.com/Flow-Steward/flow-steward-app/actions/runs/41591208411'
            echo 'The user requested focused failed and impacted tests in place of another full gate.'
          } | tee logs/quality/hosted/focused-acceptance.txt >> "$GITHUB_STEP_SUMMARY"
          backend_paths=(
            tests/unit/test_install_script.py
            tests/unit/installer/test_installer_process.py
            tests/unit/lifecycle/test_docker_host_state.py
            tests/unit/test_retired_agent_type_migration.py
            tests/unit/test_inbound_oauth_migration.py
            tests/unit/test_released_migration_immutability.py
            tests/integration/test_inbound_oauth_migration_postgres.py
            tests/unit/test_release_automation.py
          )
          frontend_paths=(
            src/pages/registry/data-connections/connection-preservation.test.tsx
            src/pages/registry/mcp/index.test.tsx
            src/pages/registry/mcp/mcp-json-import.test.ts
            src/pages/registry/mcp/mcp-json-import-field.test.tsx
            src/pages/workflows/detail/index.change-set-scope.test.tsx
            src/pages/workflows/detail/index.hook-frame.test.tsx
            src/pages/workflows/detail/index.transform-draft.test.tsx
            src/pages/workflows/detail/index.unsaved-forms.test.tsx
            src/pages/workflows/builder/canvas-edge-label-placement.test.ts
            src/pages/workflows/builder/canvas-slot-labels.test.tsx
            src/pages/workflows/builder/canvas-viewport.test.ts
          )
          printf 'Backend targets: %s\nFrontend targets: %s\n' "${backend_paths[*]}" "${frontend_paths[*]}" | tee -a logs/quality/hosted/focused-acceptance.txt
          ./core/entrypoints/cli/scripts/lint.sh --checks targeted-tests --test-paths "${backend_paths[*]}" \
            2>&1 | tee logs/quality/hosted/focused-backend.log
          cp assets/frontend/vitest.config.ts "$RUNNER_TEMP/v099-vitest.config.ts"
          trap 'cp "$RUNNER_TEMP/v099-vitest.config.ts" assets/frontend/vitest.config.ts' EXIT
          for frontend_path in "${frontend_paths[@]}"; do
            printf '\nChecking %s\n' "$frontend_path" | tee -a logs/quality/hosted/focused-frontend.log
            if [[ "$frontend_path" == src/pages/workflows/detail/index.hook-frame.test.tsx ]]; then
              # The user requested individual regressions, not the other 82 Hook cases.
              python3 -c 'import json,pathlib; p=pathlib.Path("assets/frontend/vitest.config.ts"); s=p.read_text(); marker="  test: {"; assert s.count(marker)==1; pattern="offers selected child Step Delete but no protected author Delete|drops a held child Step guard after switching to another Hook|waits for an explicitly selected connected Hook before adding"; extra={"testNamePattern":pattern,"reporters":["default","json"],"outputFile":"/app/logs/quality/hosted/hook-focused-vitest.json"}; p.write_text(s.replace(marker, marker+json.dumps(extra)[1:-1]+","))'
            fi
            ./core/entrypoints/cli/scripts/lint.sh --checks frontend-targeted-tests --test-paths "$frontend_path" \
              2>&1 | tee -a logs/quality/hosted/focused-frontend.log
            if [[ "$frontend_path" == src/pages/workflows/detail/index.hook-frame.test.tsx ]]; then
              python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("logs/quality/hosted/hook-focused-vitest.json").read_text()); assert d["numPassedTests"]==3 and d["numFailedTests"]==0, d; print("Three selected Hook regressions passed; other Hook cases excluded.")'
              cp "$RUNNER_TEMP/v099-vitest.config.ts" assets/frontend/vitest.config.ts
            fi
          done
      - name: Collect bounded diagnostics
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh diagnostics
      - name: Remove this job's disposable stack
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh cleanup
      - name: Return generated reports to the artifact uploader
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh prepare-artifacts
      - name: Retain quality evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-quality-${{ github.run_attempt }}
          path: |
            logs/quality/evidence
            logs/quality/hosted
            logs/coverage
          retention-days: 30
          if-no-files-found: warn
  native:
    needs: [resolve, quality]
    if: needs.resolve.outputs.reuse == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          endpoint: default
      - name: Build canonical role set as native OCI archives
        env:
          FS_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          FS_RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          FS_RELEASE_PLATFORM: linux/${{ matrix.architecture }}
          FS_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/native
        run: ./scripts/release/official-release-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: [resolve, quality, native]
    if: >-
      always() && needs.resolve.result == 'success' && needs.quality.result == 'success' &&
      (needs.native.result == 'success' ||
       (needs.native.result == 'skipped' && needs.resolve.outputs.reuse == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      FS_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      FS_RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
      FS_RELEASE_GHCR_NAMESPACE: ${{ vars.RELEASE_GHCR_NAMESPACE || 'ghcr.io/flow-steward' }}
      FS_RELEASE_DOCKERHUB_NAMESPACE: ${{ vars.RELEASE_DOCKERHUB_NAMESPACE || 'docker.io/flowsteward' }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the workflow's immutable publication tooling
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Set publication paths outside the clean source tree
        run: |
          printf 'FS_RELEASE_SOURCE=%s/source\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'FS_RELEASE_TOOLING=%s/tooling\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'FS_RELEASE_ARTIFACT_DIR=%s/native\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'FS_RELEASE_EVIDENCE=%s/release-verification.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'REGISTRY_AUTH_FILE=%s/registry-auth.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validate retained archive run provenance
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ARTIFACT_RUN_ID: ${{ needs.resolve.outputs.artifact_run_id }}
        with:
          script: |
            const runId = Number(process.env.ARTIFACT_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('Invalid archive run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            const {data: workflow} = await github.rest.actions.getWorkflow({...context.repo, workflow_id: 'release-images.yml'});
            if ((run.event === 'push' && run.head_sha !== process.env.FS_RELEASE_REVISION) ||
                (run.event === 'workflow_dispatch' && run.head_branch !== 'main') || run.workflow_id !== workflow.id ||
                !['push', 'workflow_dispatch'].includes(run.event)) {
              throw new Error('Archive run does not match this public source and release workflow');
            }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/native
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.artifact_run_id }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          endpoint: default
      - name: Install publication tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        continue-on-error: true
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || 'flowsteward' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate archives and protect immutable registry versions
        id: preflight
        run: |
          set -euo pipefail
          if [[ -f "$HOME/.docker/config.json" ]]; then
            cp "$HOME/.docker/config.json" "$REGISTRY_AUTH_FILE"
          else
            printf '{}\n' > "$REGISTRY_AUTH_FILE"
          fi
          chmod 600 "$REGISTRY_AUTH_FILE"
          python3 "$FS_RELEASE_TOOLING/core/entrypoints/cli/scripts/release-automation.py" preflight --root "$FS_RELEASE_SOURCE" --tag "$RELEASE_TAG" --artifact-dir "$FS_RELEASE_ARTIFACT_DIR" --preflight-output "$RUNNER_TEMP/release-preflight.json"
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'release-preflight.json')))
          print('ghcr=' + str(os.environ['FS_RELEASE_GHCR_NAMESPACE'] in data['available']).lower())
          print('dockerhub=' + str(os.environ['FS_RELEASE_DOCKERHUB_NAMESPACE'] in data['available']).lower())
          PYCODE
      - name: Copy to available registries and verify complete release sets
        env:
          GHCR_READY: ${{ steps.preflight.outputs.ghcr }}
          DOCKERHUB_READY: ${{ steps.preflight.outputs.dockerhub }}
        run: |
          set -euo pipefail
          if [[ "$GHCR_READY" == true ]]; then
            FS_RELEASE_DOCKERHUB_NAMESPACE= python3 "$FS_RELEASE_TOOLING/scripts/release/official_release.py" publish --root "$FS_RELEASE_SOURCE" --version "$FS_RELEASE_VERSION" --revision "$FS_RELEASE_REVISION" --artifact-dir "$FS_RELEASE_ARTIFACT_DIR" || echo '::warning::GHCR publication failed; checking the other registry.'
          fi
          if [[ "$DOCKERHUB_READY" == true ]]; then
            FS_RELEASE_GHCR_NAMESPACE= python3 "$FS_RELEASE_TOOLING/scripts/release/official_release.py" publish --root "$FS_RELEASE_SOURCE" --version "$FS_RELEASE_VERSION" --revision "$FS_RELEASE_REVISION" --artifact-dir "$FS_RELEASE_ARTIFACT_DIR" || echo '::warning::Docker Hub publication failed; checking the other registry.'
          fi
          python3 "$FS_RELEASE_TOOLING/scripts/release/official_release.py" verify --root "$FS_RELEASE_SOURCE" --version "$FS_RELEASE_VERSION" --revision "$FS_RELEASE_REVISION" --evidence "$FS_RELEASE_EVIDENCE"
          python3 "$FS_RELEASE_TOOLING/core/entrypoints/cli/scripts/release-automation.py" evidence --root "$FS_RELEASE_SOURCE" --tag "$RELEASE_TAG" --evidence "$FS_RELEASE_EVIDENCE" --artifact-dir "$FS_RELEASE_ARTIFACT_DIR"
      - name: Retain registry verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verification.json
          retention-days: 90
          if-no-files-found: warn
      - name: Publish stable GitHub Release after a complete registry verifies
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const focusedNotice = tag === 'v0.9.9'
              ? `Focused acceptance (full suite not rerun) for revision ${process.env.FS_RELEASE_REVISION}. The v0.9.8 publication gate failed: https://github.com/Flow-Steward/flow-steward-app/actions/runs/41591208411. The user requested focused failed and impacted tests instead of another full gate. See the quality artifact for the selected paths and results: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`
              : '';
            const evidence = JSON.parse(fs.readFileSync(process.env.FS_RELEASE_EVIDENCE, 'utf8'));
            const available = evidence.registries.filter(registry => registry.status === 'verified').map(registry => registry.namespace);
            const unavailable = evidence.registries.filter(registry => registry.status === 'incomplete').map(registry => registry.namespace);
            const registryNotice = `Registry availability: verified complete AMD64 and ARM64 images: ${available.join(', ')}.${unavailable.length ? ` Unavailable or incomplete: ${unavailable.join(', ')}.` : ''} See attached digest evidence.`;
            const defaultBody = registryNotice;
            async function assertTagMatchesRevision() {
              let object = (await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`})).data.object;
              for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
                object = (await github.rest.git.getTag({...context.repo, tag_sha: object.sha})).data.object;
              }
              if (object.type !== 'commit' || object.sha !== process.env.FS_RELEASE_REVISION) {
                throw new Error('Release tag no longer resolves to the verified revision');
              }
            }
            let release;
            try {
              ({data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag}));
            } catch (error) {
              if (error.status !== 404) throw error;
              await assertTagMatchesRevision();
              ({data: release} = await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag,
                name: tag, draft: false, prerelease: false,
                body: focusedNotice ? `${defaultBody}\n\n${focusedNotice}` : defaultBody
              }));
            }
            if (release.draft || release.prerelease) throw new Error('Existing release must be stable and non-draft; review it manually');
            let body = release.body || '';
            body = body.replace(/^Registry availability:.*$/gm, '').replace('Native AMD64 and ARM64 images verified in both GHCR and Docker Hub. See attached digest evidence.', '').trim();
            body = `${registryNotice}${body ? `\n\n${body}` : ''}`;
            if (focusedNotice && !body.includes(focusedNotice)) body += `\n\n${focusedNotice}`;
            if (body !== release.body) {
              await assertTagMatchesRevision();
              ({data: release} = await github.rest.repos.updateRelease({...context.repo, release_id: release.id, body}));
            }
            await assertTagMatchesRevision();
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id,
              name: `registry-verification-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}.json`,
              data: fs.readFileSync(process.env.FS_RELEASE_EVIDENCE),
              headers: {'content-type': 'application/json'}
            });
