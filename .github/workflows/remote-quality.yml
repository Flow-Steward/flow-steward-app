name: Remote quality pilot
run-name: Quality ${{ (github.ref_name == 'codex/secret-scan-live' && 'secret-scan-only') || (github.ref_name == 'codex/quality-reuse-live' && 'reuse-smoke') || (github.event_name == 'schedule' && 'release-full') || inputs.mode || (github.ref_name == 'codex/sonar-runtime-pilot' && 'sonar-diagnostic') || ((github.ref_name == 'codex/remote-quality-pilot' || startsWith(github.ref_name, 'codex/verify-sonar/')) && 'release-sonar') || (startsWith(github.ref_name, 'codex/verify-release/') && 'release') || 'tier2' }} · ${{ github.ref_name }}

on:
  push:
    branches: ['**']
  # Weekly backstop for impacted-test selection (ADR 0068): main's Tier 3
  # suites run whole and rebuild their impact maps.
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Quality gate or an isolated diagnostic (secret-scan-only never runs a full tier)
        type: choice
        required: true
        default: tier2
        options: [tier2, release, release-sonar, release-full, single-check, sonar-diagnostic, reuse-smoke, secret-scan-only]
      check:
        description: Registry check id that single-check runs alone (a diagnostic, not release evidence)
        type: string
        required: false
        default: ''
      reuse_run_id:
        description: Optional official source run; secret-scan-only imports only its per-file scanner manifest
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: remote-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  FS_STACK_ENV_FILE: /dev/null
  QUALITY_MODE: ${{ (github.ref_name == 'codex/secret-scan-live' && 'secret-scan-only') || (github.ref_name == 'codex/quality-reuse-live' && 'reuse-smoke') || (github.event_name == 'schedule' && 'release-full') || inputs.mode || (github.ref_name == 'codex/sonar-runtime-pilot' && 'sonar-diagnostic') || ((github.ref_name == 'codex/remote-quality-pilot' || startsWith(github.ref_name, 'codex/verify-sonar/')) && 'release-sonar') || (startsWith(github.ref_name, 'codex/verify-release/') && 'release') || 'tier2' }}

jobs:
  quality:
    # The v0.9.9 release workflow owns the user's one-time focused acceptance.
    # Skip this duplicate branch gate only for its explicitly marked main commit.
    if: >-
      github.repository == 'Flow-Steward/flow-steward-app' && github.event.repository.private == false &&
      github.ref_name != 'codex/secret-scan-live' && inputs.mode != 'secret-scan-only' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, '[focused-release-v0.9.9]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    outputs:
      evidence_imported: ${{ steps.copy-restored-evidence.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a clean exact-SHA candidate including current main
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - name: Resolve the diagnostic smoke source without bypassing provenance validation
        id: smoke-source
        if: env.QUALITY_MODE == 'reuse-smoke'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        env:
          REQUESTED_RUN_ID: ${{ inputs.reuse_run_id }}
        with:
          script: |
            const fs = require('fs');
            let requested = process.env.REQUESTED_RUN_ID || '';
            const control = '.github/quality-reuse-smoke-source.json';
            if (!requested && fs.existsSync(control)) {
              const source = JSON.parse(fs.readFileSync(control, 'utf8'));
              if (typeof source.source_run_id !== 'string' || !/^[1-9][0-9]*$/.test(source.source_run_id)) {
                throw new Error('Smoke source control requires a positive decimal source_run_id string');
              }
              requested = source.source_run_id;
            }
            core.setOutput('run_id', requested);
            core.info(requested ? 'Consumer: validate and import the requested official source.' : 'Producer: execute one real targeted regression.');
      - name: Validate explicitly requested source run and exact evidence artifact
        id: validate-reuse-source
        if: (github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != '') || (env.QUALITY_MODE == 'reuse-smoke' && steps.smoke-source.outputs.run_id != '')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id || steps.smoke-source.outputs.run_id }}
        with:
          script: |
            const requested = process.env.REUSE_RUN_ID;
            const runId = Number(requested);
            if (!/^[1-9][0-9]*$/.test(requested) || !Number.isSafeInteger(runId)) {
              throw new Error('reuse_run_id must be an explicit positive decimal run ID');
            }
            const repositoryId = Number(process.env.GITHUB_REPOSITORY_ID);
            if (process.env.GITHUB_REPOSITORY !== 'Flow-Steward/flow-steward-app' ||
                !Number.isSafeInteger(repositoryId) || repositoryId <= 0) {
              throw new Error('Evidence import requires the official source repository identity');
            }
            const {data: workflow} = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'remote-quality.yml',
            });
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            if (run.id !== runId || run.workflow_id !== workflow.id ||
                run.repository?.id !== repositoryId || run.head_repository?.id !== repositoryId ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                run.status !== 'completed' || !['success', 'failure'].includes(run.conclusion)) {
              throw new Error('Requested run is not a completed official remote-quality push/dispatch run');
            }
            if (!/^[0-9a-f]{40}$/.test(run.head_sha) ||
                !Number.isSafeInteger(run.run_attempt) || run.run_attempt <= 0) {
              throw new Error('Requested run has invalid source SHA or attempt provenance');
            }
            const artifactName = `quality-${run.head_sha}-${run.run_attempt}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: runId, per_page: 100,
            });
            const matching = artifacts.filter(artifact => artifact.name === artifactName);
            if (matching.length !== 1 || matching[0].expired !== false) {
              throw new Error('Requested source has no unique retained exact-SHA/attempt quality artifact');
            }
            core.setOutput('run_id', requested);
            core.setOutput('artifact_name', artifactName);
            core.setOutput('source_sha', run.head_sha);
            core.info(`Importing ${artifactName} from official run ${runId}; every check still requires fingerprint validation.`);
      - name: Download explicitly requested source evidence and coverage
        id: restore-source-evidence
        if: steps.validate-reuse-source.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: ${{ steps.validate-reuse-source.outputs.artifact_name }}
          path: ${{ runner.temp }}/source-quality
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.validate-reuse-source.outputs.run_id }}
      - name: Identify the previous attempt of this run
        id: previous-attempt
        if: fromJSON(github.run_attempt) > 1
        run: echo "number=$((GITHUB_RUN_ATTEMPT - 1))" >> "$GITHUB_OUTPUT"
      - name: Restore prior evidence from this same run and SHA
        id: restore-prior-evidence
        if: fromJSON(github.run_attempt) > 1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: quality-${{ github.sha }}-${{ steps.previous-attempt.outputs.number }}
          path: ${{ runner.temp }}/previous-quality
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Restore owned evidence and coverage for fingerprint validation
        id: copy-restored-evidence
        if: steps.restore-source-evidence.outcome == 'success' || steps.restore-prior-evidence.outcome == 'success'
        env:
          SOURCE_RESTORED: ${{ steps.restore-source-evidence.outcome == 'success' }}
          SOURCE_SHA: ${{ steps.validate-reuse-source.outputs.source_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "$SOURCE_RESTORED" == true ]]; then
            source_evidence="$RUNNER_TEMP/source-quality/quality/evidence"
            if [[ ! -d "$source_evidence" ]] || [[ -z "$(find "$source_evidence" -type f -name evidence.json -print -quit)" ]]; then
              echo '::error::Requested quality source artifact contains no check evidence; refusing an implicit full run.'
              exit 1
            fi
          fi
          # Copy intact records: fingerprint and commit-scope policy decide reuse.
          # A newer attempt of this run takes precedence over the explicit source.
          for previous in "$RUNNER_TEMP/source-quality" "$RUNNER_TEMP/previous-quality"; do
            if [[ -d "$previous/quality/evidence" ]]; then
              mkdir -p logs/quality/evidence
              cp -R "$previous/quality/evidence/." logs/quality/evidence/
            fi
            # Coverage describes its exact source SHA even when passed check
            # evidence can be reused across SHAs by input fingerprint.
            if [[ -d "$previous/coverage" ]] && [[ "$previous" == "$RUNNER_TEMP/previous-quality" || "$SOURCE_SHA" == "$GITHUB_SHA" ]]; then
              mkdir -p logs/coverage
              cp -R "$previous/coverage/." logs/coverage/
            fi
          done
          for output in logs/quality/evidence logs/coverage; do
            if [[ -d "$output" ]]; then
              sudo chgrp -R 1000 "$output"
              sudo chmod -R g+rwX "$output"
            fi
          done
      - name: Find a bounded official per-file scanner cache for this push
        id: scanner-cache-source
        if: github.event_name == 'push' && env.QUALITY_MODE != 'reuse-smoke' && steps.restore-source-evidence.outcome != 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        with:
          script: |
            const select = require(`${process.env.GITHUB_WORKSPACE}/core/application/tooling/quality/hosted_cache_source.cjs`);
            const {data: workflow} = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'remote-quality.yml',
            });
            const source = await select({github, ...context.repo,
              repositoryId: Number(process.env.GITHUB_REPOSITORY_ID),
              workflowId: workflow.id, branch: context.ref.replace(/^refs\/heads\//, ''),
              currentRunId: Number(process.env.GITHUB_RUN_ID)});
            if (source) {
              core.setOutput('run_id', String(source.run_id));
              core.setOutput('artifact_name', source.artifact_name);
              core.info(`Optional per-file scanner proofs from official run ${source.run_id}; no whole-gate evidence is imported.`);
            } else {
              core.info('No retained validated scanner cache; scan all unproven files.');
            }
      - name: Download only the selected per-file scanner manifest
        id: restore-scanner-cache
        if: steps.scanner-cache-source.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: ${{ steps.scanner-cache-source.outputs.artifact_name }}
          path: ${{ runner.temp }}/scanner-cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.scanner-cache-source.outputs.run_id }}
      - name: Import bounded scanner proofs without accepting a gate result
        if: steps.restore-source-evidence.outcome == 'success' || steps.restore-prior-evidence.outcome == 'success' || steps.restore-scanner-cache.outcome == 'success'
        run: |
          # Explicit source wins; prior-attempt and automatic caches are fallbacks.
          for manifest in "$RUNNER_TEMP/source-quality/quality/file-results/detect-secrets.json" \
              "$RUNNER_TEMP/previous-quality/quality/file-results/detect-secrets.json" \
              "$RUNNER_TEMP/scanner-cache/detect-secrets.json"; do
            if [[ -f "$manifest" ]]; then
              python3 -m core.application.tooling.quality.file_scan_cache import \
                --cache-root "$RUNNER_TEMP/fs-quality-packages/file-results" --source "$manifest" \
                || echo '::warning::Scanner cache unavailable or invalid; unproven files will be scanned.'
              break
            fi
          done
      - name: Find earlier evidence and impact maps of this candidate's history
        id: earlier-evidence
        if: env.QUALITY_MODE != 'reuse-smoke' && env.QUALITY_MODE != 'single-check' && steps.restore-source-evidence.outcome != 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        with:
          script: |
            const fs = require('fs');
            const select = require(`${process.env.GITHUB_WORKSPACE}/core/application/tooling/quality/hosted_evidence_source.cjs`);
            const {data: workflow} = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'remote-quality.yml',
            });
            const {execFileSync} = require('child_process');
            // Only results of this candidate's own history, whatever branch ran them.
            const isAncestor = sha => {
              try {
                execFileSync('git', ['merge-base', '--is-ancestor', sha, 'HEAD'], {stdio: 'ignore'});
                return true;
              } catch (_) {
                return false;
              }
            };
            const sources = await select({github, ...context.repo,
              repositoryId: Number(process.env.GITHUB_REPOSITORY_ID),
              workflowId: workflow.id, currentRunId: Number(process.env.GITHUB_RUN_ID), isAncestor});
            const root = `${process.env.RUNNER_TEMP}/earlier-quality`;
            fs.mkdirSync(root, {recursive: true});
            let index = 0;
            for (const source of sources) {
              const {data} = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: source.artifact_id, archive_format: 'zip',
              });
              fs.writeFileSync(`${root}/${String(index++).padStart(3, '0')}-${source.name}.zip`, Buffer.from(data));
              core.info(`${source.name} from run ${source.run_id} (${source.branch})`);
            }
            core.setOutput('count', String(sources.length));
      - name: Import earlier evidence and impact maps without accepting a result
        if: steps.earlier-evidence.outputs.count != '' && steps.earlier-evidence.outputs.count != '0'
        run: |
          set -euo pipefail
          # Newest first and never replacing what is already here: fingerprints decide
          # reuse, and a selection trusts only results of this candidate's ancestors.
          for archive in "$RUNNER_TEMP"/earlier-quality/*.zip; do
            target="${archive%.zip}"
            unzip -q -o "$archive" -d "$target"
            if [[ -d "$target/quality/evidence" ]]; then
              mkdir -p logs/quality/evidence
              cp -R --update=none "$target/quality/evidence/." logs/quality/evidence/
            fi
            for map in "$target"/quality/test-impact/*/map.json; do
              [[ -f "$map" ]] || continue
              check="$(basename "$(dirname "$map")")"
              [[ "$check" =~ ^[a-z0-9-]+$ && ! -f "logs/quality/test-impact/$check/map.json" ]] || continue
              mkdir -p "logs/quality/test-impact/$check"
              cp "$map" "logs/quality/test-impact/$check/map.json"
            done
          done
          for output in logs/quality/evidence logs/quality/test-impact; do
            if [[ -d "$output" ]]; then
              sudo chgrp -R 1000 "$output"
              sudo chmod -R g+rwX "$output"
            fi
          done
      - uses: ./.github/actions/prepare-quality
      - name: Prove scoped diagnostic reuse without running any full gate or product suite
        if: env.QUALITY_MODE == 'reuse-smoke'
        env:
          SOURCE_SHA: ${{ steps.validate-reuse-source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ steps.validate-reuse-source.outputs.run_id }}
        run: |
          set -o pipefail
          source core/entrypoints/cli/scripts/docker_compose_env.sh
          smoke_args=(--repository-root /app --commit-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID")
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            source_report="$RUNNER_TEMP/source-quality/quality/hosted/reuse-smoke.json"
            [[ -f "$source_report" ]] || { echo '::error::Requested source has no diagnostic smoke report.'; exit 1; }
            cp "$source_report" logs/quality/hosted/reuse-smoke-source.json
            smoke_args+=(--source-sha "$SOURCE_SHA" --source-run-id "$SOURCE_RUN_ID"
              --previous-report /app/logs/quality/hosted/reuse-smoke-source.json)
          fi
          fs_compose run --no-deps --rm -T \
            -e GITHUB_ACTIONS -e GITHUB_SHA -e GITHUB_RUN_ID \
            fs-audit python -m core.application.tooling.quality.reuse_smoke "${smoke_args[@]}" \
            2>&1 | tee logs/quality/hosted/reuse-smoke.log
      - name: Run canonical Tier 2
        if: env.QUALITY_MODE != 'reuse-smoke' && env.QUALITY_MODE != 'single-check'
        run: |
          set -o pipefail
          # Sample only this disposable job's containers, including a failed gate.
          (
            while true; do
              date --utc --iso-8601=seconds
              mapfile -t owned_ids < <(docker ps -q --filter "label=com.docker.compose.project=$FS_COMPOSE_PROJECT_NAME")
              if (( ${#owned_ids[@]} )); then
                docker stats --no-stream --format '{{json .}}' "${owned_ids[@]}" || true
              fi
              sleep 15
            done
          ) > logs/quality/hosted/tier2-resources.log 2>&1 &
          quality_monitor_pid=$!
          trap 'kill "$quality_monitor_pid" 2>/dev/null || true' EXIT
          ./core/entrypoints/cli/scripts/lint.sh --fast \
            --fingerprint-source commit --commit-sha "$GITHUB_SHA" \
            2>&1 | tee logs/quality/hosted/tier2.log
      - name: Build the canonical disposable PostgreSQL image
        if: env.QUALITY_MODE == 'release' || env.QUALITY_MODE == 'release-sonar' || env.QUALITY_MODE == 'release-full' || env.QUALITY_MODE == 'single-check'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (Node 24)
        with:
          context: .
          file: infra/docker/postgres-extended/Dockerfile
          load: true
          push: false
          tags: fs-postgres-extended:0.1.0-pgvector-0.8.5
          cache-from: type=gha,scope=quality-postgres-amd64
          cache-to: type=gha,scope=quality-postgres-amd64,mode=min
      - name: Save the exact PostgreSQL image for the Tier 3 jobs
        if: env.QUALITY_MODE == 'release' || env.QUALITY_MODE == 'release-sonar' || env.QUALITY_MODE == 'release-full'
        run: |
          # Backend evidence binds the service image ID. One build shared by every
          # Tier 3 job keeps their results readable by the cumulative release job.
          docker save fs-postgres-extended:0.1.0-pgvector-0.8.5 | zstd -T0 -3 -q -o "$RUNNER_TEMP/postgres-image.tar.zst"
      - name: Hand the PostgreSQL image to the Tier 3 jobs
        if: env.QUALITY_MODE == 'release' || env.QUALITY_MODE == 'release-sonar' || env.QUALITY_MODE == 'release-full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: postgres-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-image.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Run one requested check alone
        if: env.QUALITY_MODE == 'single-check'
        env:
          CHECK_ID: ${{ inputs.check }}
        run: |
          set -o pipefail
          # Re-checks one check after a gate run failed only there; it is
          # diagnostic only and never stands in for cumulative release evidence.
          [[ "$CHECK_ID" =~ ^[a-z0-9-]+$ ]] || { echo '::error::single-check needs a registry check id in the check input.'; exit 1; }
          execution="$(CHECK_ID="$CHECK_ID" python3 -c 'import json, os; rows = json.load(open("infra/tooling/quality/check-registry.json"))["checks"]; print(next(row.get("execution", "orchestrator") for row in rows if row["id"] == os.environ["CHECK_ID"]))')"
          if [[ "$execution" == "external" ]]; then
            # External checks drive their own Docker stack, so they run the way
            # run-external-tier-three.sh runs them: in fs-audit, as root, with the socket.
            source core/entrypoints/cli/scripts/docker_compose_env.sh
            fs_compose run --no-deps --rm -T --user 0:0 \
              -e "FS_COMPOSE_PROJECT_NAME=fs-oauth-generic-single-${GITHUB_RUN_ID}" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              fs-audit bash core/entrypoints/cli/scripts/lint.sh --checks "$CHECK_ID" \
              2>&1 | tee logs/quality/hosted/single-check.log || check_status=$?
            if [[ "${check_status:-0}" -ne 0 ]]; then
              # A browser failure is only readable from its page snapshot.
              # The check writes its diagnostics as root.
              sudo find logs -name error-context.md -print -exec cat {} \; 2>/dev/null | head -400 || true
              sudo find logs/quality/hosted/oauth-browser -name 'fs-app.log' -exec grep -E -i 'error|exception|traceback| 4[0-9][0-9] | 5[0-9][0-9] ' {} \; 2>/dev/null | tail -80 || true
              exit "$check_status"
            fi
          else
            ./core/entrypoints/cli/scripts/lint.sh --checks "$CHECK_ID" \
              2>&1 | tee logs/quality/hosted/single-check.log
          fi
      - name: Reject results if main advanced beyond the candidate
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - name: Collect bounded diagnostics
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh diagnostics
      - name: Remove this job's disposable stack
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh cleanup
      - name: Return generated reports to the artifact uploader
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh prepare-artifacts
      - name: Retain evidence and this run's coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          # Release modes finish in release_gate, which owns quality-<sha>-<attempt>.
          name: ${{ (env.QUALITY_MODE == 'release' || env.QUALITY_MODE == 'release-sonar' || env.QUALITY_MODE == 'release-full') && 'quality-stage' || 'quality' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            logs/quality/evidence
            logs/quality/hosted
            logs/quality/file-results
            logs/quality/test-impact/*/map.json
            logs/coverage
          retention-days: 3
          if-no-files-found: warn
      - name: Retain only current per-file scanner proofs for later pushes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: secret-scan-files-${{ github.sha }}-${{ github.run_attempt }}
          path: logs/quality/file-results/detect-secrets.json
          retention-days: 3
          if-no-files-found: ignore

  secret_scan:
    name: Secret scanner only / per-file reuse measurement
    if: >-
      github.repository == 'Flow-Steward/flow-steward-app' && github.event.repository.private == false &&
      (github.ref_name == 'codex/secret-scan-live' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'secret-scan-only'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a clean exact-SHA scanner candidate including current main
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - name: Validate the explicitly requested scanner source
        id: scanner-source
        if: inputs.reuse_run_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        env:
          SCANNER_SOURCE_RUN_ID: ${{ inputs.reuse_run_id }}
        with:
          script: |
            const select = require(`${process.env.GITHUB_WORKSPACE}/core/application/tooling/quality/hosted_cache_source.cjs`);
            const {data: workflow} = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'remote-quality.yml',
            });
            const source = await select({github, ...context.repo,
              repositoryId: Number(process.env.GITHUB_REPOSITORY_ID),
              workflowId: workflow.id, branch: context.ref.replace(/^refs\/heads\//, ''),
              currentRunId: Number(process.env.GITHUB_RUN_ID),
              requestedRunId: process.env.SCANNER_SOURCE_RUN_ID});
            if (!source) throw new Error('Explicit scanner source was not validated');
            core.setOutput('run_id', String(source.run_id));
            core.setOutput('artifact_name', source.artifact_name);
            core.info(`Importing only per-file scanner proofs from official run ${source.run_id}.`);
      - name: Download only the validated scanner manifest
        if: steps.scanner-source.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: ${{ steps.scanner-source.outputs.artifact_name }}
          path: ${{ runner.temp }}/scanner-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.scanner-source.outputs.run_id }}
      - name: Import the requested per-file passes; otherwise start cold
        run: |
          mkdir -p "$RUNNER_TEMP/fs-quality-packages/file-results"
          if [[ -n '${{ steps.scanner-source.outputs.run_id }}' ]]; then
            python3 -m core.application.tooling.quality.file_scan_cache import \
              --cache-root "$RUNNER_TEMP/fs-quality-packages/file-results" \
              --source "$RUNNER_TEMP/scanner-source/detect-secrets.json"
          else
            echo 'Cold producer: no scanner cache or prior gate evidence is restored.'
          fi
      - uses: ./.github/actions/prepare-quality
      - name: Measure only the canonical file detector
        env:
          SCANNER_SOURCE_RUN_ID: ${{ steps.scanner-source.outputs.run_id }}
        run: |
          set -o pipefail
          python3 - <<'PYCODE' 2>&1 | tee logs/quality/hosted/secret-scan.log
          import json, os, re, subprocess, time
          from pathlib import Path
          command = ["bash", "core/entrypoints/cli/scripts/lint.sh", "--checks", "detect-secrets",
                     "--fingerprint-source", "commit", "--commit-sha", os.environ["GITHUB_SHA"]]
          started = time.monotonic()
          scanned = total = None
          process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          for line in process.stdout:
              print(line, end="", flush=True)
              match = re.search(r"detect-sec" r"rets: scanning (\d+) of (\d+) files", line)
              cached = re.search(r"detect-sec" r"rets: all (\d+) files already passed", line)
              if match:
                  scanned, total = map(int, match.groups())
              elif cached:
                  scanned, total = 0, int(cached[1])
          result = process.wait()
          report = {"sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                    "source_run_id": os.environ.get("SCANNER_SOURCE_RUN_ID", ""),
                    "scanned_files": scanned, "total_files": total,
                    "reused_files": total - scanned if total is not None else None,
                    "command_seconds": time.monotonic() - started, "exit_code": result,
                    "command": command, "release_evidence": False}
          Path("logs/quality/hosted/secret-scan.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Scanner-only diagnostic; no full quality tier was run.\n\n")
              summary.write(f"Scanned {scanned}/{total} files; reused {report['reused_files']}; "
                            f"command {report['command_seconds']:.3f}s; exit {result}.\n")
          raise SystemExit(result or (0 if scanned is not None else 2))
          PYCODE
      - name: Reject results if main advanced beyond this scanner candidate
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - name: Collect bounded scanner diagnostics
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh diagnostics
      - name: Remove this scanner job's disposable stack
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh cleanup
      - name: Return scanner reports to the artifact uploader
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh prepare-artifacts
      - name: Retain this scanner measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: secret-scan-measurement-${{ github.sha }}-${{ github.run_attempt }}
          path: logs/quality/hosted
          retention-days: 3
          if-no-files-found: warn
      - name: Retain current per-file scanner proofs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: secret-scan-files-${{ github.sha }}-${{ github.run_attempt }}
          path: logs/quality/file-results/detect-secrets.json
          retention-days: 3
          if-no-files-found: ignore

  tier3:
    # Tier 3 on parallel VMs (ADR 0068): each part reads Tier 2 and earlier evidence
    # from the quality job, runs its suites (impacted tests only, unless a weekly
    # or release-full run asks for the whole suites) and returns its evidence.
    name: Tier 3 / ${{ matrix.part }}
    needs: quality
    if: >-
      github.ref_name != 'codex/secret-scan-live' && inputs.mode != 'secret-scan-only' &&
      github.ref_name != 'codex/quality-reuse-live' && inputs.mode != 'reuse-smoke' &&
      needs.quality.result == 'success' &&
      (inputs.mode == 'release' || inputs.mode == 'release-sonar' || inputs.mode == 'release-full' || github.event_name == 'schedule' ||
       (github.event_name == 'push' && (github.ref_name == 'codex/remote-quality-pilot' ||
        startsWith(github.ref_name, 'codex/verify-sonar/') || startsWith(github.ref_name, 'codex/verify-release/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: backend
            checks: backend-tests
          - part: contracts
            checks: backend-frontend-contracts,runtime-heartbeat-cross-profile
          - part: frontend
            checks: frontend-tests
          - part: external
            checks: external
    env:
      FULL_SUITE_FLAG: ${{ (inputs.mode == 'release-full' || github.event_name == 'schedule') && '--full-suite' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a clean candidate including current main
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - name: Restore Tier 2 and earlier evidence from the quality job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: quality-stage-${{ github.sha }}-${{ github.run_attempt }}
          path: logs
      - uses: ./.github/actions/prepare-quality
      - name: Download the PostgreSQL image built once for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: postgres-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-image
      - name: Load the exact PostgreSQL image of this run
        run: zstd -dc "$RUNNER_TEMP/postgres-image/postgres-image.tar.zst" | docker load
      - name: Run this part of Tier 3
        env:
          TIER3_CHECKS: ${{ matrix.checks }}
          TIER3_PART: ${{ matrix.part }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # FULL_SUITE_FLAG is empty or one flag.
          ./core/entrypoints/cli/scripts/lint.sh --full \
            --fingerprint-source commit --commit-sha "$GITHUB_SHA" \
            --tier3-only "$TIER3_CHECKS" $FULL_SUITE_FLAG \
            2>&1 | tee "logs/quality/hosted/tier3-$TIER3_PART.log"
      - name: Reject results if main advanced beyond the candidate
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - name: Collect bounded diagnostics
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh diagnostics
      - name: Remove this job's disposable stack
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh cleanup
      - name: Return generated reports to the artifact uploader
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh prepare-artifacts
      - name: Retain this part's evidence, impact map and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: tier3-${{ matrix.part }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            logs/quality/evidence
            logs/quality/hosted
            logs/quality/test-impact/*/map.json
            logs/quality/test-impact/*/plan.json
            logs/coverage
          retention-days: 3
          if-no-files-found: warn

  release_gate:
    # The cumulative read: every Tier 2 and Tier 3 result for this exact SHA, as
    # one --full gate that finds them all reusable and runs nothing again.
    name: Cumulative release gate
    needs: [quality, tier3]
    if: >-
      always() && !cancelled() &&
      github.ref_name != 'codex/secret-scan-live' && inputs.mode != 'secret-scan-only' &&
      github.ref_name != 'codex/quality-reuse-live' && inputs.mode != 'reuse-smoke' &&
      (inputs.mode == 'release' || inputs.mode == 'release-sonar' || inputs.mode == 'release-full' || github.event_name == 'schedule' ||
       (github.event_name == 'push' && (github.ref_name == 'codex/remote-quality-pilot' ||
        startsWith(github.ref_name, 'codex/verify-sonar/') || startsWith(github.ref_name, 'codex/verify-release/')))) &&
      needs.quality.result == 'success' && needs.tier3.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a clean candidate including current main
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - name: Restore Tier 2 evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: quality-stage-${{ github.sha }}-${{ github.run_attempt }}
          path: logs
      - name: Restore every Tier 3 part's evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          pattern: tier3-*-${{ github.sha }}-${{ github.run_attempt }}
          merge-multiple: true
          path: logs
      - uses: ./.github/actions/prepare-quality
      - name: Download the PostgreSQL image built once for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: postgres-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-image
      - name: Load the exact PostgreSQL image of this run
        run: zstd -dc "$RUNNER_TEMP/postgres-image/postgres-image.tar.zst" | docker load
      - name: Run cumulative gate over all parts
        run: |
          set -o pipefail
          ./core/entrypoints/cli/scripts/lint.sh --full \
            --fingerprint-source commit --commit-sha "$GITHUB_SHA" \
            2>&1 | tee logs/quality/hosted/full.log
      - name: Reject results if main advanced beyond the candidate
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - name: Collect bounded diagnostics
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh diagnostics
      - name: Remove this job's disposable stack
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh cleanup
      - name: Return generated reports to the artifact uploader
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh prepare-artifacts
      - name: Retain the cumulative evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: quality-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            logs/quality/evidence
            logs/quality/hosted
            logs/quality/test-impact/*/map.json
            logs/coverage
          retention-days: 3
          if-no-files-found: warn

  sonar:
    name: Full SonarQube pilot (fresh baseline)
    # Runs beside release_gate: coverage comes from the Tier 3 parts of this run.
    needs: [quality, tier3]
    if: >-
      always() && !cancelled() &&
      github.ref_name != 'codex/secret-scan-live' && inputs.mode != 'secret-scan-only' &&
      github.ref_name != 'codex/quality-reuse-live' && inputs.mode != 'reuse-smoke' &&
      (inputs.reuse_run_id == '' || needs.quality.outputs.evidence_imported == 'true') &&
      (needs.quality.result == 'success' || needs.quality.result == 'failure') &&
      (inputs.mode == 'release-sonar' || inputs.mode == 'sonar-diagnostic' ||
       (github.event_name == 'push' &&
        (github.ref_name == 'codex/sonar-runtime-pilot' || github.ref_name == 'codex/remote-quality-pilot' || startsWith(github.ref_name, 'codex/verify-sonar/')))) &&
      needs.tier3.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck candidate before expensive analysis
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - uses: ./.github/actions/prepare-quality
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: ${{ (env.QUALITY_MODE == 'release' || env.QUALITY_MODE == 'release-sonar' || env.QUALITY_MODE == 'release-full') && 'quality-stage' || 'quality' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: logs
      - name: Restore Tier 3 coverage from this run's parts
        if: needs.tier3.result == 'success' || needs.tier3.result == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          pattern: tier3-*-${{ github.sha }}-${{ github.run_attempt }}
          merge-multiple: true
          path: logs
      - name: Identify diagnostic analysis after failed tests
        if: needs.quality.result == 'failure' || needs.tier3.result == 'failure'
        run: |
          echo '::warning::Diagnostic Sonar analysis: preceding quality gate failed; coverage may be incomplete. This run cannot qualify a release.'
          echo 'Sonar runs diagnostically after a failed quality gate. Coverage may be incomplete. The failed gate remains failed; this run is not release evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Identify runtime-only diagnostic without test coverage
        if: env.QUALITY_MODE == 'sonar-diagnostic'
        run: |
          echo '::warning::Runtime diagnostic only: full source analysis without Tier 3 coverage. Not release evidence.'
          echo 'Sonar runtime diagnostic: Tier 3 was not selected, and test coverage is unavailable. This measures analysis runtime only and cannot qualify a release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Initialize an isolated SonarQube pilot server
        run: |
          source core/entrypoints/cli/scripts/docker_compose_env.sh
          sudo sysctl -w vm.max_map_count=524288
          fs_compose --profile quality up -d sonarqube
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9000/api/system/status | python3 -c 'import json,sys; sys.exit(json.load(sys.stdin).get("status") != "UP")'; then
              ready=1
              break
            fi
            sleep 5
          done
          [[ "$ready" == 1 ]] || exit 1
          # Keep 192 random bits and satisfy Sonar's required character classes.
          password="$(openssl rand -hex 24)Aa1!"
          printf '::add-mask::%s\n' "$password"
          # A fresh Sonar server initially uses its username as the password.
          bootstrap_user=admin
          curl -fsS -u "$bootstrap_user:$bootstrap_user" -X POST http://127.0.0.1:9000/api/users/change_password \
            --data-urlencode "login=$bootstrap_user" --data-urlencode "previousPassword=$bootstrap_user" \
            --data-urlencode "password=$password"
          token="$(curl -fsS -u "$bootstrap_user:$password" -X POST http://127.0.0.1:9000/api/user_tokens/generate \
            --data-urlencode "name=quality-$GITHUB_RUN_ID" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          [[ -n "$token" ]] || exit 1
          printf '::add-mask::%s\n' "$token"
          printf 'SONAR_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Full frontend and backend analysis with the canonical profile
        run: |
          set -o pipefail
          ./core/entrypoints/cli/scripts/lint.sh --sonar-full \
            2>&1 | tee logs/quality/hosted/sonar.log
      - name: Reject stale candidate after analysis
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - name: Export findings before deleting the pilot server
        if: always() && env.SONAR_TOKEN != ''
        run: ./core/entrypoints/cli/scripts/lint.sh --sonar-issues
      - name: Collect diagnostics before teardown
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh diagnostics
      - name: Remove this job's disposable stack and Sonar data
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh cleanup
      - name: Return generated reports to the artifact uploader
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh prepare-artifacts
      - name: Retain pilot diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: sonar-pilot-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            logs/quality/hosted
            logs/quality/sonar
          retention-days: 3
          if-no-files-found: warn
