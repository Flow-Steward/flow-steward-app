name: Weekly stress checks

on:
  schedule:
    # Sunday 03:00 UTC; run separately from release acceptance.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-stress-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  FS_STACK_ENV_FILE: /dev/null

jobs:
  stress:
    if: github.repository == 'Flow-Steward/flow-steward-app' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the selected commit to include current main
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh check-candidate
      - uses: ./.github/actions/prepare-quality
      - name: Run timeout preflight and stress checks in fs-audit
        run: |
          set -o pipefail
          ./core/entrypoints/cli/scripts/lint.sh --checks targeted-tests \
            --test-paths "tests/unit/tooling/quality/test_hosted_quality.py::test_audit_pytest_interrupts_a_test_that_exceeds_its_timeout tests/unit/stress" \
            2>&1 | tee logs/quality/hosted/stress.log
      - name: Collect bounded diagnostics
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh diagnostics
      - name: Remove this job's disposable stack
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh cleanup
      - name: Return generated reports to the artifact uploader
        if: always() && env.FS_QUALITY_CACHE_ROOT != ''
        run: ./core/entrypoints/cli/scripts/hosted-quality.sh prepare-artifacts
      - name: Retain stress diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: stress-${{ github.sha }}-${{ github.run_attempt }}
          path: logs/quality/hosted
          retention-days: 7
          if-no-files-found: warn
