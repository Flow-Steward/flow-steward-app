      outcome:
        name: success
      target:
        kind: step
        id: summary_shape_require
      rework: false
    - source:
        kind: step
        id: summary_shape_require
      outcome:
        name: 'true'
      target:
        kind: step
        id: format_digest
      rework: false
    - source:
        kind: step
        id: summary_shape_require
      outcome:
        name: 'false'
      target:
        kind: step
