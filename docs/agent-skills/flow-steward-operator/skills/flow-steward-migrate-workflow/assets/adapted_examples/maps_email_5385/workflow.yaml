- workflow_id: n8n_5385_query
  version: 0.1.0
  display_name: n8n_5385_query
  description: Disabled business-equivalent adapted draft; consult setup and migration
    metadata.
  enabled: false
  trigger: {}
  settings:
    portability:
      import_state: draft
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: true
      expected_inputs:
      - *id001
      - *id002
      - *id003
      - name: query
        type: string
        required: true
      expected_outputs: []
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
  participants: []
  tags:
  - migration
  - unbound
  steps:
  - step_id: setup_inputs
    step_kind: set_variable
    display_name: setup_inputs
    optional: false
    override:
      set_variable:
        assignments:
          state.setup_inputs.connection_ref:
            source: state.inputs.connection_ref
          state.setup_inputs.spreadsheet_id:
            source: state.inputs.spreadsheet_id
          state.setup_inputs.sheet_title:
            source: state.inputs.sheet_title
          state.setup_inputs.query:
            source: state.inputs.query
    error_policy:
      on_error: route_to_step
  - step_id: setup
    step_kind: template
    display_name: setup
    optional: false
    override:
      template:
        text: '{{ ''ready'' if i.connection_ref and i.spreadsheet_id and i.sheet_title
          else ''invalid'' }}'
        format: text
        inputs:
        - name: i
          source: state.setup_inputs
          type: json
          required: true
        result_target: state.check_setup
    error_policy:
      on_error: route_to_step
  - step_id: setup_ok
    step_kind: if
    display_name: setup_ok
    optional: false
    override:
      if:
        condition:
          selector: state.check_setup
          operator: equals
          value: ready
    error_policy:
      on_error: route_to_step
  - step_id: initialize
    step_kind: set_variable
    display_name: initialize
    optional: false
    override:
      set_variable:
        assignments:
          state.seen: {}
          state.urls_seen: {}
    error_policy:
      on_error: route_to_step
  - step_id: maps
    step_kind: http_request
    display_name: maps
    optional: false
    override:
      http_request:
        method: GET
        url: https://www.google.com/maps/search/{{ state.inputs.query }}
        headers:
          Accept: text/html
        query_params: {}
        auth_mode: none
        auth_ref: ''
        timeout_seconds: 45
        expected_statuses:
        - 200
        response_mode: inline
        max_response_bytes: 1048576
        response_target: state.maps
    error_policy:
      on_error: route_to_step
  - step_id: maps_bound
    step_kind: template
    display_name: maps_bound
    optional: false
    override:
      template:
        text: '{{ ''ready'' if html is string and html|length <= 30000 else ''invalid''
          }}'
        format: text
        inputs:
        - name: html
          source: state.maps
          type: json
          required: true
        result_target: state.check_maps_bound
    error_policy:
      on_error: route_to_step
  - step_id: maps_bound_ok
    step_kind: if
    display_name: maps_bound_ok
    optional: false
    override:
      if:
        condition:
          selector: state.check_maps_bound
          operator: equals
          value: ready
    error_policy:
      on_error: route_to_step
  - step_id: urls_pattern
    step_kind: set_variable
    display_name: urls_pattern
    optional: false
    override:
      set_variable:
        assignments:
          state.urls_pattern: https?://[^/\s\"'>]+
          state.urls_flags: ''
    error_policy:
      on_error: route_to_step
  - step_id: urls
    step_kind: connector
    display_name: urls
    optional: false
    connector_id: connector.std.text
    override:
      connector:
        function_name: regex_find_all
        input_mapping:
          value: state.maps
          pattern: state.urls_pattern
          flags: state.urls_flags
        output_mapping:
          result: state.urls
    error_policy:
      on_error: route_to_step
  - step_id: urls_provenance
    step_kind: template
    display_name: urls_provenance
    optional: false
    override:
      template:
        text: '{%- set ns=namespace(ok=vs is sequence and vs is not string and vs
          is not mapping and vs|length <= 100) -%}{%- for v in vs -%}{%- if v is not
          string or not v or v not in html -%}{%- set ns.ok=false -%}{%- endif -%}{%-
          endfor -%}{{ ''ready'' if ns.ok else ''invalid'' }}'
        format: text
        inputs:
        - name: vs
          source: state.urls
          type: json
          required: true
        - name: html
          source: state.maps
          type: json
          required: true
        result_target: state.check_urls_provenance
    error_policy:
      on_error: route_to_step
  - step_id: urls_provenance_ok
    step_kind: if
    display_name: urls_provenance_ok
    optional: false
    override:
      if:
        condition:
          selector: state.check_urls_provenance
          operator: equals
          value: ready
    error_policy:
      on_error: route_to_step
  - step_id: url_filter
    step_kind: template
    display_name: url_filter
    optional: false
    override:
      template:
        text: '{{ ''ready'' if u is string and (u.startswith(''https://'') or u.startswith(''http'' ~ ''://''))
          and ''/'' not in u.split(''://'',1)[-1] and ''?'' not in u and ''#'' not
          in u and ''@'' not in u and '' '' not in u and ''\n'' not in u and u not
          in seen and ''schema'' not in u and ''google'' not in u and ''gg'' not in
          u and ''gstatic'' not in u and seen|length < 10 else ''skip'' }}'
        format: text
        inputs:
        - name: u
          source: state.url
          type: json
          required: true
        - name: seen
          source: state.urls_seen
          type: json
          required: true
        result_target: state.url_filter
    error_policy:
      on_error: route_to_step
    for_each_id: url_items
  - step_id: url_filter_ok
    step_kind: if
    display_name: url_filter_ok
    optional: false
    override:
      if:
        condition:
          selector: state.url_filter
          operator: equals
          value: ready
    error_policy:
      on_error: route_to_step
    for_each_id: url_items
  - step_id: remember_url
    step_kind: collect
    display_name: remember_url
    optional: false
    override:
      collect:
        mode: set_key
        source: state.url
        target: state.urls_seen
        key:
          source: state.url
    error_policy:
      on_error: route_to_step
    for_each_id: url_items
  - step_id: page_child
    step_kind: invoke_workflow
    display_name: page_child
    optional: false
    workflow_id: n8n_5385_page
    override:
      invoke_workflow:
        workflow_id: n8n_5385_page
        input_mapping:
          url: state.url
          seen: state.seen
        output_mapping:
          seen: state.seen
    error_policy:
      on_error: route_to_step
    for_each_id: url_items
  - step_id: next_url
    step_kind: continue
    display_name: next_url
    optional: false
    override:
      continue: {}
    for_each_id: url_items
  - step_id: email_values_input
    step_kind: set_variable
    display_name: email_values_input
    optional: false
    override:
      set_variable:
        assignments:
          state.email_values_input.value0:
            source: state.seen
    error_policy:
      on_error: route_to_step
  - step_id: email_values
    step_kind: transform
    display_name: email_values
    optional: false
    override:
      transform:
        mode: object
        input:
          source: state.email_values_input
        fields:
        - from: value0
          to: items
          type: array
          required: true
          actions:
          - action: json.values
        output_mode: mapped_only
        result_target: state.email_values
    error_policy:
      on_error: route_to_step
  - step_id: completion_wait
    step_kind: wait
    display_name: completion_wait
    optional: false
    override:
      wait:
        duration_ms: 5000
    error_policy:
      on_error: route_to_step
  - step_id: append_email_args
    step_kind: set_variable
    display_name: append_email_args
    optional: false
    override:
      set_variable:
        assignments:
          state.append_email_args.connection_ref:
            source: state.inputs.connection_ref
          state.append_email_args.spreadsheet_id:
            source: state.inputs.spreadsheet_id
          state.append_email_args.sheet_title:
            source: state.inputs.sheet_title
          state.append_email_args.table_range: A:A
    error_policy:
      on_error: route_to_step
    for_each_id: write_emails
  - step_id: append_email_matrix_cells
