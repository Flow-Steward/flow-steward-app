- workflow_id: n8n_5385_page
  version: 0.1.0
  display_name: n8n_5385_page
  description: Disabled business-equivalent adapted draft; consult setup and migration
    metadata.
  enabled: false
  trigger: {}
  settings:
    portability:
      import_state: draft
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: true
      expected_inputs:
      - name: url
        type: string
        required: true
      - name: seen
        type: object
        required: true
      expected_outputs:
      - name: seen
        type: object
        required: true
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
  participants: []
  tags:
  - migration
  - unbound
  steps:
  - step_id: setup
    step_kind: set_variable
    display_name: setup
    optional: false
    override:
      set_variable:
        assignments:
          state.seen:
            source: state.inputs.seen
    error_policy:
      on_error: route_to_step
  - step_id: fetch_page
    step_kind: http_request
    display_name: fetch_page
    optional: false
    override:
      http_request:
        method: GET
        url: '{{ state.inputs.url }}'
        headers:
          Accept: text/html
        query_params: {}
        auth_mode: none
        auth_ref: ''
        timeout_seconds: 45
        expected_statuses:
        - 200
        response_mode: inline
        max_response_bytes: 1048576
        response_target: state.page
    error_policy:
      on_error: route_to_step
  - step_id: throttle
    step_kind: wait
    display_name: throttle
    optional: false
    override:
      wait:
        duration_ms: 1000
    error_policy:
      on_error: route_to_step
  - step_id: html_bound
    step_kind: template
    display_name: html_bound
    optional: false
    override:
      template:
        text: '{{ ''ready'' if html is string and html|length <= 30000 else ''invalid''
          }}'
        format: text
        inputs:
        - name: html
          source: state.page
          type: json
          required: true
        result_target: state.check_html_bound
    error_policy:
      on_error: route_to_step
  - step_id: html_bound_ok
    step_kind: if
    display_name: html_bound_ok
    optional: false
    override:
      if:
        condition:
          selector: state.check_html_bound
          operator: equals
          value: ready
    error_policy:
      on_error: route_to_step
  - step_id: emails_pattern
    step_kind: set_variable
    display_name: emails_pattern
    optional: false
    override:
      set_variable:
        assignments:
          state.emails_pattern: '[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.(?!jpeg|jpg|png|gif|webp|svg)[a-zA-Z]{2,}'
          state.emails_flags: ''
    error_policy:
      on_error: route_to_step
  - step_id: emails
    step_kind: connector
    display_name: emails
    optional: false
    connector_id: connector.std.text
    override:
      connector:
        function_name: regex_find_all
        input_mapping:
          value: state.page
          pattern: state.emails_pattern
          flags: state.emails_flags
        output_mapping:
          result: state.extracted
    error_policy:
      on_error: route_to_step
  - step_id: emails_provenance
    step_kind: template
    display_name: emails_provenance
    optional: false
    override:
      template:
        text: '{%- set ns=namespace(ok=vs is sequence and vs is not string and vs
          is not mapping and vs|length <= 100) -%}{%- for v in vs -%}{%- if v is not
          string or not v or v not in html -%}{%- set ns.ok=false -%}{%- endif -%}{%-
          endfor -%}{{ ''ready'' if ns.ok else ''invalid'' }}'
        format: text
        inputs:
        - name: vs
          source: state.extracted
          type: json
          required: true
        - name: html
          source: state.page
          type: json
          required: true
        result_target: state.check_emails_provenance
    error_policy:
      on_error: route_to_step
  - step_id: emails_provenance_ok
    step_kind: if
    display_name: emails_provenance_ok
    optional: false
    override:
      if:
        condition:
          selector: state.check_emails_provenance
          operator: equals
          value: ready
    error_policy:
      on_error: route_to_step
  - step_id: email_filter
    step_kind: template
    display_name: email_filter
    optional: false
    override:
      template:
        text: '{{ ''ready'' if e is string and ''@'' in e and ''.'' in e.split(''@'')[-1]
          and e not in seen else ''skip'' }}'
        format: text
        inputs:
        - name: e
          source: state.email
          type: json
          required: true
        - name: seen
          source: state.seen
          type: json
          required: true
        result_target: state.filter
    error_policy:
      on_error: route_to_step
    for_each_id: email_items
  - step_id: email_filter_ok
    step_kind: if
    display_name: email_filter_ok
    optional: false
    override:
      if:
        condition:
          selector: state.filter
          operator: equals
          value: ready
    error_policy:
      on_error: route_to_step
    for_each_id: email_items
  - step_id: remember
    step_kind: collect
    display_name: remember
    optional: false
    override:
      collect:
        mode: set_key
        source: state.email
        target: state.seen
        key:
          source: state.email
    error_policy:
      on_error: route_to_step
    for_each_id: email_items
  - step_id: next_email
    step_kind: continue
    display_name: next_email
    optional: false
    override:
      continue: {}
    for_each_id: email_items
  - step_id: done
    step_kind: stop_success
    display_name: done
    optional: false
    override:
      stop_success:
        message: Completed within documented adapted input envelope.
  - step_id: failed
    step_kind: stop_fail
    display_name: failed
    optional: false
    override:
      stop_fail:
        message: Input/setup/shape/provider/provenance failure. No automatic retry;
          inspect partial external effects before retry.
  - step_id: failed_email_items
    step_kind: stop_fail
    display_name: failed_email_items
    optional: false
    override:
      stop_fail:
        message: Fail closed inside item scope; parent/container must inspect partial
          external effects before retry.
    for_each_id: email_items
  groups: []
  for_each:
