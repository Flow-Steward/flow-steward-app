schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  source_workflow_id: n8n_5385
  external_template_id: 5385
  migration_mode: business_equivalent_adaptation
  status: unbound_draft
  runtime_verified: false
  setup_required: true
  behavior_changes:
  - URL/email extraction now uses deterministic native StandardTools regex_find_all
    with source-compatible patterns, full match strings, Python regex VERSION0 and
    empty flags. No model or agent is used. Global JS match is represented by regex_find_all;
    no-match returns [] instead of legacy null/map failures.
  - HTML must fit 30000 characters and response limit 1MiB; extraction <=100 values
    or fail closed. Native regex also enforces input<=1MiB characters, pattern<=4096,
    <=1000 matches without truncation and 0.1-second timeout.
  - Within-query ordered unique emails; append only, no cross-run deduplication. Source
    case-sensitive filter alternatives retained. Origin shape guard additionally rejects
    malformed origins, paths, query/fragment and userinfo instead of attempting invalid
    source URLs.
  - Provider errors do not automatically retry; inspect any completed appends before
    re-running.
  - TLS verification remains enabled; invalid-certificate acceptance deliberately
    removed.
  - First 10 filtered unique origins; site fetch failures continue without contribution;
    1-second per-page and 5-second completion waits preserved.
  source_sha256: a5227c79b85a9d961194e9163f9a01e823d97e9cef62c60e98e428ca75ce0c99 # pragma: allowlist secret -- public source content SHA-256, not a credential
  inventory_evidence:
    record: logs/workflow-migration/batch-15/inventory.json
    current_evidence_reinspected: '2026-11-01'
    network_refresh_performed: false
    reason: Explicit offline instruction; published local operation contracts re-read,
      live installed IDs/arguments unverified
  trigger_setup:
    schedule: manual and callable; no schedule
  unperformed_checks:
  - target import/save
  - engine execution
  - installed tool schema verification
  - provider/network requests
workflows:
- workflow_id: n8n_5385
  version: 0.1.0
  display_name: n8n_5385
  description: Disabled business-equivalent adapted draft; consult setup and migration
    metadata.
  enabled: false
  trigger: {}
  settings:
    portability:
      import_state: draft
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: true
      expected_inputs:
      - &id001
        name: connection_ref
        type: string
        required: true
      - &id002
        name: spreadsheet_id
        type: string
        required: true
      - &id003
        name: sheet_title
        type: string
        required: true
      - name: query
        type: string
        required: true
        default: calgary+dentists
      expected_outputs: []
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
  participants: []
  tags:
  - migration
  - unbound
  steps:
  - step_id: setup_inputs
    step_kind: set_variable
    display_name: setup_inputs
    optional: false
    override:
      set_variable:
        assignments:
          state.setup_inputs.connection_ref:
            source: state.inputs.connection_ref
          state.setup_inputs.spreadsheet_id:
            source: state.inputs.spreadsheet_id
          state.setup_inputs.sheet_title:
            source: state.inputs.sheet_title
          state.setup_inputs.query:
            source: state.inputs.query
    error_policy:
      on_error: route_to_step
  - step_id: setup
    step_kind: template
    display_name: setup
    optional: false
    override:
      template:
        text: '{{ ''ready'' if i.connection_ref and i.spreadsheet_id and i.sheet_title
          and i.query is string and 0 < i.query|length <= 500 else ''invalid'' }}'
        format: text
        inputs:
        - name: i
          source: state.setup_inputs
          type: json
          required: true
        result_target: state.check_setup
    error_policy:
      on_error: route_to_step
  - step_id: setup_ok
    step_kind: if
    display_name: setup_ok
    optional: false
    override:
      if:
        condition:
          selector: state.check_setup
          operator: equals
          value: ready
    error_policy:
      on_error: route_to_step
  - step_id: query_child
    step_kind: invoke_workflow
    display_name: query_child
    optional: false
    workflow_id: n8n_5385_query
    override:
      invoke_workflow:
        workflow_id: n8n_5385_query
        input_mapping:
          connection_ref: state.inputs.connection_ref
          spreadsheet_id: state.inputs.spreadsheet_id
          sheet_title: state.inputs.sheet_title
          query: state.inputs.query
        output_mapping: {}
    error_policy:
      on_error: route_to_step
  - step_id: done
    step_kind: stop_success
    display_name: done
    optional: false
    override:
      stop_success:
        message: Completed within documented adapted input envelope.
  - step_id: failed
    step_kind: stop_fail
    display_name: failed
    optional: false
    override:
      stop_fail:
        message: Input/setup/shape/provider/provenance failure. No automatic retry;
          inspect partial external effects before retry.
  groups: []
  for_each: []
  execution_graph:
    schema_version: 1
    entry:
      id: setup_inputs
      kind: step
    edges:
