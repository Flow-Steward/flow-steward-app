    "behavior_changes": [
      "Clock is explicit reporting_reference_at with UTC calendar policy; scheduler must inject its authenticated actual invocation timestamp. Manual/API replay intentionally chooses period; not a trusted runtime-clock claim.",
      "Previous month uses half-open [first day, first next month) UTC, fixing source exclusion of last-day timestamps.",
      "All matched rows are aggregated into one report and one model call, fixing per-item source prompt $json and multiple sends.",
      "Source Gmail node lacks recipient/body; use published SMTP send_email with setup recipient, connection sender and deterministic body. SMTP is an explicit delivery-channel adaptation.",
      "Single-currency positive Income/Expense convention, strict dates and decimal Amount grammar are setup assumptions, not inferred transaction facts.",
      "At most 100 rows in the entire A:E table; complete preview/count/schema must reconcile. Larger/incomplete data fails without send. No NDJSON/Tabular Feed interchange assumed.",
      "Empty month sends one explicit zero report without model call; source zero-item pipeline would stop without a report.",
      "Fail closed on any malformed row including outside selected month; source silently dropped missing/invalid dates. No automatic retries; uncertain SMTP failures remain failures requiring reconciliation.",
      "Monthly schedule day/time/timezone absent in export defaults are not inferred. Proposed reviewed schedule is 00:10 UTC day 1; disabled external schedule provisioning required."
    ],
