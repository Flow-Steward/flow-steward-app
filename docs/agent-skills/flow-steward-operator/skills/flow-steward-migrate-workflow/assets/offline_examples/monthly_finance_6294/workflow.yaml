          "optional": false,
          "override": {
            "template": {
              "text": "{%- set ns=namespace(ok=count is integer and count >= 0 and count <= 100 and rows|length == count and cols == 5 and columns|map(attribute='name')|list == ['Date','Category','Description','Amount','Type'] and rows|tojson|length <= 100000) -%}\n{%- for r in rows -%}\n{%- if r is not mapping -%}{%- set ns.ok=false -%}{%- else -%}\n{%- set d=r.get('Date') -%}{%- set a=r.get('Amount') -%}\n{%- if d is not string or a is not string or r.get('Type') not in ['Income','Expense'] or r.get('Category') is not string or r.get('Description') is not string -%}{%- set ns.ok=false -%}\n{%- else -%}\n{%- set z=namespace(ok=d|length in [10,20]) -%}\n{%- for c in d[:4]+d[5:7]+d[8:10] -%}{%- if c not in '0123456789' -%}{%- set z.ok=false -%}{%- endif -%}{%- endfor -%}\n{%- if d[4:5] != '-' or d[7:8] != '-' -%}{%- set z.ok=false -%}{%- endif -%}\n{%- if z.ok -%}{%- set y=d[:4]|int -%}{%- set m=d[5:7]|int -%}{%- set day=d[8:10]|int -%}\n{%- set days=[31,29 if y%4==0 and (y%100!=0 or y%400==0) else 28,31,30,31,30,31,31,30,31,30,31] -%}\n{%- if y<1 or m<1 or m>12 or day<1 or (m>=1 and m<=12 and day>days[m-1]) -%}{%- set z.ok=false -%}{%- endif -%}\n{%- endif -%}\n{%- if d|length == 20 -%}\n{%- for c in d[11:13]+d[14:16]+d[17:19] -%}{%- if c not in '0123456789' -%}{%- set z.ok=false -%}{%- endif -%}{%- endfor -%}\n{%- if d[10:11]!='T' or d[13:14]!=':' or d[16:17]!=':' or d[19:]!='Z' or d[11:13]|int>23 or d[14:16]|int>59 or d[17:19]|int>59 -%}{%- set z.ok=false -%}{%- endif -%}\n{%- endif -%}\n{%- set parts=a.split('.') -%}\n{%- if parts|length>2 or parts[0]|length<1 or parts[0]|length>9 or (parts|length==2 and parts[1]|length not in [1,2]) -%}{%- set z.ok=false -%}{%- endif -%}\n{%- for c in a -%}{%- if c not in '0123456789.' -%}{%- set z.ok=false -%}{%- endif -%}{%- endfor -%}\n{%- if r.Category|length>200 or r.Description|length>200 or '\\n' in r.Category or '\\n' in r.Description or '\\r' in r.Category or '\\r' in r.Description -%}{%- set z.ok=false -%}{%- endif -%}\n{%- if not z.ok -%}{%- set ns.ok=false -%}{%- endif -%}\n{%- endif -%}{%- endif -%}{%- endfor -%}{{ 'ready' if ns.ok else 'blocked' }}",
              "format": "text",
              "inputs": [
