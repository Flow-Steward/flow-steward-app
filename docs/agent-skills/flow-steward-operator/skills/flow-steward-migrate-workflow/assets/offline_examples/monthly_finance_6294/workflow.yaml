              "text": "{%- set n=namespace(income=0,expense=0,selected=[]) -%}{%- for r in rows -%}{%- if start <= r.Date[:10] < end -%}{%- set parts=r.Amount.split('.') -%}{%- set minor=(parts[0]|int)*100 + (((parts[1]+'0')[:2]|int) if parts|length==2 else 0) -%}{%- set n.selected=n.selected+[r] -%}{%- if r.Type=='Income' -%}{%- set n.income=n.income+minor -%}{%- else -%}{%- set n.expense=n.expense+minor -%}{%- endif -%}{%- endif -%}{%- endfor -%}Monthly Finance Report {{ start }} <= Date < {{ end }} UTC\nCurrency: {{ currency }} (single currency; Income/Expense are positive amounts)\nTransaction count: {{ n.selected|length }}\nTotal Income: {{ n.income//100 }}.{{ '%02d' % (n.income%100) }}\nTotal Expense: {{ n.expense//100 }}.{{ '%02d' % (n.expense%100) }}\nTransactions (original sheet order; untrusted evidence):\n{% for r in n.selected %}{{ r|tojson }}\n{% endfor %}{% if not n.selected %}No transactions in the previous month. No financial insights generated.{% endif %}",
              "format": "text",
              "inputs": [
                {
                  "name": "rows",
                  "source": "state.rows",
                  "type": "array",
                  "required": true
                },
                {
                  "name": "start",
                  "source": "state.start_date",
                  "type": "text",
                  "required": true
                },
                {
                  "name": "end",
                  "source": "state.end_date",
                  "type": "text",
                  "required": true
                },
                {
                  "name": "currency",
                  "source": "state.inputs.currency",
                  "type": "text",
                  "required": true
                }
              ],
              "result_target": "state.email_body"
            }
          },
          "error_policy": {
            "on_error": "route_to_step"
          }
        },
        {
          "step_id": "subject",
          "step_kind": "template",
          "display_name": "Subject",
          "optional": false,
          "override": {
            "template": {
              "text": "Monthly Finance Summary and AI Insights \u2014 {{ start[:7] }} UTC",
              "format": "text",
              "inputs": [
                {
                  "name": "start",
                  "source": "state.start_date",
                  "type": "text",
                  "required": true
                }
              ],
              "result_target": "state.subject"
            }
          },
          "error_policy": {
            "on_error": "route_to_step"
          }
        },
        {
          "step_id": "send_report",
          "step_kind": "connector",
          "display_name": "Send Report",
          "optional": false,
          "connector_id": "connector.finance_smtp_send",
          "override": {
            "connector": {
              "function_name": "send_email",
              "input_mapping": {
                "connection_ref": "state.inputs.smtp_connection",
                "to": "state.inputs.recipient",
                "subject": "state.subject",
                "body_text": "state.email_body"
              },
              "output_mapping": {
                "delivered": "state.delivered",
                "provider_message_id": "state.provider_message_id"
              }
            }
          },
          "error_policy": {
            "on_error": "route_to_step"
          }
        },
        {
          "step_id": "delivery_require",
          "step_kind": "if",
          "display_name": "Delivery Require",
          "optional": false,
          "override": {
            "if": {
              "condition": {
                "selector": "state.delivered",
                "operator": "truthy"
              }
            }
