schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  source_workflow_id: catalog_search_tavily
  portability_kind: workflow_bundle
  flow_steward_version: 0.9.9
  triggers: []
workflows:
- workflow_id: catalog_search_tavily
  version: 1.0.2
  display_name: Search the web with Tavily
  description: UNPUBLISHED DRAFT. Bounded synchronous search with a required secret input and provider-specific
    response guards. No follow-up pages. Provider authentication, account access and quota have not been
    tested against a live service.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: true
      expected_inputs:
      - name: query
        type: string
        label: Search query
        required: true
        description: A nonempty search query, at most 2000 characters.
      - name: provider_credential
        type: secret
        label: tavily credential
        required: true
        description: Configure the provider key through the workflow secret input. Never place its value
          in the YAML.
      expected_outputs:
      - name: response
        type: object
        required: true
        description: Provider JSON response. Search items are in response.results; formats differ by provider.
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
    portability:
      import_state: draft
    participants: []
  participants: []
  tags:
  - b2b
  - research
  - search
  - tavily
  steps:
  - step_id: check_query
    step_kind: template
    display_name: Check that a search query was supplied
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''valid'' if query|trim|length > 0 and query|length <= 2000 else ''invalid'' }}'
        format: text
        inputs:
        - name: query
          type: text
          source: state.inputs.query
          required: true
        result_target: state.query_check
  - step_id: require_query
    step_kind: if
    display_name: require_query
    optional: false
    override:
      if:
        condition:
          value: valid
          operator: equals
          selector: state.query_check
  - step_id: search
    step_kind: http_request
    display_name: Search the web with Tavily
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      http_request:
        url: https://api.tavily.com/search
        method: POST
        headers:
          Accept: application/json
          Content-Type: application/json
          Authorization: Bearer {{ state.inputs.provider_credential }}
        auth_ref: ''
        auth_mode: none
        query_params: {}
        body_template:
          query: '{{ state.inputs.query }}'
          max_results: 5
          search_depth: basic
          include_answer: false
          include_raw_content: false
        response_mode: inline
        response_target: state.search
        timeout_seconds: 45
        expected_statuses:
        - 200
        max_response_bytes: 1048576
  - step_id: provider_error
    step_kind: if
    display_name: provider_error
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.search.error
  - step_id: return_response
    step_kind: set_variable
    display_name: return_response
    optional: false
    override:
      set_variable:
        value:
          source: state.search
        target: state.outputs.response
  - step_id: done
    step_kind: stop_success
    display_name: done
    optional: false
    override:
      stop_success:
        message: The provider returned the first search response. No follow-up pages were requested.
  - step_id: failed
    step_kind: stop_fail
    display_name: failed
    optional: false
    override:
      stop_fail:
        message: Search did not complete. Check the query, provider credential, HTTP status, quota and
          provider error in the run details.
  - step_id: check_response_shape
    step_kind: template
    display_name: Check provider response envelope
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: "{%- set ns = namespace(valid=false) -%}\n{%- if response is mapping and response.get('results')\
          \ is sequence and response.results is not string and response.results is not mapping and not\
          \ response.get('error') -%}\n  {%- set ns.valid = true -%}\n  {%- for item in response.results\
          \ -%}\n    {%- if item is not mapping -%}{%- set ns.valid = false -%}{%- endif -%}\n\n  {%-\
          \ endfor -%}\n  {%- if response.get('detail') is mapping and response.detail.get('error') -%}{%-\
          \ set ns.valid = false -%}{%- endif -%}\n{%- endif -%}\n{{- 'valid' if ns.valid else 'invalid'\
          \ -}}"
        format: text
        inputs:
        - name: response
          type: json
          source: state.search
          required: true
        result_target: state.response_shape_status
  - step_id: require_response_shape
    step_kind: if
    display_name: Require a valid provider response envelope
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: valid
          operator: equals
          selector: state.response_shape_status
  groups: []
  for_each: []
  execution_graph:
    edges:
    - rework: false
      source:
        id: check_query
        kind: step
      target:
        id: require_query
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: check_query
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: require_query
        kind: step
      target:
        id: search
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: require_query
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: search
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: provider_error
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: provider_error
        kind: step
      target:
        id: return_response
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: return_response
        kind: step
      target:
        id: done
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: search
        kind: step
      target:
        id: check_response_shape
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: check_response_shape
        kind: step
      target:
        id: require_response_shape
        kind: step
      outcome:
        name: success
    - rework: false
      source:
        id: check_response_shape
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: error
    - rework: false
      source:
        id: require_response_shape
        kind: step
      target:
        id: provider_error
        kind: step
      outcome:
        name: 'true'
    - rework: false
      source:
        id: require_response_shape
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: 'false'
    - rework: false
      source:
        id: require_response_shape
        kind: step
      target:
        id: failed
        kind: step
      outcome:
        name: error
    entry:
      id: check_query
      kind: step
    schema_version: 1
dependencies:
  agents: []
  skills: []
  tools: []
  child_workflows: []
  published_blocks: []
  extensions: []
  project_connections: []
import_hints:
  default_enabled: false
  import_state: draft
  conflict_policy: rename_workflow
