  - step_id: is_read
    step_kind: if
    display_name: Is Read
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.inputs.message.isRead
  - step_id: move_actioned
    step_kind: http_request
    display_name: Move Actioned
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      http_request:
        url: https://graph.microsoft.com/v1.0/me/messages/{{ state.inputs.message.id
          }}/move
        method: POST
        headers:
          Content-Type: application/json
          Authorization: Bearer {{ state.inputs.graph_auth_ref }}
        auth_ref: ''
        auth_mode: none
        query_params: {}
        body_template:
          destinationId:
            source: state.inputs.actioned_id
        response_mode: inline
        response_target: state.moved
        timeout_seconds: 45
        expected_statuses:
        - 200
        - 201
        - 202
        - 204
        max_response_bytes: 2097152
  - step_id: done
    step_kind: stop_success
    display_name: Done
    optional: false
    override:
      stop_success:
        message: All selected items completed within the declared input envelope.
  - step_id: failed
