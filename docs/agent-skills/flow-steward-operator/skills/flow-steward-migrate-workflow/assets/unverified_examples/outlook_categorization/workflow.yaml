workflows:
- workflow_id: n8n_2454_categorize_outlook
  version: 1.0.0
  display_name: Categorize Outlook emails with AI
  description: Classify one Outlook inbox message and route it through seven category
    outcomes using Microsoft Graph and a project-configured AI model. Includes the
    message-processing child and classifier definitions. Manual invocation retains
    the source one-message fetch limit; this is not a complete mailbox sweep. Category
    replacement and message moves are external writes with no automatic retry. Configure
    the Mail.ReadWrite OAuth token and destination folders before running. Imported
    and statically validated on Flow Steward 0.9.9; provider and model execution have
    not been tested.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: true
      expected_inputs:
      - name: setup_confirmed
        type: boolean
        required: true
      - name: graph_credential
        type: secret
        required: true
      - name: inbox_id
        type: string
        required: true
      - name: junk_id
        type: string
        required: true
      - name: receipt_id
        type: string
        required: true
      - name: saas_id
        type: string
        required: true
      - name: community_id
        type: string
        required: true
      - name: actioned_id
        type: string
        required: true
      expected_outputs: []
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
    portability:
      import_state: draft
  participants: []
  tags:
  - n8n
  - migration
  - email
  - outlook
  - b2b
  steps:
  - step_id: setup_guard
    step_kind: template
    display_name: Setup Guard
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''ready'' if ready else ''blocked'' }}'
        format: text
        inputs:
        - name: ready
          type: boolean
          source: state.inputs.setup_confirmed
          required: true
        result_target: state.setup_guard
  - step_id: setup_guard_require
    step_kind: if
    display_name: Setup Guard Require
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: ready
          operator: equals
          selector: state.setup_guard
  - step_id: list_parameters
    step_kind: set_variable
    display_name: List Parameters
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.limit: 1
          state.mail_filter: flag/flagStatus eq 'notFlagged' and not categories/any()
  - step_id: list_mail
    step_kind: http_request
    display_name: List Mail
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      http_request:
        url: https://graph.microsoft.com/v1.0/me/mailFolders/{{ state.inputs.inbox_id
          }}/messages?$top=1&$filter=flag/flagStatus%20eq%20%27notFlagged%27%20and%20not%20categories/any()&$select=id,subject,importance,sender,from,body,categories,isRead
        method: GET
        headers:
          Authorization: Bearer {{ state.inputs.graph_credential }}
        auth_ref: ''
        auth_mode: none
        query_params: {}
        body_template: ''
        response_mode: inline
        response_target: state.listed
        timeout_seconds: 45
        expected_statuses:
        - 200
        - 201
        - 202
        - 204
        max_response_bytes: 2097152
  - step_id: list_projection
    step_kind: transform
    display_name: List Projection
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      transform:
        mode: object
        input:
          source: state.listed
        fields:
        - to: messages
          from: value
          type: array
          required: true
        output_mode: mapped_only
        result_target: state.mail_page
  - step_id: set_messages
    step_kind: set_variable
    display_name: Set Messages
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.outlook_messages:
            source: state.mail_page.messages
  - step_id: mail_bound
    step_kind: template
    display_name: Mail Bound
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''ready'' if messages is sequence and messages is not string and
          messages is not mapping and messages|length <= 1 else ''blocked'' }}'
        format: text
        inputs:
        - name: messages
          type: array
          source: state.outlook_messages
          required: true
        result_target: state.mail_bound
  - step_id: mail_bound_require
    step_kind: if
    display_name: Mail Bound Require
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: ready
          operator: equals
          selector: state.mail_bound
  - step_id: process_message
    step_kind: invoke_workflow
    for_each_id: items
    display_name: Process Message
    workflow_id: n8n_2454_process_message
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      invoke_workflow:
        workflow_id: n8n_2454_process_message
        input_mapping:
          junk_id: state.inputs.junk_id
          message: state.item
          saas_id: state.inputs.saas_id
          receipt_id: state.inputs.receipt_id
          actioned_id: state.inputs.actioned_id
          community_id: state.inputs.community_id
          graph_auth_ref: state.inputs.graph_credential
        output_mapping: {}
  - step_id: done
    step_kind: stop_success
    display_name: Done
    optional: false
    override:
      stop_success:
        message: All selected items completed within the declared input envelope.
  - step_id: failed
    step_kind: stop_fail
    display_name: Failed
    optional: false
    override:
      stop_fail:
        message: Input, dependency, response shape or external effect failed. Do not
          retry uncertain writes without reconciliation.
  - step_id: items_failed
    step_kind: stop_fail
    for_each_id: items
    display_name: Items Failed
    optional: false
    override:
      stop_fail:
        message: Item processing failed; checkpoint was not accepted.
  groups: []
  for_each:
  - for_each_id: items
    group_id: null
    display_name: Items
    over: state.outlook_messages
    item_name: item
    index_name: item_index
    body:
      kind: sequence
      entry:
        id: process_message
        kind: step
    error_policy:
      on_error: route_to_step
  execution_graph:
