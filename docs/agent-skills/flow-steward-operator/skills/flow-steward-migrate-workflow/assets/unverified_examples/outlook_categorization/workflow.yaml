- workflow_id: n8n_2454_process_message
  version: 1.0.0
  display_name: Classify and route one Outlook message
  description: Disabled full business-equivalent migration draft. See setup.json for
    unbound contracts and disclosed differences.
  trigger: {}
  settings:
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: true
      expected_inputs:
      - name: message
        type: object
        required: true
      - name: graph_auth_ref
        type: secret
        required: true
      - name: junk_id
        type: string
        required: true
      - name: receipt_id
        type: string
        required: true
      - name: saas_id
        type: string
        required: true
      - name: community_id
        type: string
        required: true
      - name: actioned_id
        type: string
        required: true
      expected_outputs: []
      trigger_channels:
      - ui
      - api
      - mcp
      - parent_workflow
    portability:
      import_state: draft
    participants: []
  participants: []
  tags:
  - migration
  - unbound-draft
  steps:
  - step_id: eligible
    step_kind: template
    display_name: Eligible
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''ready'' if message is mapping and message.get(''id'') and not
          message.get(''categories'') and message.get(''body'',{}) is mapping and
          message.get(''body'',{}).get(''content'','''')|length <= 30000 else ''blocked''
          }}'
        format: text
        inputs:
        - name: message
          type: object
          source: state.inputs.message
          required: true
        result_target: state.eligible
  - step_id: eligible_require
    step_kind: if
    display_name: Eligible Require
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: ready
          operator: equals
          selector: state.eligible
  - step_id: classify
    step_kind: agent
    display_name: Classify
    agent_id: migration_2454_classify
    skill_id: migration_2454_classify_skill
    input_mapping_jsonb:
      message: state.inputs.message
    output_mapping_jsonb:
      analysis: state.analysis
      category: state.category
      subCategory: state.subCategory
    error_policy:
      on_error: route_to_step
    optional: false
  - step_id: classification_shape
    step_kind: template
    display_name: Classification Shape
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''ready'' if category in [''action'',''junk'',''receipt'',''saas'',''community'',''business'',''other'']
          and sub in ['''',''action'',''junk'',''receipt'',''saas'',''community'',''business'',''other'']
          and analysis is string and analysis|length > 0 else ''blocked'' }}'
        format: text
        inputs:
        - name: category
          type: text
          source: state.category
          required: true
        - name: sub
          type: text
          source: state.subCategory
          required: true
        - name: analysis
          type: text
          source: state.analysis
          required: true
        result_target: state.classification_shape
  - step_id: classification_shape_require
    step_kind: if
    display_name: Classification Shape Require
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          value: ready
          operator: equals
          selector: state.classification_shape
  - step_id: category_primary
    step_kind: template
    display_name: Category Primary
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ ''SaaS'' if value == ''saas'' else value[0]|upper ~ value[1:] }}'
        format: text
        inputs:
        - name: value
          type: text
          source: state.category
          required: true
        result_target: state.primary_label
  - step_id: category_secondary
    step_kind: template
    display_name: Category Secondary
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      template:
        text: '{{ (''SaaS'' if value == ''saas'' else value[0]|upper ~ value[1:])
          if value else '''' }}'
        format: text
        inputs:
        - name: value
          type: text
          source: state.subCategory
          required: true
        result_target: state.secondary_label
  - step_id: has_secondary
    step_kind: if
    display_name: Has Secondary
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      if:
        condition:
          operator: truthy
          selector: state.secondary_label
  - step_id: category_array
    step_kind: set_variable
    display_name: Category Array
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.label_container.labels.primary:
            source: state.primary_label
  - step_id: category_array_two
    step_kind: set_variable
    display_name: Category Array Two
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      set_variable:
        assignments:
          state.label_container.labels.primary:
            source: state.primary_label
          state.label_container.labels.secondary:
            source: state.secondary_label
  - step_id: typed_labels
    step_kind: transform
    display_name: Typed Labels
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      transform:
        mode: object
        input:
          source: state.label_container
        fields:
        - to: categories
          from: labels
          type: array
          actions:
          - action: json.values
          required: true
        output_mode: mapped_only
        result_target: state.normalized
  - step_id: update_categories
    step_kind: http_request
    display_name: Update Categories
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      http_request:
        url: https://graph.microsoft.com/v1.0/me/messages/{{ state.inputs.message.id
          }}
        method: PATCH
        headers:
          Content-Type: application/json
          Authorization: Bearer {{ state.inputs.graph_auth_ref }}
        auth_ref: ''
        auth_mode: none
        query_params: {}
        body_template:
          categories:
            source: state.normalized.categories
        response_mode: inline
        response_target: state.updated
        timeout_seconds: 45
        expected_statuses:
        - 200
        - 201
        - 202
        - 204
        max_response_bytes: 2097152
  - step_id: route
    step_kind: switch
    display_name: Route
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      switch:
        cases:
        - when: junk
          case_id: junk
        - when: receipt
          case_id: receipt
        - when: saas
          case_id: saas
        - when: community
          case_id: community
        - when: action
          case_id: action
        - when: business
          case_id: business
        - when: other
          case_id: other
        selector: state.category
  - step_id: move_junk
    step_kind: http_request
    display_name: Move Junk
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      http_request:
        url: https://graph.microsoft.com/v1.0/me/messages/{{ state.inputs.message.id
          }}/move
        method: POST
        headers:
          Content-Type: application/json
          Authorization: Bearer {{ state.inputs.graph_auth_ref }}
        auth_ref: ''
        auth_mode: none
        query_params: {}
        body_template:
          destinationId:
            source: state.inputs.junk_id
        response_mode: inline
        response_target: state.moved
        timeout_seconds: 45
        expected_statuses:
        - 200
        - 201
        - 202
        - 204
        max_response_bytes: 2097152
  - step_id: move_receipt
    step_kind: http_request
    display_name: Move Receipt
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      http_request:
        url: https://graph.microsoft.com/v1.0/me/messages/{{ state.inputs.message.id
          }}/move
        method: POST
        headers:
          Content-Type: application/json
          Authorization: Bearer {{ state.inputs.graph_auth_ref }}
        auth_ref: ''
        auth_mode: none
        query_params: {}
        body_template:
          destinationId:
            source: state.inputs.receipt_id
        response_mode: inline
        response_target: state.moved
        timeout_seconds: 45
        expected_statuses:
        - 200
        - 201
        - 202
        - 204
        max_response_bytes: 2097152
  - step_id: move_saas
    step_kind: http_request
    display_name: Move Saas
    error_policy:
      on_error: route_to_step
    optional: false
    override:
      http_request:
        url: https://graph.microsoft.com/v1.0/me/messages/{{ state.inputs.message.id
          }}/move
        method: POST
        headers:
          Content-Type: application/json
          Authorization: Bearer {{ state.inputs.graph_auth_ref }}
        auth_ref: ''
        auth_mode: none
        query_params: {}
        body_template:
          destinationId:
            source: state.inputs.saas_id
        response_mode: inline
        response_target: state.moved
