services:
  compact-runtime:
    networks:
      default: {}
      flow-steward-proxy:
        aliases:
          - "${FS_COMPOSE_PROJECT_NAME:-flow-steward}-compact-proxy"
    environment:
      # ADR 0029 (2026-11-27): trust the proxy network's range to name the client; the
      # runtime finds that network through its own alias on it.
      FS_FORWARDED_TRUST_MODE: proxy_network
      FS_FORWARDED_TRUST_PEER: "${FS_COMPOSE_PROJECT_NAME:-flow-steward}-compact-proxy"

networks:
  flow-steward-proxy:
    external: true
    name: ${FS_PROXY_NETWORK:?FS_PROXY_NETWORK is required}
