services:
  compact-runtime:
    ports:
      - "${PORT:-8080}:${FS_RUNTIME_HTTP_PORT:-8080}"
    environment:
      # ADR 0029 (2026-11-27): only the operator can name a platform's proxy
      # (FS_PROXY_TRUSTED_IPS); without it the runtime warns that visitors share one address.
      FS_FORWARDED_TRUST_MODE: operator
