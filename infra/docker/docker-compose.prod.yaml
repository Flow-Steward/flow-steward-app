x-installation-mode-environment: &installation-mode-environment
  # Only absent markers inherit; explicit blank/conflicting values must survive.
  ENVIRONMENT: ${ENVIRONMENT-${FS_STACK_ENVIRONMENT-production}}
  FS_STACK_ENVIRONMENT: ${FS_STACK_ENVIRONMENT-${ENVIRONMENT-production}}

x-role-common-environment: &role-common-environment
  ARTIFACT_LOCAL_ROOT_DIR: ${ARTIFACT_LOCAL_ROOT_DIR:-/app/logs/artifacts}
  ARTIFACT_S3_ACCESS_KEY: ${ARTIFACT_S3_ACCESS_KEY:-}
  ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-}
  ARTIFACT_S3_ENDPOINT_URL: ${ARTIFACT_S3_ENDPOINT_URL:-}
  ARTIFACT_S3_PUBLIC_ENDPOINT_URL: ${ARTIFACT_S3_PUBLIC_ENDPOINT_URL:-}
  ARTIFACT_S3_KEY_PREFIX: ${ARTIFACT_S3_KEY_PREFIX:-}
  ARTIFACT_S3_PRESIGN_TTL_SECONDS: ${ARTIFACT_S3_PRESIGN_TTL_SECONDS:-900}
  ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-}
  ARTIFACT_S3_SECRET_KEY: ${ARTIFACT_S3_SECRET_KEY:-}
  ARTIFACT_S3_USE_SSL: ${ARTIFACT_S3_USE_SSL:-1}
  ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-local_fs}
  FS_DB_DSN: ${FS_DB_DSN}
  FS_COMPOSE_PROJECT_NAME: ${FS_COMPOSE_PROJECT_NAME:-}
  FS_DEPLOYMENT_PROFILE: ${FS_DEPLOYMENT_PROFILE:-scalable}
  FS_INSTALLATION_ID: ${FS_INSTALLATION_ID:-}
  FS_MONITORING_EXPECTATIONS: ${FS_MONITORING_EXPECTATIONS:-}
  FS_MONITORING_DEPENDENCIES: ${FS_MONITORING_DEPENDENCIES:-}
  FS_MONITORING_INTERVAL_SECONDS: ${FS_MONITORING_INTERVAL_SECONDS:-}
  FS_MONITORING_STALE_SECONDS: ${FS_MONITORING_STALE_SECONDS:-}
  FS_MONITORING_HISTORY_ENABLED: ${FS_MONITORING_HISTORY_ENABLED:-}
  FS_MONITORING_CURRENT_RETENTION_DAYS: ${FS_MONITORING_CURRENT_RETENTION_DAYS:-}
  FS_MONITORING_HISTORY_RETENTION_DAYS: ${FS_MONITORING_HISTORY_RETENTION_DAYS:-}
  FS_MONITORING_CLEANUP_BATCH_SIZE: ${FS_MONITORING_CLEANUP_BATCH_SIZE:-}
  FS_MONITORING_QUEUE_MAX_MESSAGES: ${FS_MONITORING_QUEUE_MAX_MESSAGES:-}
  FS_MONITORING_QUEUE_MAX_BYTES: ${FS_MONITORING_QUEUE_MAX_BYTES:-}
  FS_MONITORING_OPERATION_TIMEOUT_SECONDS: ${FS_MONITORING_OPERATION_TIMEOUT_SECONDS:-}
  FS_LOAD_REPO_DOTENV: "0"
  FS_LOG_FORMAT: ${FS_LOG_FORMAT:-json}
  FS_LOG_LEVEL: ${FS_LOG_LEVEL:-INFO}
  FS_OBSERVABILITY_DSN: ${FS_OBSERVABILITY_DSN:-}
  LANGGRAPH_POSTGRES_URI: ${LANGGRAPH_POSTGRES_URI}
  # Container-local: release images date every source 1970-01-01, so a bytecode
  # cache kept on the host logs mount served another build's modules after an upgrade.
  PYTHONPYCACHEPREFIX: /tmp/flow-steward/pycache
  RABBITMQ_URL: ${RABBITMQ_URL}
  FS_RABBITMQ_TRANSPORT_MODE: compose-local
  SECURITY_PII_SALT: "${SECURITY_PII_SALT:?SECURITY_PII_SALT is required in production; the installer provisions it as a durable secret}"
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

