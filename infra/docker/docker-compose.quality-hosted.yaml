# Only for disposable GitHub-hosted quality jobs. Never point this at a
# development installation: its filesystem and volumes belong to one job VM.
services:
  fs-audit:
    volumes:
      - ${FS_QUALITY_CACHE_ROOT:?hosted quality cache directory required}:/home/fs/.cache/flow-steward-quality
  sonarqube:
    restart: "no"
  sonar-scanner:
    user: "1000:1000"
