  LANGGRAPH_POSTGRES_URI: ${LANGGRAPH_POSTGRES_URI:-postgresql://flow_steward:flow-steward-pass@pg-fs:5432/flow_steward}
  PYTHONPYCACHEPREFIX: /app/logs/tool-cache/python/pycache
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://flow_steward:flow-steward-pass@rabbitmq-fs:5672/}
  FS_RABBITMQ_TRANSPORT_MODE: compose-local
