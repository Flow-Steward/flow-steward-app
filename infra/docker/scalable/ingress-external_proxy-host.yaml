services:
  fs-app:
    ports:
      - "127.0.0.1:${FS_REVERSE_PROXY_BACKEND_PORT:-18099}:8099"
    environment:
      # ADR 0029 (2026-11-27): the host proxy reaches this loopback-only port through
      # Docker, so fs-app sees the bridge gateway; trust it to name the client.
      FS_FORWARDED_TRUST_MODE: host_gateway
  fs-mcp:
    ports:
      - "127.0.0.1:${FS_REVERSE_PROXY_MCP_PORT:-18100}:8100"
