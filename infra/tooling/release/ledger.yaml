  - <<: *open_row
    id: RS5-005
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: Shipped worker identity is not bootstrapped and can exclude later projects
    sources: [REVIEW-B-P0-5, REVIEW-B-P0-6]
    technical_status: fixed_verified
    verified_commit: d0e31fab73cbfeaeee5cd543c55eba784ac288ba  # pragma: allowlist secret - git commit SHA
    root_cause: >-
      Production Compose required FS_WORKER_MCP_BEARER_TOKEN before fs-worker
      could start, but the supported installer never issued it. The documented
      manual path also fixed allowed_project_ids at issuance time, excluding
      projects created later even though canonical empty-allowlist semantics mean
      unrestricted access inside the bound account.
    failing_test: >-
      Docker fs-audit collection of the new installer bootstrap contract failed
      because core.application.auth.worker_identity_bootstrap did not exist
      (exit 2). Source inspection proved the schema step proceeded directly to
      runtime start while production Compose required the missing worker secret.
    proving_test: >-
      Added an installer-owned schema -> worker_identity -> runtime sequence, a
      dedicated flow-steward-worker identity with only projects.read and an empty
      account-wide project allowlist, owner-only env secret replacement, and
      create -> replace -> revoke rotation. Docker fs-audit installer/grounding
      matrix passed 98 tests; focused Ruff and format checks passed. Initialized
      canonical pg-audit persistence regressions passed 2 tests: a project created
      after token issuance remained groundable, reinstall was idempotent, an
      under-scoped credential rotated and was revoked, and a separately restricted
      token retained its project restriction.
    runtime_evidence: >-
      Real service_accounts and machine_tokens rows on the isolated canonical
      PostgreSQL data plane resolved the installer credential with exactly
      scopes=[projects.read] and allowed_project_ids=[]. After deliberate scope
      corruption, the replacement resolved with the same least-privilege account
      contract and the previous bearer no longer resolved.
    cleanup_evidence: >-
      Each integration regression deleted its disposable token, service account,
      and project rows. pg-audit was then stopped and removed. Product PostgreSQL,
      RabbitMQ, knowledge-base data, volumes, users, and queued jobs were untouched.
    notes: >-
      Source installer and persistence contracts are repaired. Keep in_progress
      until one immutable packaged clean install proves worker startup, later-project
      queue consumption and grounding, missing/revoked/under-scoped readiness on all
      required surfaces, and reinstall/upgrade rotation without losing queued work.
      PACKAGED EVIDENCE 2026-08-05 (partial — row stays in_progress).
      A clean install of the immutable candidate first reproduced exactly the
      failure this row describes and then proved the repaired path. On first boot,
      with no provisioned identity, the worker crash-looped with "Worker MCP
      grounding readiness failed; the machine token is revoked, invalid, or lacks
      projects.read" (HTTP 401 from fs-mcp), and the gate correctly refused to
      mutate anything with worker_count=0 — the fail-closed behaviour worked.
      Running the shipped installer entrypoint
      `python -m core.entrypoints.cli.ops.worker_identity_bootstrap --env-file <file>`
      registered the identity and wrote the matching token; the worker then
      started, logged "Starting ready-queue consumer queue=platform.projects.ready
      allowlist=all", and the gate saw worker_count=1 and passed 63/63 twice,
      including across a controlled restart.
      STILL UNPROVEN, so the row stays open: later-project queue consumption and
      grounding for a project created after the worker is already running; the
      missing / revoked / under-scoped credential readiness surfaces; and
      reinstall/upgrade rotation without losing queued work.
      TWO FURTHER OBSERVATIONS from the 970d2ab candidate rebuild:
      (a) GOOD — the deployment provenance guard works and is load-bearing. After
      the app image was rebuilt but the MCP image was not, fs-mcp refused to
      serve at all with McpBuildRevisionMismatch ("image='29136fc...',
      deployment='970d2ab...'") and crash-looped rather than running a mismatched
      pair. The worker's grounding then failed closed. The operator-visible
      symptom, however, was the generic "machine token is revoked, invalid, or
      lacks projects.read" — which points at credentials and says nothing about
      the actual cause. Worth improving: grounding should distinguish "MCP is not
      serving" from "your token was rejected".
      (b) BAD — token rotation left the old credential live. Re-running
      worker_identity_bootstrap against an env file with no token minted a SECOND
      machine_tokens row and left the first with revoked=false.
      FIXED in commit cd5eb06. Revocation targeted only the token id resolved
      from the secret store's current value, and that value is absent exactly
      when rotation matters most — a reinstall, a lost env file, or a new
      deployment env pointed at an existing database. resolve_machine_token then
      returned None, no id was known, and the credential already in the database
      stayed active. ensure() now enumerates the service account's tokens and
      revokes everything except the one it just issued, leaving exactly one
      active installer-managed worker credential. Two regressions cover it and
      both were confirmed to fail against the pre-fix code.
      LATER-PROJECT CONSUMPTION IS PROVEN by the candidate gate itself: B01
      creates a project after the worker is already running, dispatches a task to
      it and requires a worker to consume it, and D05 runs an
      extension-projected workflow on another new project to completion. Both
      pass on the packaged candidate.
      ROTATION IS NOW PROVEN ON THE PACKAGED CANDIDATE (flow-steward:candidate-
      d6091db, /health build_sha d6091db..., image_digest sha256:2a05e776...,
      MCP image rebuilt at the same commit, no source mount). The candidate began
      with 2 active machine tokens accumulated by earlier re-provisioning. After
      one run of the installer entrypoint against an empty env file the counts
      were 1 active of 3 total — the freshly issued credential live, both
      superseded ones revoked. Before the fix the same action left every previous
      token active. The worker then started on the rotated credential and logged
      "Starting ready-queue consumer queue=platform.projects.ready allowlist=all",
      and the full gate passed 63/63 twice on that candidate with an app+worker
      restart between the runs.
      ROTATION WITH A NON-EMPTY QUEUE IS NOW PROVEN, which the earlier idle-queue
      run did not establish. On candidate-d6091db: the worker was stopped, three
      tasks were submitted and confirmed sitting at status=pending, the credential
      was then rotated (tokens went 1 active of 4 -> 1 active of 5, so the
      superseded one was revoked while the queue was non-empty), and the worker
      was restarted on the new credential. All three queued jobs were picked up —
      3 of 3 with a non-empty worker_id — so rotation lost no queued work. They
      subsequently failed with model_unavailable, which is the expected outcome
      on a candidate with no model route and is unrelated to rotation; each was
      acknowledged and /health/ready returned to 200 ready=True.
      CREDENTIAL READINESS SURFACES, two of three proven:
      - REVOKED: revoking every active machine token turns /health/ready to 503
        failing=[worker_identity], and the worker refuses to start with
        "rejected the worker machine token ... Underlying error: Client error
        '401 Unauthorized'". Re-provisioning restores 200 ready=True.
      - MISSING: with no token configured the worker refuses before any network
        call with "An explicit worker MCP machine token is required; configure
        FS_WORKER_MCP_BEARER_TOKEN with projects.read only." (observed on the
        development stack when a recreated container lost the value).
      - UNDER-SCOPED: now driven end to end on candidate flow-steward:candidate-
        0b4f3f9. Producing the case exposed a guardrail worth recording: the
        platform refuses to mint a token whose scopes exceed its service
        account's ("Token scopes must be a subset of service account scopes"),
        and passing an empty scope list INHERITS the service account's scopes
        rather than granting none — so a genuinely under-scoped credential
        required its own service account (scopes ['jobs.read']).
        Pointed at that credential the worker fails closed and says exactly why:
        "http://fs-mcp:8100/mcp rejected the worker machine token. It is revoked,
        invalid, or lacks projects.read. Underlying error: forbidden: MCP tool
        'project_list' requires one of these token scopes: projects.read,
        projects:*, read:*, admin:all". The required scopes are named, which is
        actionable; before commit 36e4811 the operator saw only the generic
        sentence with the cause dropped.
        /health/ready goes 503 — but on worker_manager ("0 live ready-queue
        consumer(s) detected"), the consequence, while worker_identity reports
        ok=True "Installer-managed flow-steward-worker identity is valid and
        account-wide".
        That pairing is accurate for what each check measures — a valid
        installer-managed identity does exist in the database — but no surface
        except the worker's own log reports that the RUNNING worker is
        configured with a different, under-scoped credential.
        CLOSED in commit 19b19b0. No new table, heartbeat, or reading of another
        container's environment was needed: machine_tokens.last_used_at is
        stamped by token verification after the revoked/expiry/active checks but
        BEFORE the caller enforces scopes, so a credential that authenticates and
        is then refused still leaves a server-side trace. worker_identity now
        takes the flow-steward-worker token with the newest last_used_at and
        evaluates THAT token — revoked, missing a project-read scope, or bound to
        projects each fail, with the offending label and its scopes in the detail.
        THE DECISIVE PROOF is the case that used to be invisible on BOTH checks.
        A worker given a project-bound credential starts normally and keeps
        worker_manager green — it grounds fine, it simply cannot see projects
        outside its binding, which is precisely the silent exclusion RS5-005 is
        about. On the candidate /health/ready now returns 503 with
        "The worker credential in use ('project-bound-probe', used recently) is
        bound to 1 project(s); the worker needs an account-wide credential so
        later projects are not excluded", and re-provisioning through the
        installer entrypoint returns it to 200 ready=True.
        BOUNDARIES, chosen deliberately rather than discovered later:
        * Staleness alone never fails. last_used_at is the past, so a stopped or
          idle worker keeps a historical timestamp; failing on age would
          duplicate worker_manager and merge two different diagnoses. The window
          (FS_READY_WORKER_IDENTITY_WINDOW_MINUTES, default 15 minutes) only
          labels the observation current or historical, and a bad credential
          fails regardless of age. 15 minutes was chosen because it is long
          enough that an idle worker is not mislabelled and short enough that
          "used recently" still means this deployment rather than a past one.
        * Several workers on one service account dilute attribution: the newest
          last_used_at names whoever authenticated last. Acceptable for the
          current single-worker topology, recorded as a known limitation.
        * KNOWN GAP found while proving this: the query is scoped to the
          flow-steward-worker service account, so a worker configured with a
          token belonging to a DIFFERENT service account is not attributed — the
          check reports the worker account's own most recent use instead. That
          shape was reachable only by hand-provisioning a foreign identity; the
          installer always issues under flow-steward-worker.
        Three outcomes are covered by tests in
        tests/unit/test_readiness_runtime.py, including that staleness alone
        stays green, and the under-scoped assertion was confirmed to fail against
        the previous existence-only check.
        Recovery through the documented installer entrypoint returned
        /health/ready to 200 ready=True, and the probe identity was revoked and
        deleted, leaving exactly one active correctly scoped
        installer-managed-worker token.
      All three credential surfaces named by this row — missing, revoked and
      under-scoped — are now observed on the packaged candidate.
    missing_credential_evidence: >-
      The one case this row still carried as observed only on the development
      stack — MISSING — is now driven on the packaged candidate
      (flow-steward:candidate-d0e31fa), and it fails closed twice over.
      SURFACE 1, the stack refuses to exist. The worker's credential is
      interpolated as
      MCP_BEARER_TOKEN: "${FS_WORKER_MCP_BEARER_TOKEN:?...}" in
      docker-compose.prod.yaml, and compose treats empty exactly like unset, so
      an env file whose FS_WORKER_MCP_BEARER_TOKEN is blank cannot even be
      rendered: "required variable FS_WORKER_MCP_BEARER_TOKEN is missing a value:
      FS_WORKER_MCP_BEARER_TOKEN with projects.read is required". The operator is
      told the variable and the scope before any container starts.
      SURFACE 2, the process refuses on its own. Bypassing compose entirely —
      docker run of the same image with the worker's real environment and only
      MCP_BEARER_TOKEN blanked — the worker dies at
      mcp_tools.py:375 verify_worker_mcp_grounding with "An explicit worker MCP
      machine token is required; configure FS_WORKER_MCP_BEARER_TOKEN with
      projects.read only." No HTTP call is attempted, so this is distinguishable
      from the revoked case, which fails with a 401 from fs-mcp.
      SURFACE 3, readiness reports the consequence. Measured on the candidate:
      200 ready=True -> worker stopped -> 503 ready=False
      failing=['worker_manager'] -> worker started -> 200 ready=True failing=[].
      All three credential states this row names — missing, revoked and
      under-scoped — are now observed on one immutable packaged candidate.
    known_limitations: >-
      Two boundaries are recorded rather than closed, because both are
      properties of the attribution model and neither is reachable through the
      shipped installer.
      (1) Several workers sharing one service account dilute attribution: the
      readiness check names whoever authenticated last, by newest last_used_at.
      Correct for the current single-worker topology; a multi-worker deployment
      would need per-worker identities to attribute precisely.
      (2) A worker configured with a token belonging to a DIFFERENT service
      account is not attributed — the check is scoped to flow-steward-worker and
      reports that account's own most recent use. Reaching this shape required
      hand-provisioning a foreign identity; the installer always issues under
      flow-steward-worker.
      Neither weakens the failure modes this row is about: a missing, revoked or
      under-scoped installer-managed credential is caught on every surface.

  - <<: *open_row
    id: RS5-006
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: Active File Transfer extension dependencies are absent from the packaged runtime
    sources: [A5-002]
    technical_status: fixed_verified
    verified_commit: 6531889f942665da978e96189f71a7af207fb9ed  # pragma: allowlist secret - git commit SHA
    root_cause: >-
      File Transfer declared a complete hash-pinned Paramiko dependency tree and
      shipped the matching wheels, but the runtime image never invoked the canonical
      extension-local materializer for bundled extensions. A host-created ignored
      .fs-python tree therefore masked a clean packaged-image failure. Install and
      enable paths also did not uniformly reject a declared unhealthy extension.
    failing_test: >-
      A clean copied bundle excluding .fs-python returned dependency_unavailable for
      paramiko, bcrypt, invoke, and PyNaCl. The first Docker fs-audit regression failed
      collection because the required bundled dependency build module did not exist
      (exit 2). A clean runtime health reproduction failed before the repair.
    proving_test: >-
      The runtime Docker target now materializes hash-pinned extension wheels during
      image construction and .dockerignore excludes every local .fs-python tree.
      A clean local runtime image built successfully and emitted dependency_count=7
      for flowsteward.file-transfer 0.1.6. Without a bind mount, that image contained
      extension-local Paramiko 5.0.0 and returned healthy with all declared dependency
      versions. Docker fs-audit packaging/health-gate matrix passed 5 tests; real
      isolated FTP/SFTP loopback tests passed 4, including successful byte transfer
      and truthful authentication_failed behavior. Targeted Ruff and format checks
      passed for all nine touched files.
    runtime_evidence: >-
      Local clean image flow-steward-rs5-006:local (image ID
      sha256:77eda78e630c06be4123fae3f1e884396d026476ee64f543d3822cde1d347c21)
      was executed without repository mounts. File Transfer health reported healthy
      and versions bcrypt=5.0.0, cryptography=49.0.0, invoke=3.0.3,
      paramiko=5.0.0, and PyNaCl=1.6.2. The core/audit Python environment was not
      given Paramiko; protocol tests used only the extension-local site directory.
    packaged_evidence: >-
      Focused Docker build completed the runtime target from a context that explicitly
      excludes .fs-python and printed one materialized bundled extension with seven
      dependencies. This is reproducible local packaged evidence, not the immutable
      final release candidate required for technical closure.
    notes: >-
      Source packaging and fail-closed health gaps are repaired. Clean-image inventory
      found eight active runtime entries other than the retired tracker bundle valid and
      healthy; that bundle is not advertised active. Keep in_progress until the immutable candidate proves every
      active non-fixture capability with a bounded invocation and executes File Transfer
      through a real workflow connector with artifact byte verification plus bad-auth
      evidence. The final active-capability inventory belongs in the release smoke gate.
    candidate_evidence: >-
      Proven on the immutable packaged candidate flow-steward:candidate-6531889
      (both images rebuilt at that commit, no source mount).
      ACTIVE CAPABILITY INVENTORY, each by a real bounded subprocess invocation
      rather than a status field: the six active non-fixture extensions —
      example-showcase, toolbox-dataset-connector, telegram, outgoing-email,
      file-transfer and docling — all report healthy with exit_code 0 under the
      declared 5-second timeout. File Transfer additionally reports the
      dependency tree this row is about, resolved from the packaged image:
      paramiko 5.0.0, bcrypt 5.0.0, cryptography 49.0.0, invoke 3.0.3,
      PyNaCl 1.6.2, from bundle_root /app/extensions/flowsteward_file_transfer.
      That is the row's actual defect — dependencies absent from the packaged
      runtime — measured on the final candidate rather than on a local focused
      build.
      THROUGH A REAL WORKFLOW CONNECTOR, end to end. A dedicated SFTP server was
      run on the candidate network, a project-scoped sftp connection created
      through the public API with a pinned host-key fingerprint and encrypted
      secrets, and a workflow built with one connector step
      (connector_id extension.flowsteward.file-transfer, operation list_files,
      bound to that connection). Submitted through POST /api/tasks, the job
      reached status=completed and the extension returned the live remote
      listing: files [{name: probe.bin, size_bytes: 100,
      modified_at: 2026-08-06T13:18:05Z}], which matches the 100-byte file
      placed on the server exactly. The packaged paramiko actually spoke SFTP to
      a real server through a real connector step.
      Getting there also exercised the platform's own guards truthfully: the
      first attempt was refused by SSRF IP-pinning ("resolves to disallowed
      address"), with the address redacted as [PII:ipv4:...], and only the
      documented FS_ALLOW_PRIVATE_REMOTE_URLS escape hatch — which the
      extension's README states must stay off in production — allowed a
      private-network fixture.
      BAD AUTH. With the connection secret changed to a wrong password through
      the same API, the identical step failed with error_code
      authentication_failed, external_effect_status failed and
      definitely_no_external_effect true, and the job failed with "SFTP
      authentication failed". Nothing was transferred. The good password was
      restored afterwards.
    not_shown: >-
      Artifact byte verification was not completed, and the reason is the test
      stand rather than the product. fetch_file streams into a host-created
      artifact, so it needs an artifact plane; the candidate had none, and the
      bundled SeaweedFS profile was started by hand with a hand-written s3
      identity file rather than by the installer. Presigned PUT against that
      instance returns HTTP 403 — reproduced with a bare boto3 presigned PUT
      from inside the worker, entirely outside the product, which is what
      identifies it as my configuration and not a platform defect.
      What is shown instead: the live server's own size_bytes for the file,
      100, returned through the connector step and matching the local file
      exactly. The remaining half — bytes landing in an artifact — belongs on a
      stand whose artifact plane was provisioned by the installer.

  - <<: *open_row
    id: RS5-007
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: Readiness and CLI diagnostics can be false green, empty, or mutually inconsistent
    sources: [A5-003, A5-008, REVIEW-B-E13]
    technical_status: fixed_verified
    verified_commit: 83e63b274f5eec2f98a0bb6c1a62c0cbee94841e  # pragma: allowlist secret - git commit SHA
    root_cause: >-
      Runtime readiness marked queue delivery healthy whenever its summary query
      loaded, even when the summary required intervention, and counted only new
      watchdog detections rather than jobs already persisted as stuck. Worker
      readiness inferred workers from assigned active jobs and was opt-in, so it did
      not prove a live RabbitMQ consumer or the installer-managed credential. CLI
      failure mapping discarded ReadinessReport findings, while Monitoring trusted
      top-level ready=true despite contradictory metadata.
    failing_test: >-
      Docker fs-audit red regressions reproduced all contracts: intervention-required
      delivery returned ok=true; one persisted stuck job with zero new detections
      returned ok=true; status removed the database blocker; JSON error details had
      no status/findings; plain status printed only generic precondition_failed; the
      worker probe accepted a stale assigned worker; and worker identity validation
      did not exist (4 failed, then 2 failed, then 1 failed, all exit 1). A separate
      regression proved post-claim execution failure did not require intervention.
    proving_test: >-
      Runtime readiness now blocks on persisted stuck rows, dead-lettered or
      post-claim delivery failures, zero live ready-queue consumers, unavailable
      consumer metrics, and missing/revoked/expired/under-scoped or project-restricted
      flow-steward-worker identity. CLI status/doctor retain failed core findings in
      JSON and render check ID, failed state, bounded detail, and recovery in text;
      deployment doctor preserves the exact failed public readiness check. Monitoring
      defensively refuses Ready: yes when checks or its own delivery/stuck metadata
      contradict it. Docker focused backend matrix passed 45 tests; monitoring
      frontend passed 8 tests; targeted Ruff, format, ESLint, and TypeScript checks
      passed.
    runtime_evidence: >-
      Read-only probes against the current shared test stack observed exactly one live
      consumer on platform.projects.ready and zero valid installer-managed worker
      identities. The latter now has an explicit not-ready contract with recovery
      `flow-steward install --repair`; no database rows or Docker services were changed
      by these probes.
    notes: >-
      Source and renderer contradictions are repaired. Keep in_progress until one
      immutable packaged candidate runs controlled red -> green transitions for a
      persisted stuck job, delivery intervention, stopped worker, and missing/revoked/
      under-scoped worker credential across /health/ready, monitoring API/browser,
      CLI text, and CLI JSON, with recovery through documented product commands.
      PACKAGED FINDING 2026-08-05 — this row is not only unproven, it now has a
      concrete counter-example on the candidate. On a stack that is demonstrably
      healthy (release gate 63/63 twice, GET /api/health 200, worker consuming
      from platform.projects.ready), the CLI deployment doctor reports the
      deployment as broken, and reports it differently depending on where it runs:
      - inside the app container
        (`python -m core.entrypoints.cli.ops.deployment_doctor --json --live-only`):
        ok=false, 4 fail / 4 pass. api_ready and queue_worker_health both fail with
        "SSL: WRONG_VERSION_NUMBER", because the probe takes its base URL from
        FS_PUBLIC_BASE_URL (https://localhost:8099) while inside the container that
        host:port is the app's own plain-HTTP listener (FS_SERVE_SSL=0, TLS
        terminates at traefik). mcp_auth fails with "MCP auth is enabled but no
        bearer token was provided" even though the worker is authenticated and
        grounded with exactly that token.
      - from the host (`--probe-mode host --env-file ./.env.prod`): ok=false,
        5 fail / 3 pass, and a different set — api_ready and queue_worker_health
        fail on CERTIFICATE_VERIFY_FAILED (self-signed local TLS), while
        db_connectivity, rabbitmq_socket and mcp_auth fail because the compose
        service names pg-fs / rabbitmq-fs / fs-mcp do not resolve outside the
        docker network.
      CORRECTION 2026-08-06 — the reading above was partly my own invocation
      error, and the real defect is different and worse. Neither run above used
      the supported path. `--live-only` silently disables compose probing
      (deployment_doctor.py: `probe_mode == "compose" and not options.live_only`),
      so both invocations degraded to host-side probes, where a self-signed
      certificate and unresolvable compose service names are expected rather than
      diagnostic. The false-red I attributed to the product was substantially
      mine.
      THE ACTUAL DEFECT, found by running the supported path: compose probing
      could never work at all. It shells into fs-app with
      "core.entrypoints.cli tooling ops deployment-doctor", and the packaged CLI
      exposes no "tooling" command, so every compose probe died with
      "No such command 'tooling'". live_probe_boundary was reported as failed and
      not one real probe ever ran. The mode meant to tell an operator the truth
      about a deployment could not produce a single result.
      REPAIRED in commit ca8d326: the probe now invokes the doctor module
      directly, which already accepts every flag the compose path passes.
      Measured on the running stack, same command: 3 pass / 5 fail before,
      18 pass / 2 fail after, with api_ready, db_connectivity, rabbitmq_socket
      and mcp_auth all passing from inside the container.
      The two survivors are genuine product state, not plumbing: one persisted
      stuck job, and jobs that previously failed after delivery succeeded.
      /health/ready agrees, returning 503 with four named failing checks
      (queue_delivery, stuck_jobs, worker_identity, lifecycle_recovery). The
      surfaces now tell the same story, which is what this row asked for.
      RED -> GREEN TRANSITIONS NOW DRIVEN on the packaged candidate
      (flow-steward:candidate-d6091db), each recovered through a documented
      product command, each measured on /health/ready before and after:
      1. DELIVERY INTERVENTION. Baseline 503 ready=False failing=[queue_delivery]
      from a dead-lettered job whose queue payload referenced a deleted project.
      This one could not be recovered at all until a product fix landed — see
      RS5-031 — because acknowledge/restart/cancel/unacknowledge all answered 404
      and the operator could not even open the job (503). After the fix:
      GET the job 200, acknowledge 200, /health/ready 200 ready=True failing=[].
      2. STOPPED WORKER. Green -> `docker stop` the worker -> 503 failing=
      [worker_manager] -> start the worker -> 200 ready=True failing=[].
      3. REVOKED WORKER CREDENTIAL. Green -> revoke every active machine token ->
      503 failing=[worker_identity]. The worker refused to start and now says
      why precisely: "http://fs-mcp:8100/mcp rejected the worker machine token.
      It is revoked, invalid, or lacks projects.read. Underlying error: Client
      error '401 Unauthorized'" (the improved diagnostic from 36e4811, which
      distinguishes this from an unreachable server). Recovery by re-running the
      installer entrypoint -> 200 ready=True failing=[].
      4. FAILED JOBS. Three probe jobs failing with model_unavailable ->
      503 failing=[queue_delivery] -> acknowledge each -> 200 ready=True.
      CLI SURFACE AGREES once invoked the way compose mode invokes it (inside a
      container that carries MCP_BEARER_TOKEN, --probe-mode host --base-url
      http://fs-app:8099): ok reports 7 pass / 1 fail against /health/ready's
      green.
      ONE GENUINE DIVERGENCE REMAINS, recorded rather than guessed at:
      provider_cli_auth fails on every packaged deployment. _configured_cli_providers
      treats a provider as configured when the shipped db/seeds/registry_seed.json
      references it, and that seed declares agents on retired_executor — but the runtime
      image deliberately ships no CLI tooling (retired-tool and agent live in the
      local-runtime stage). So the shipped seed and the shipped runtime image
      disagree by construction. This is arguably a true red rather than a false
      one — those seeded agents genuinely cannot run there — but deciding between
      "runtime should ship the CLIs", "the seed should not default to a CLI
      provider" and "the check should ignore providers absent from the image" is
      a packaging decision, not a defect with one correct repair.
      RESOLVED 2026-08-06. The owner chose "the seed must not pin a route":
      d091602 cleared retired_executor from 16 first-party agents, and 83e63b2 removed
      the one remaining pin the first pass missed and widened the guard.
      PROVEN on candidate flow-steward:candidate-83e63b2 (both images rebuilt at
      that commit, /health build_sha 83e63b274f5e):
      - provider_cli_auth PASS, "No CLI providers configured", and the whole live
        probe is ok=true at 8 pass / 0 fail (was 7 pass / 1 fail);
      - the preflight refusal at preflight_checks.py:252 no longer fires. This
        was the more damaging half: registry_only is the DEFAULT tool policy, so
        seeded agents were rejected before the doctor ever mattered. A real
        quick_fix job on the candidate now reaches the agent and fails only with
        "model_unavailable: no configured provider/model route" — the expected
        RS5-008 blocker — instead of "Selected workflow resolves to retired_executor".
        The guard itself still works: forced to see retired_executor it still refuses.
      RE-SEED MECHANICS, corrected from the expectation that it self-triggers:
      starting the app on the new image did NOT re-seed. The registry still held
      16 retired_executor pins and platform_schema_state.schema_fingerprint was
      unchanged, because that column fingerprints db/schema/** only. The seed
      files are fingerprinted separately (canonical_seed_fingerprint over
      db/seeds/lookup_seed.json and registry_seed.json) and that value is
      RECORDED in metadata_jsonb.seed_fingerprint, not used as a trigger.
      The re-seed happened when `python -m core.application.tooling.db.upgrade_db`
      ran, which applies the registry seed unconditionally. So a seed change
      needs that documented upgrade step; it does not land by deploying a new
      image alone. The recorded seed_fingerprint (9e7d8166c70e452f...) matches
      the new file, confirming the re-seed used it.
      OVERWRITE RISK CHECKED, nothing extraneous lost: apply_registry_seed writes
      agents through apply_entity_snapshot -> save_agent, so it overwrites rows.
      Before and after the re-seed the candidate held exactly 24 agents with an
      identical agent_id set, and exactly the 16 pinned rows changed (provider
      retired_executor -> empty). Other registry counts stayed intact.
      STILL OPEN for closure: the persisted-stuck-job transition specifically
      (the four above cover delivery, worker and credential), the monitoring API
      and browser surfaces, and CLI text output alongside CLI JSON.
      Note for that work: `worker_identity` currently reports "No valid
      account-wide flow-steward-worker credential is available" on the
      development stack while its worker is grounded and consuming, which is
      either a real inconsistency or an artefact of that stack's four
      accumulated machine tokens; the RS5-005 rotation fix (cd5eb06) is expected
      to change this and it should be re-measured after a clean re-provision.
    closing_evidence: >-
      The three clauses this row still carried are now driven on immutable
      packaged candidates, and closing them turned up three further defects,
      each recorded as its own row: RS5-035, RS5-036 and RS5-037.
      1. PERSISTED STUCK JOB, red -> green through a documented product command.
      On candidate a7d6545: a quick_fix job was submitted and picked up
      (worker ef01a3b08c1b-1), the worker container was killed, the watchdog scan
      marked the job stuck, and /health/ready went 503
      failing=[stuck_jobs, worker_manager].
      POST /api/watchdog/jobs/{id}/recover {"action":"kill"} then answered 200
      with kill_result {"attempted": false} — no signal sent — the job reached
      status=cancelled, fs-app was NOT restarted (State.StartedAt unchanged), and
      readiness dropped straight to 503 failing=[worker_manager] alone, i.e.
      stuck_jobs cleared. Restarting the worker returned 200 ready=True
      failing=[].
      On the pre-fix image the same sequence answered 200 with
      kill_result {"attempted": true, "signal": "SIGKILL", "pid": 1} and took the
      API down — see RS5-035.
      2. MONITORING API AND BROWSER SURFACES. Both were wrong and are now right;
      the endpoint defect is recorded in this row's own fix (478f132). On the
      packaged candidate the monitoring summary now answers HTTP 200 with
      ready=false, status=not_ready and
      summary {checks_total 11, checks_ok 9, checks_failed 2,
      failed_checks [worker_manager, stuck_jobs]}, and the browser header reads
      "Ready: no | Checks: 9 / 11 | Failed: 2 | Services: 11" with the Services
      tab naming Stuck Jobs. Before the fix the same state rendered
      "Ready: no | Checks: 0 / 0 | Failed: 0 | Services: 0 |
      Container discovery: available" — the zero-defaults of a payload the page
      had failed to fetch.
      Two UI tests now cross-check the page against /health/ready. They were
      confirmed to fail against the pre-fix image and pass against the post-fix
      image with the stack in the SAME unhealthy state (worker stopped,
      failing=[worker_manager]), so the difference is the fix and not the
      conditions.
      3. CLI TEXT ALONGSIDE CLI JSON. Both renderings of the deployment doctor
      were captured from one invocation and compared check by check on the
      packaged candidate. 23 checks, zero mismatches, and the text summary line
      agrees with the JSON totals. That held in both the degraded reading
      (18 pass / 3 warn / 2 fail, "Summary: 18 passed, 3 warned, 2 failed.") and,
      after RS5-036 and RS5-037, the clean one (20 pass / 3 warn / 0 fail,
      ok=true). The two renderings never disagreed; what was wrong was what both
      of them reported, which is what those two rows fix.
    stand_caveat: >-
      One difference between this candidate and a real deployment, recorded so
      the evidence is not over-read: the candidate splits its environment across
      .env.prod plus a candidate overlay used only for Compose interpolation,
      while the prod compose file gives fs-app "env_file: ../../.env.prod" and
      therefore loads that one file wholesale into the container. A key present
      only in the overlay — FS_BACKUP_ENCRYPTION_KEY here — reaches Compose but
      not the container. That is a property of the test stand, not of the
      product, and the owner's .env.prod was deliberately not modified.

  - <<: *open_row
    id: RS5-008
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: Configured quick_fix completion and invalid container-path preflight are unproven
    sources: [REVIEW-B-P0-4]
    technical_status: fixed_verified
    verified_commit: e2d685e
    packaged_evidence: >-
      Both halves proven on the packaged candidate once the owner had configured a
      model provider through its UI. A configured quick_fix run reached
      status=completed with no last_error and actually applied the fix (calc.py
      went from `return a - b` to `return a + b`), and a task for an IT project
      with an invalid container_root was refused before dispatch with HTTP 400
      project_runtime_mapping_invalid, naming the field, the configured value and
      the recovery. Details, including the SECURITY_PII_SALT prerequisite that
      had to be satisfied first, are in the notes below.
    root_cause: >-
      IT submission normalized a missing container_root from project_root and graph
      state/preflight normalized a missing git_root from container_root. Those fallbacks
      hid the exact invalid project field until branch setup or a filesystem operation.
      Rootless general projects were also subjected to IT filesystem and Git checks.
    failing_test: >-
      Docker fs-audit regressions first failed as intended: missing IT container_root
      reached enqueue instead of raising; a host-only git_root produced the generic
      `.git not found` message; workflow test-run returned HTTP 500 after entering the
      graph; and a rootless general project failed filesystem/git preflight (4 failed,
      exit 1 across focused runs).
    proving_test: >-
      One shared mapping validator now returns field, configured value, expected worker
      path, and recovery before submission/test-run graph execution and as the first
