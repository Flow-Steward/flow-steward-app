  - <<: *open_row
    id: RS5-035
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: The documented stuck-job kill action kills the API container itself
    sources: [REVIEW-B-CANDIDATE-2026-08-06]
    technical_status: fixed_verified
    verified_commit: b3afa03
    root_cause: >-
      A worker id is built as f"{socket.gethostname()}-{os.getpid()}"
      (worker/queue_lease_store.py, worker/worker_bootstrap.py), and the pid in
      it is meaningful only inside the process namespace that recorded it. A
      containerised worker runs as pid 1 of its own container. The recovery
      route parsed that trailing number with control.scans._parse_worker_pid and
      passed it straight to terminate_worker_pid, which signals from the API
      process — where pid 1 is uvicorn. The pid was treated as globally
      meaningful when it is namespace-local.
    failing_test: >-
      tests/unit/test_control_scans_module_helpers.py::
      TestSignalableWorkerPidRS5035 — six cases, all failing against the previous
      code, the decisive one being that pid 1 of another container is still
      parseable but must never be signalled.
    proving_test: >-
      The same six cases pass after the change, including that a genuine
      same-host worker pid is still signalled (the case the action exists for)
      and that a hostname containing dashes is split from the right end.
      Neighbouring suites — control scans, watchdog runtime, process runtime,
      process monitoring — stay green at 34 passed, and the fast quality gate
      passes.
    runtime_evidence: >-
      Measured on the packaged candidate flow-steward:candidate-b07ca47, driving
      the documented stuck-job recovery path end to end. A quick_fix job was
      submitted, picked up (worker_id 330b0f284735-1 style), the worker container
      was killed, the watchdog marked the job stuck, and /health/ready reported
      503 failing=[queue_delivery, stuck_jobs, worker_manager].
      POST /api/watchdog/jobs/{id}/recover {"action":"kill"} then answered
      HTTP 200 with
      kill_result {"attempted": true, "signal": "SIGKILL", "pid": 1}
      and the API stopped answering: the next request failed with
      ConnectionRefusedError, and fs-app came back reporting "Up 11 seconds"
      with a fresh "Application startup complete" — it had been killed and
      restarted by its restart policy.
      The job did reach status=cancelled, so the recovery half worked; the cost
      was the platform it was invoked on.
    notes: >-
      Found by running the product, on the last unproven clause of RS5-007
      ("recovery through documented product commands"). It is the sharpest
      instance of that row's theme: the surface an operator is told to use when
      something is wrong is itself the thing that breaks.
      Severity P0 rather than P1 because it is reachable through a documented,
      supported action on a normal containerised deployment — pid 1 is the usual
      case for a worker, not an edge case — and the consequence is an API outage.
      It is admin-only, which bounds who can trigger it, not what happens.
      Deliberately narrow fix: parsing is unchanged so diagnostics still report
      the pid; only the decision to send a signal is guarded. A remote worker now
      falls through to the status transition and the journal entry with no
      signal, which is the correct outcome — the API cannot reach into another
      container's namespace and should not pretend otherwise.

