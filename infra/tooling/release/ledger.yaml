  - <<: *open_row
    id: RS5-072
    severity: P1
    title: Keep partial project hard-delete selections atomic and retryable
    sources: [RRA14-P1-04]
    technical_status: fixed_verified
    review_status: accepted
    reviewer: agent-release-audit-2026-08-16
    verified_commit: dd2cc95499aac5e332ef24d6d99afc95b4bdb23f  # pragma: allowlist secret - git commit SHA
