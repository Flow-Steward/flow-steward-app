      fails against the code at aac5bec^ — confirmed by restoring that revision
      of auth_passwords.py and re-running.
    proving_test: >-
      The same test, changed in this pass from named-field assertions to
      set(data) == {"valid"}. Naming fields only catches the ones someone thought
      to name; the endpoint answers yes or no about one token, so any additional
      key is a new thing an unauthenticated caller learns.
    packaged_evidence: >-
      Driven end to end on the packaged candidate flow-steward:candidate-6531889,
      unauthenticated, through the real mail path. A reset was requested for
      fs-smoke@release.local, the message arrived in Mailpit, and the token was
