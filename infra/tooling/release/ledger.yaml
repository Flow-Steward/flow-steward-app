  - <<: *open_row
    id: RS5-040
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    technical_status: fixed_verified
    severity: P2
    title: A newly disclosed advisory in a dev-only transitive dependency blocks the lint
    sources: [REVIEW-B-CANDIDATE-2026-08-07]
    root_cause: >-
      Two newly published advisories successively made the mandatory frontend
      dependency gate red without an application-code change. The earlier
      js-yaml advisory was reached through eslint; after its patched in-range
      release was adopted, GHSA-2v37-7h3g-55p8 was disclosed through vite ->
      postcss -> nanoid 3.3.16. The latter affected every nanoid version below
      3.3.17, while the existing PostCSS range allowed a patched 3.x release.
    verified_commit: 3ed983dddfc13bbcbe79f3cdf27eced2529cce9b  # pragma: allowlist secret - git commit SHA
    failing_test: >-
      The mandatory Docker frontend audit first failed on
      GHSA-5p4m-2wfm-xmqj through eslint -> @eslint/eslintrc -> js-yaml 4.3.0,
      and later failed on GHSA-2v37-7h3g-55p8 through vite -> postcss -> nanoid
      3.3.16. Both failures returned a non-zero gate exit.
    proving_test: >-
      Commit beb4b94 adopted the in-range js-yaml 4.3.1 patch. Commit 3ed983d
      resolves the existing PostCSS range to nanoid 3.3.18. The final Docker
      full gate reports npm audit zero vulnerabilities, passes frontend lint,
      all 836 frontend tests, and the production build with exit 0.
    what_was_fixed: >-
      lint.sh runs under `set -e` and run_step executes its command directly, so
      the first non-zero exit aborts every step after it. The frontend
      dependency audit sat immediately before the lint in
      run_check_frontend_lint, and before the lint, tests and build in
      run_check_frontend_workspace. One advisory in a transitive dev dependency
      was therefore cancelling the signal from up to three steps that know
      nothing about it.
      The audit now runs last in both functions. It still fails the gate —
      nothing is weakened and nothing is hidden. What changes is that by the
      time it fails, the checks it was silencing have already run.
    runtime_evidence: >-
      Measured in the isolated fs-audit container; no application candidate is
      required for a dev-only lockfile advisory. npm ci and npm ls resolve
      js-yaml 4.3.1 and nanoid 3.3.18. Both the focused dependency check and the
      final full gate report zero npm vulnerabilities and exit 0.
    notes: >-
      The audit remains fail-closed and is intentionally sequenced after lint so
      a dependency advisory cannot suppress unrelated lint evidence. Both
      dependencies are dev-only transitive tooling and do not ship in the
      application runtime.

  - <<: *open_row
    id: RS5-034
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P2
    title: A refused phase add still renumbers the workflow terminal
    sources: [REVIEW-B-CANDIDATE-2026-08-06]
    technical_status: fixed_verified
    verified_commit: 4429516
    root_cause: >-
      RegistryDBStoreWorkflowStepsMixin.add_phase shifts every phase at or after
      the insert position up by one to make room, and commits. The authoring
      route then runs phase-scoped validation and, when it rejects the new phase,
      rolls back by calling delete_phase — which removed the row but left the
      shift in place. The two halves were not symmetric, so the rollback was
      partial.
    failing_test: >-
      tests/unit/test_registry_workflow_phase_persistence.py::
      test_delete_phase_closes_the_ordering_gap_it_leaves fails against the
      previous code: no compaction statement is issued at all.
    proving_test: >-
      Two regressions in the same file: the gap is closed after the row is
      deleted (order asserted, not just presence), and a delete of an unknown
      phase row compacts nothing, so a missing row cannot renumber a workflow it
      never belonged to. Both confirmed red before the change and green after.
      Neighbouring suites (registry admin API, canvas graph service, phase
      persistence) stay green at 352 passed, and the fast quality gate passes.
    runtime_evidence: >-
      Measured on the packaged candidate flow-steward:candidate-d0e31fa, found
      while proving RS5-001. Three consecutive POST /api/workflows/{id}/phases
      calls that were correctly refused with HTTP 400 ("Phase has no steps" on an
      enabled workflow) moved the terminal's sort_order 2 -> 3 -> 4 -> 5. The
      probe phase itself was rolled back each time, so the workflow ended with
      start(0), probe(1), end(5).
    notes: >-
      Severity is P2 deliberately: relative ordering stayed correct throughout, so
      no run ever executed in the wrong order and nothing user-visible broke. What
      it violates is that a request answered with a failure status changed stored
      state, and the drift was unbounded — an authoring UI that retries a
      rejected phase add pushes the terminal further out every time.
      Found by running the product, not by reading it. The fix makes delete_phase
      close the gap it leaves, in one transaction with the delete, which is also
      the correct behaviour for a genuine phase deletion rather than a
      rollback-only patch.
      GREEN is proven at source; the next candidate rebuild should re-measure the
      2 -> 3 -> 4 -> 5 sequence and see it hold at 2.

