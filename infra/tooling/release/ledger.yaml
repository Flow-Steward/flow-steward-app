      tests/unit/test_job_detail_contract.py is among them.
      Every "gate green" in this epic was therefore a lint result. It could not
      go red on a broken test, which is the same shape of blind spot the epic
      kept finding in the product, applied to the verification practice itself.
    failing_test: >-
      A full tests/unit run — 14 failed, 11227 passed, 76 skipped, 14m50s —
      surfaced two failures that had been red since the RS5-005 work:
      test_entrypoint_db_dependency_budget.py::
      test_entrypoints_do_not_import_database_infrastructure and
      test_config_registry_architecture_budget.py::
      test_runtime_environment_reads_are_registered_and_centralized.
    proving_test: >-
      Both budgets pass after the repair, together with the env registry suite.
      worker_identity_bootstrap.py now builds its store through
      create_identity_store instead of importing PlatformIdentityStore, reads
      FS_DB_DSN/DATABASE_URL through the canonical runtime environment instead of
      os.environ, and FS_READY_WORKER_IDENTITY_WINDOW_MINUTES is registered in
      the manifest with the env catalog and audit artifact regenerated from it.
    runtime_evidence: >-
      Attribution was checked rather than assumed. Of the 14 failures, two are
      mine and are fixed here. Two more — the retired-tracker-key and
      developer-machine-path guardrails — were already red at d091602, before
      this work began, and point at ledger text that predates it. The remaining
      ten are in areas this epic did not touch and were left alone.
    notes: >-
      The practical rule this changes: run pytest over the touched areas AND the
      budget/guardrail suites before every commit, and the whole tests/unit before
      writing fixed_verified on a row. Keep running lint.sh --fast, but call it
      lint — describing it as "the gate" is what made the gap invisible for the
      length of an epic.
      Recorded as its own row rather than as a note, because a verification
      practice that cannot fail is a release risk in the same sense as a product
      defect that cannot be observed.
    payoff_evidence: >-
      The rule paid for itself on its first application, which is worth
      recording because the cost is visible and the benefit is not.
      Fixing RS5-024 touched the MCP server. A full tests/unit run afterwards
