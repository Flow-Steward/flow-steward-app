  - <<: *open_row
    id: RS5-062
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: Permit platform-issued artifact uploads without weakening extension SSRF protection
    sources: [RRA13-P0-03]
    technical_status: fixed_verified
    verified_commit: 1d0bc76d0fdad779a176e96882f1985499b5eae7  # pragma: allowlist secret - git commit SHA
    packaged_verified_commit: 1d0bc76d0fdad779a176e96882f1985499b5eae7  # pragma: allowlist secret - git commit SHA
    runtime_evidence: >-
      Exact candidate evidence is recorded in runtime_evidence_2026_08_14 below.
    runtime_evidence_2026_08_14: >-
      Exact candidate D09 processed all ten catalog rows with private URLs still
      denied by default, uploaded and downloaded 3168 CSV bytes, and matched the
      durable content type, byte size, SHA-256, account, project, and job ownership.
    root_cause: >-
      The host issues a presigned SeaweedFS upload URL on the private Compose network,
      then the extension SDK routes that URL through the same pinned-peer private-IP
      denial used for arbitrary remote extension traffic. The showcase test globally
      enables FS_ALLOW_PRIVATE_REMOTE_URLS and therefore masks production behavior.
    failing_test: >-
      Product Catalog Enrichment processed ten CSV rows and reached the required upload,
      then failed with PinnedPeerError because seaweedfs resolved to 172.21.0.2. The job
      produced no required downloadable artifact.
    proving_test: >-
      Introduce a narrowly authenticated host-issued artifact grant/origin or a host-owned
      upload mediator. A genuine platform grant must upload and read back the exact bytes,
      checksum, size, and content type. A forged private URL and a redirected private peer
      must remain blocked with FS_ALLOW_PRIVATE_REMOTE_URLS unset. Run the showcase test
      under the production security default.
    notes: >-
      Do not resolve this by globally allowing private remote URLs; that would convert a
      functional blocker into an SSRF regression.
    source_evidence_2026_08_13: >-
      The host now signs short-lived Ed25519 upload grants whose canonical claims bind
      account/project/job scope, artifact id and binding, PUT URL and method, content
      type, maximum size, required conditional-create header, expiry, and single-use
      policy. Extension subprocesses receive only the public verification key. The SDK
      permits a private connected peer only after signature verification, rejects
      grant content-type changes and process-local replay, keeps generic pinned-peer
      helpers free of a private bypass, and refuses redirected-private and forged URL
      cases with FS_ALLOW_PRIVATE_REMOTE_URLS unset. S3-compatible PUT presigning now
      requires If-None-Match: * for storage-enforced create-only replay protection. The
      Example Showcase source regression processes exactly ten rows and asserts exact
      CSV bytes, checksum, size, content type, and conditional header; the focused
      SDK/runtime/SSRF matrix passes. Keep in_progress until one packaged candidate
      proves durable ownership/job linkage plus authenticated download/readback.

