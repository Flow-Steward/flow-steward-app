  - <<: *open_row
    id: RS5-016
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P1
    title: Registry trash restore and hard-delete lifecycle audit coverage regressed
    sources: [REVIEW-B-B14, REVIEW-B-B15]
    technical_status: fixed_verified
    root_cause: >-
      registry_changelog recorded create/update/delete but nothing for trash or
      restore, so a registry entity's history went silent at exactly the moment it
      left circulation. Only the dataset-to-project link operations wrote lifecycle
      rows; the generic trash/restore path for skills, agents, tools, workflows,
      guardrails and data contracts wrote none.
    failing_test: >-
      Release gate B14 FAIL "changelog rows create=1 afterTrash=1 afterRestore=1 —
      lifecycle not audited".
    proving_test: >-
      tests/unit/test_trash_lifecycle.py::
      test_registry_entity_trash_and_restore_are_written_to_the_changelog and
      test_lifecycle_changelog_rows_are_not_restorable_content_revisions; 67 passed.
    verified_commit: 3c088d8
    runtime_evidence: >-
      Release gate B14 PASS on the running candidate. B09 — which exists to prove a
      purged workflow cannot be resurrected from a history entry — still PASS.
    notes: >-
      SECURITY-RELEVANT DESIGN POINT. restore_entity_revision applies any entry's
      snapshot through apply_entity_snapshot without inspecting the action, and the
      restore normalizers do not validate required fields. Writing a lifecycle row
      with a full entity snapshot would therefore have created a way to overwrite a
      live entity with a stub, or to resurrect a purged one — the exact hazard B09
      guards. Lifecycle rows therefore carry a marker rather than a payload, and the
      actions are declared in LIFECYCLE_CHANGELOG_ACTIONS, which
      restore_entity_revision now refuses. The audit gap was closed without widening
      the restore surface.

