    notes: >-
      The one-line template edit was not the repair. The key's registry entry
      scoped it to the audit_tools group, and selected_groups() adds audit_tools
      only for local_development, so no production selection could ever reach it
      — a production template generated from that registry would have dropped
      the key again. Regrouping it under core_redaction_pii is what makes the
      installer and the doctor own it.
      Impact before the fix: a production deployment built from the shipped
      production template could not run any agent workflow until the operator
      discovered this key, and the failure named it only at run time, not at
      install or in the doctor's required-key check.
    doctor_evidence: >-
      The doctor now refuses the deployment before any workflow runs, and that
      is a direct consequence of this row's registry change rather than an
      assumption about it. Two checks flip on the presence of the key, proven by
      running the packaged doctor inside the candidate container against two
      prod-like env files that differ only in this line:
      env/required_keys ("Required selected-stack variables are set") and
      security/redaction_policy ("Attachment and payload redaction policy is
      configured") both report status=fail naming SECURITY_PII_SALT when it is
      absent, and both stop naming it when it is present.
      RED/GREEN on the key sets themselves, comparing the manifest at d0e31fa^
      with the one at d0e31fa:
        PRE-FIX  / production              doctor_required=False installer_generates=False
        PRE-FIX  / production+audit_tools  doctor_required=False installer_generates=False
        POST-FIX / production              doctor_required=True  installer_generates=True
        POST-FIX / production+audit_tools  doctor_required=True  installer_generates=True
      The audit_tools row matters: even an operator explicitly opting into that
      selection could not reach the key before the fix, because selected_groups()
      admits audit_tools only for local_development. There was no production
      selection that produced the salt.
