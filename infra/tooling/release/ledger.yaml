  - <<: *open_row
    id: RS5-030
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P1
    title: Every shipped extension declares a platform floor the shipped platform cannot satisfy
    sources: [REVIEW-B-CANDIDATE-2026-08-05]
    technical_status: fixed_verified
    verified_commit: 970d2ab
    proving_test: >-
      tests/unit/test_extension_contract_v2.py::
      test_runtime_platform_version_is_the_host_contract_not_the_app_build_version
      and test_shipped_extension_bundles_are_compatible_with_the_host_they_ship_in.
      Both confirmed to fail against the pre-fix resolver
      (assert '0.1.0' == '1.0.0', and "Platform version '0.1.0' is below required
      minimum '1.0.0'"). Extension suites 1183 passed.
    packaged_evidence: >-
      Rebuilt candidate flow-steward:candidate-970d2ab (/health build_sha
      970d2ab0f836..., image_digest sha256:cbb5e20cd2c8..., no source mount).
      POST /api/extensions/installs/{id}/handshake now returns
      runtime_status "compatible" with an empty last_error for all ten shipped
      bundles: the retired tracker bundle, docling, example-showcase, file-transfer,
      ollama-remote, openclaw, openrouter, outgoing-email, telegram and
      toolbox-dataset-connector.
      Before the fix every one of them returned "incompatible" with
      "Platform version '0.1.0' is below required minimum '1.0.0'".
      The two remote providers additionally report "remote_base_url is not
      configured", which is correct operator configuration, not a compatibility
      failure.
    root_cause: >-
      The extension compatibility check reads
      `compatibility.get("platform_min") or "1.0.0"`
      (core/application/extensions/service_support.py and
      extension_descriptor.py), so an extension that declares no platform_min is
      treated as requiring platform >= 1.0.0. The packaged platform reports
      build_version 0.1.0. Eight of the ten shipped bundles declare no
      platform_min at all, and the two that do (flowsteward_openrouter,
      flowsteward_ollama_remote) declare exactly 1.0.0. The result is that on the
      shipped 0.1.0 release no extension can pass the compatibility check.
    failing_test: >-
      On the immutable packaged candidate (clean install, image
      flow-steward:candidate-29136fc, /health build_sha 29136fc, no source
      mount), POST /api/extensions/installs/{id}/handshake for
      flowsteward.file-transfer returns
      runtime_status "incompatible",
      last_error "Platform version '0.1.0' is below required minimum '1.0.0'".
      runtime_status and health_status stay "unknown" for every shipped bundle.
    runtime_evidence: >-
      Measured on the candidate: 8/10 shipped extension.yaml files contain no
      platform_min; the 2 that do declare 1.0.0; GET /api/health reports
      build_version 0.1.0. This is invisible on the long-lived development stack,
      where extension rows were enabled over time and were never re-handshaken.
    notes: >-
      NEEDS AN OWNER DECISION — deliberately not fixed unilaterally because it is
      a version-policy question, not a defect with one obvious repair. Two
      independent parts:
      (a) the DEFAULT is wrong on its own terms. An extension that declares no
      compatibility block has stated no minimum, so defaulting it to 1.0.0
      invents a requirement its author never wrote. A default of 0.0.0 (no
      minimum) is the defensible reading and would fix 8 of the 10.
      (b) the two bundles that explicitly declare platform_min 1.0.0 would still
      be incompatible. That is an authoring/versioning decision: either those
      manifests should declare the version the platform actually ships (0.1.0),
      or the platform's own build_version should be 1.0.0 for this release.
      Impact is bounded but real: basic use still works (a data connection was
      created and group B passes 19/19 on the candidate using the toolbox
      connector), but handshake and health can never go green, which is exactly
      what RS5-006 and RS5-007 require to be provable.

  - <<: *open_row
    id: RS5-031
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
