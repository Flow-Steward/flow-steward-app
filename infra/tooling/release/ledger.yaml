  - <<: *open_row
    id: RS5-018
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P1
    title: Project workflow bindings cannot be explicitly removed
    sources: [REVIEW-B-P2-workflow-unlink]
    technical_status: fixed_verified
    verified_commit: e54ec18
    root_cause: >-
      Unbinding a workflow set enabled=false and is_default=false but left
      deleted_at untouched, so the row survived and stayed in the
      operator-facing binding list permanently. The table already models
      removal — the insert path explicitly clears deleted_at when a binding is
      re-added — so tombstoning was the intended mechanism and simply was not
      applied on removal.
    failing_test: >-
      tests/unit/test_platform_logger_mixin_coverage.py::
      test_removing_a_project_workflow_binding_tombstones_it,
      ::test_removing_every_project_workflow_binding_tombstones_them and
      ::test_binding_list_can_exclude_removed_bindings all fail against the
      previous code.
    proving_test: >-
      The same three. The last one is the one that keeps the fix honest: it
      asserts the two readers stay different — the operator-facing list filters
      tombstones while the unfiltered read still returns them.
    packaged_evidence: >-
      Red and green on packaged candidates with the same database and the same
      sequence.
      BEFORE (candidate-9b6019d): removing standard_feature left it in
      GET /api/projects/{id}/workflows as (standard_feature, enabled=false),
      with no way for the operator to get rid of the row.
      AFTER (candidate-e54ec18): binding quick_fix and standard_feature lists
      both; removing standard_feature lists only quick_fix, and the database
      shows the row retained with deleted_at set. Re-adding it returns it to the
      list and clears the tombstone, so the round trip is intact.
    notes: >-
      Checked and deliberately left alone: a project workflow binding is not an
      authorization boundary for submission. A workflow that was never bound to
      the project is still accepted by POST /api/tasks when named explicitly, so
      "still runnable after removal" is a property of the selection model rather
      than a defect in removal, and is not what this row is about.
      The job display-name lookup keeps reading tombstoned rows on purpose: a job
      that ran on a since-removed binding must still resolve its workflow name.
      That is why include_deleted defaults to True and only the operator-facing
      list passes False.
    cleanup_evidence: >-
      The project was returned to its single quick_fix binding and readiness to
      200 ready=True after the probe.

