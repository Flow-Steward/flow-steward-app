      what deployment_doctor_static.py:172 checks, and
      generated_secret_env_keys_for_selection is what
      core/infrastructure/installer/gateway.py:1615 generates from. The claim
      "the installer now creates it" is the installer's own code path.
    shipping_safety: >-
      No static salt ships. .env.example.prod declares the key as an empty
      placeholder with a comment that install.sh generates and preserves it,
      exactly as ENCRYPTION_KEY and FS_BACKUP_ENCRYPTION_KEY are declared two
      lines above; configuration_store keeps it in _PRESERVED_ENVIRONMENT_KEYS,
      so it survives reinstalls per deployment. The alternative reading of this
      row — that the production template should carry SECURITY_* values — would
      have been a security regression (identical salts across installations) and
