    technical_status: open_confirmed
    release_blocking: false
    owner_disposition: accepted_post_release_tooling_debt
    root_cause: >-
      Candidate identity derives the Compose project only from the first twelve characters of
      the Git SHA. Two worktrees auditing the same commit therefore resolve to the same Compose
      project and endpoints. candidate_prepare.sh sets FS_RELEASE_PREPARE_MODE=1, which bypasses
      candidate_stack.sh's bring-up ownership preflight before running `up -d` for the data
      services. Ownership is checked only later, after Compose has already recreated or replaced
      resources in the other auditor's candidate.
    failing_test: >-
      While another auditor owned fs-candidate-2fb1986fd67b from the main worktree, preparation
      from a detached worktree at the identical SHA reused that project. Docker labels then
      showed app/worker/MCP/control-plane/rabbitmq created from the main repository, but
      PostgreSQL, Mailpit, SeaweedFS, and Traefik recreated from the detached worktree before the
      later runtime `up` refused ownership. The resulting mixed-owner stack invalidates release
      evidence and can mutate the first run's data plane.
    proving_test: >-
      Add an explicit candidate-instance namespace to Compose project, endpoints, snapshot, and
      evidence identity so independent same-SHA runs can coexist, or acquire a fail-closed
      ownership lock and run the ownership preflight before every Compose mutation including
      prepare mode. A real disposable-Docker two-worktree regression must start the first
      same-SHA candidate, attempt the second, and prove either two disjoint inventories or a
      pre-mutation refusal while all first-run container IDs, start times, volumes, and endpoints
      remain unchanged. Cleanup of either instance must not select the other.
    runtime_evidence: >-
      The collision was observed on the release host and avoided for the independent product
      audit by using an empty detached commit with a byte-identical source tree. No container or
      data owned by the other auditor was intentionally removed.
    notes: >-
      This is a release-process P1, not a product-runtime regression. Until fixed, only one
      candidate per SHA may exist on a Docker host and operators must coordinate manually before
      preparation; that operational restriction is too fragile for release sign-off.

