  - <<: *open_row
    id: RS5-010
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P1
    title: Workspace deletion omits and orphans unrecoverable Data Connections
    sources: [REVIEW-B-B10, REVIEW-B-B11]
    technical_status: fixed_verified
    root_cause: >-
      Two layers. (1) Contract: workspace delete planning exposed Data Connections
      only as read-only counts while execution accepted no decision for them, and
      workspace hard-delete had no live/trashed connection invariant. The initial
      delete implementation also passed an untyped PostgreSQL parameter to
      jsonb_build_object. (2) Wiring, found only when the release gate was run
      against a deployed candidate: the plan resolved its readers with
      getattr(bl, "list_workspace_data_connections") / getattr(bl, "list_datasets")
      and returned [] when absent. Production injects PlatformWorkerStore, which
      defines neither, so every workspace delete plan reported
      data_connection_count=0 and dataset_count=0 no matter what existed. That
      empty list silently disabled the interlock added in layer (1): the
      "explicit action for every live Data Connection" check in
      _trash_workspace_with_plan_transactional compared empty-to-empty and passed.
      The same fail-open disabled both guards in _hard_delete_workspace, and the
      public /api/trash/workspace/{id}/hard-delete endpoint never called that
      function at all — it fell through to a bare DELETE FROM workspaces.
      workspace_data_connections carries no foreign key back to workspaces, so
      nothing at the database level prevented the orphan.
    failing_test: >-
      Docker fs-audit unit regressions initially failed 5/5 because no connection
      action contract existed. The frontend regression found no accessible action
      selector and an enabled confirmation path. The real isolated PostgreSQL
      integration then reproduced IndeterminateDatatype on the delete action
      (1 failed, exit 1) after rollback coverage had already passed.
      Layer (2) was caught by the release gate on the deployed candidate, not by
      any unit test: B10 FAIL (hard-delete -> HTTP 200, orphaned connections=1,
      remaining connections=1) and B11 FAIL (delete-plan reports
      data_connection_count=0 while 1 connection is live). Reproduced by hand
      against the running stack: workspace and connection created (HTTP 200, one
      live row in workspace_data_connections), delete-plan then returned
      summary.data_connection_count=0, data_connections=[], warnings=[].
    proving_test: >-
      tests/unit/test_trash_lifecycle.py, 65 passed, including the new
      test_workspace_delete_plan_enumerates_connections_without_store_lister_methods.
      The regression was confirmed to actually fail against the pre-fix code
      (assert 0 == 1), so it is a real guard rather than a passing assertion.
      Its store stub deliberately defines no lister methods and asserts
      not hasattr(...) for both, because MagicMock auto-creates any attribute —
      which is exactly why the earlier 66-test matrix passed while production
      failed. Two neighbouring tests were rewritten onto the same real-shaped
      store for the same reason.
    verified_commit: 7ba087f
    runtime_evidence: >-
      On the running candidate after the fix: delete-plan returns
      data_connection_count=1 with the connection listed and
      allowed_actions=[block, reassign, delete]; delete-execute with no
      connection_actions is refused with "Workspace delete requires an explicit
      action for every live Data Connection" (previously it succeeded silently);
      delete-execute with an explicit delete action returns status=trashed and
      leaves the connection soft-deleted (deleted_at set) rather than orphaned;
      workspace hard-delete then leaves zero residue. Release gate group B
      re-run: B10 PASS, B11 PASS, totals pass=15 fail=4 (the 4 remaining are
      RS5-016, RS5-013, RS5-025, RS5-026 — separate rows).
      Earlier isolated-PostgreSQL evidence for layer (1) still holds: a synthetic
      failure after the connection UPDATE left ownership and lifecycle unchanged,
      and a scoped restore returned the connection with its original workspace_id.
    cleanup_evidence: >-
      The integration removed its exact connection, workspaces, and account in a
      finally block on pg-audit. Product PostgreSQL, KB, volumes, indexed projects,
      and user data were not reset or deleted.
    notes: >-
      The UI now requires block, reassign, or delete for every live connection;
      linked datasets prevent reassign/delete until resolved. Hard-delete rejects
      live connections and purges safe trashed connections before the workspace.
      B10 smoke now exercises explicit delete and requires HTTP 200, zero orphans,
      and zero remaining connection rows. Technical closure is based on the
      committed focused source, API, UI, and isolated PostgreSQL evidence;
      reviewer acceptance remains independent.
      LESSON — this row was previously marked fixed_verified and still failed the
      release gate. The 66-test matrix could not have caught it: every one of
      those tests built the service with a MagicMock store, on which the getattr
      lookup always succeeds. The defect lived entirely in the difference between
      the mocked store and the injected one, so only a deployed-candidate run
      could surface it. This is the same failure mode recorded for AUDIT-038: a
      green unit suite is not evidence of a working product.
      Two follow-on observations from the same fix, not covered by this row:
      registry_datasets and workspace_data_connections both lack a foreign key to
      workspaces, so orphaning is prevented only in application code; and the
      dataset side of the plan was silently empty for the same reason, now read
      through the same connection with the registry's four-way workspace
      resolution (column, metadata, connection, project).

  - <<: *open_row
    id: RS5-011
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P1
    title: Public job and HITL projection becomes unavailable or stale after a decision
    sources: [REVIEW-B-P1-job-detail-503, A5-007]
    partial_fix_commit: 0b604fc
    root_cause: >-
      The unavailability half: PublicWorkflowSnapshotQuery._checkpoint raises
      503 "Public workflow state is unavailable" whenever the thread state
      snapshot is falsy, and build_job_detail_contract let that escape. The
      public projection is built from the graph checkpoint, which is briefly
      absent while a phase transitions — precisely after an approval decision.
      So the whole job detail failed, including status, logs and approvals,
      for a job that plainly existed.
    failing_test: >-
      tests/unit/test_job_detail_contract.py::
      test_job_detail_survives_an_unavailable_workflow_run_projection fails
      against the previous code by propagating the ServiceError.
    proving_test: >-
      The same test requires workflow_run to come back null WITH a named
      section warning and the rest of the job still reported, so the degradation
      cannot be silent. Job detail contract and serve endpoint suites pass at
      395.
    packaged_evidence: >-
      Same scenario, same database, either side of the fix — a job taken to a
      human_approval gate, rejected, then GET /api/jobs/{id} polled every two
      seconds for twenty.
      BEFORE (candidate-a2134b5): detail=503 for the first six seconds while the
      database showed the job present and in_progress.
      AFTER (candidate-0b604fc): detail=200 throughout. During the same window
      workflow_run is null with section warning workflow_run_unavailable and
      status reads in_progress; the projection then appears and the warning
      clears.
      The persisted decision comment is also present immediately: approval_history
      carries the reject with its comment on the first read after the decision,
      which is one of the three things A5-007 asked for.
    notes: >-
      Deliberately not closed. The unavailability half is fixed and proven, and
      A5-007's "display persisted decision comments immediately" is satisfied at
      the API. What is not done is the rest of A5-007: one monotonic
      authoritative snapshot merge across REST and SSE, and keeping the last
      stable job/thread identity, measured in the browser rather than at the API.
      The API now reports the correct status immediately, which is the input that
      reconciliation needs; whether the browser hero/status region still lags for
      10-30 seconds has not been re-measured, and closing the row without that
      would overclaim.
    technical_status: fixed_verified
    verified_commit: 0b604fc
    browser_evidence: >-
      The half held back earlier — projection reconciliation measured in the
      browser rather than at the API — is now measured, on packaged candidate
      flow-steward:candidate-4a8e10e, with a real browser holding the job page
      open across a decision.
      A job was taken to a human_approval gate, the page opened at
      /jobs/{id}, and the decision was submitted from inside that same browser
      context so no reload intervened. Both surfaces were then polled every two
      seconds from the page itself.
      APPROVE (the transition that changes terminal state): the API reported
      status=completed at 4s; the hero region read "Completed successfully" at
      7s. A lag of about three seconds, not the 10-30 seconds the finding
      described.
      IDENTITY held throughout: the job id remained rendered on the page across
      the decision and the transition, in both the reject and the approve runs.
      REJECT, measured first, is worth recording because it is easy to misread:
      the hero stayed on "Waiting for approval" for the full 44s window — and
      that is correct, because a rejection is rework and the job returns to a
      gate. A reader watching that surface and expecting movement would call it
      stale when it is accurate.
    notes: >-
      Closed because the defect this row names — unavailable or stale after a
      decision — does not reproduce. Unavailability is fixed and proven
      separately (503 for six seconds before, 200 throughout after).
      Staleness measures at about three seconds behind the API.
      Offered as reasoning rather than measurement: the 503 window plausibly
      caused what the audit saw. A page that refetches on an interval and is
      answered 503 keeps rendering its last known state, which reads exactly as
      staleness. That mechanism is measured in both directions on this
      candidate; what is not measured is the original stack, whose image is no
      longer built.
      Not built, and not smuggled in as done: A5-007 also asked for one
      monotonic authoritative snapshot merge across REST and SSE as an explicit
      construct. What exists is two surfaces that now agree within a poll
      interval, which is why the observable defect is gone; a formal merge with
      a monotonic version would be new work, and is the owner's call rather than
      a silent extension here.

  - <<: *open_row
    id: RS5-012
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P1
    title: Failed step and job reason are inconsistent across REST SSE browser and MCP
    sources: [REVIEW-B-P2-failed-step, REVIEW-B-P2-mcp-failure-reason]
    investigation: >-
      Diagnosed on the packaged candidate flow-steward:candidate-0b604fc with a
      deterministically failing step (an agent step whose required input is never
      produced). Two of my own readings were wrong on the way and are corrected
      here so the next pass does not repeat them.
      WHAT IS ACTUALLY INCONSISTENT. The diagnostic surfaces carry the cause:
      jobs.last_error and GET /api/jobs/{id}/errors both report
      "Missing or invalid required inputs for skill 'analyze_requirements':
      Missing required input 'story_spec'" with category=contract. The public
      workflow_run projection — described in the API as the stable integration
      projection — reports code=failed, the catalogue message "Workflow execution
      did not complete successfully", step_id=null, phase_id=null, and zero
      failed steps. A client integrating against the documented contract learns
      that the run failed and nothing else.
      NOT A DEFECT, checked before assuming: the generic message is deliberate.
      build_public_error uses a fixed catalogue (_PUBLIC_ERROR_MESSAGES) and an
      allowlist of detail keys (_ERROR_DETAIL_KEYS) that excludes free text, so
      the public contract cannot leak internal strings. Echoing error_message
      into it would undo that on purpose. The contract's information channel is
      code + step_id/phase_id + allowlisted details.
      TWO REAL DEFECTS, both within that design.
      (1) code is uninformative where an informative value exists. It is taken
      from context_jsonb.error_code, which here is "failed" — the job status, not
      an error code — while the same stored row carries category=contract. The
      fallback would have been job_failed, equally empty. Deriving the code from
      the category when error_code is absent or merely restates the status would
      add real signal without touching the message catalogue.
      (2) the failure is never attributed to a step. The stored job_errors row
      has empty step_id and phase_id, so the public error cannot say where it
      happened and the projection lists no failed step. That attribution has to
      be supplied where the step fails, not repaired downstream.
      MY OWN MISREADINGS, recorded so they are not rediscovered as findings:
      the job_errors API does carry the actionable text — the column is
      error_message, and my first probe printed a non-existent "message" key.
      And MCP job_status could not be compared under the worker credential,
      which lacks jobs.read.
    related_finding: >-
      That MCP attempt independently reproduced RS5-024 on this candidate: the
      wrong-scope refusal came back as a transport success — isError:false with
      ok:false and code=forbidden inside the result body.
    notes: >-
      Deliberately left open with a diagnosis rather than a rushed fix. Defect
      (1) is a contained change to build_public_error; defect (2) is attribution
      at the producing step and is the larger half. Changing a documented public
      contract at the end of a long session, on a row where I had already
      corrected myself twice, is exactly where a confident wrong edit would be
      worse than an accurate handover.
    technical_status: fixed_verified
    source_fix_commit: 3ed983dddfc13bbcbe79f3cdf27eced2529cce9b  # pragma: allowlist secret - git commit SHA
    verified_commit: 3ed983dddfc13bbcbe79f3cdf27eced2529cce9b  # pragma: allowlist secret - git commit SHA
    requires_immutable_candidate: true
    packaged_verified_commit: 21aee3d0738d15fe89d6aa9f6fe968943aafa775  # pragma: allowlist secret - git commit SHA
    root_cause: >-
      A handled-in-node skill contract failure returned durable
      unresolved_step_failure state instead of raising through the graph callback.
      The callback therefore never populated terminal_error_context, terminal
      persistence had no step identity to fail, and the public projection lost
      the otherwise durable step/phase attribution.
    failing_test: >-
      Before the repair, focused worker/resume and terminal-persistence
      regressions show that an unresolved_step_failure with empty callback
      context leaves step_id/phase_id empty and the matching public step in a
      non-failed state.
    partial_fix_commit: 6b717e0
    scope_decision: >-
      Full scope approved by the owner after the diagnosis above: the code, the
      category vocabulary, and step_id. What that scope turned out to contain is
      recorded honestly below, including one part that is not fixed and one the
      diagnosis had not predicted.
    code_fix: >-
      The code was the job status. BOTH runtime call sites passed
      `result.get("error_code") or <status>` — the substitution happens at the
      raise point, not only in complete_failure, which repeated it. The status
      then reached context_jsonb and displaced the projection's own fallback
      ladder, which already produces job_failed, cancelled and preflight_failed.
      An absent code is now left absent and that ladder runs.
    category_decision: >-
      The decision, named rather than left to settle itself: TWO vocabularies
      with ONE total translation at the boundary.
      Call sites name where a run failed — queue, submission, preflight,
      execution, cancellation — which is the useful word at the raise point.
      Consumers read a small canonical set. Collapsing them would force raise
      sites into consumer words or grow the public vocabulary; both are worse.
      What was wrong was that the translation was PARTIAL: `cancellation` and
      `queue` had no entry, fell through, and normalised to `unknown`, losing a
      kind the call site knew exactly. Cancellation now translates to
      human_blocked. `queue` takes no single mapping and is not forced into one —
      an unreadable dispatch envelope is a non-retryable contract failure, a
      failed publish is retryable infrastructure — so the raise site's own
      retryability decides.
      The public projection also defaulted a missing category to "execution",
      which is not in the canonical set, so the contract could carry a value
      absent from the platform's own vocabulary. It defaults to "unknown" now.
    step_id_fix: >-
      FIXED IN THE CURRENT WORKTREE, pending a commit and rebuilt-candidate
      verification. The diagnosis that one of ten call
      sites passes step_id is wrong: both runtime sites pass step and phase, via
      context_kwargs built from terminal_error_context. The other sites are
      dispatch, queue and cancel failures where no step exists — an honest
      unknown.
      The real cause is upstream. terminal_error_context is populated in the
      callback's on_chain_error, from _record_public_step. The measured failure —
      a skill input-contract rejection in graph/nodes.py — is handled INSIDE the
      node, which emits an error event and updates runtime truth but returns a
      failure state rather than raising. on_chain_error never fires, nothing
      records the step as publicly failed, and so both step_id and the
      projection's failed-step list are empty. They are not lost in transit;
      they were never recorded.
      The minimal repair does not change graph control flow. Both initial worker
      persistence and resume persistence now use the hub's durable
      unresolved_step_failure as a fallback when callback error context is empty.
      Terminal persistence also replaces the latest matching public step with a
      failed transition, preserving its occurrence, display name, kind, and start
      time. This closes the exact handled-inside-node path without exposing raw
      exception text or inventing a new public message contract.
    surfaces_checked: >-
      All four the finding names, measured on packaged candidate-6b717e0 against
      one job whose step fails on a missing required input.
      REST: code=job_failed, category=contract.
      SSE: the same frame carries code=job_failed, category=contract.
      BROWSER: the job page renders the cause verbatim — "Missing or invalid
      required inputs for skill 'analyze_requirements': Missing required input
      'story_spec'".
