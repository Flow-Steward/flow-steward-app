      one succeeded send_email with a real provider_message_id.
      The docs now carry that connection verbatim, note that host is the Compose
      service name rather than localhost, and name the one caveat the old text
      missed: SSRF protection refuses hosts resolving to private addresses, so a
      Compose service needs the documented FS_ALLOW_PRIVATE_REMOTE_URLS
      override — which must stay off in production because it disables the
      protection for every outbound connection, not only the one being tested.
    notes: >-
      Worth recording as a pattern: the old text was not merely stale, it
      discouraged a working configuration and framed it as a product limitation.
      That is more costly than an omission, because it stops the reader from
      trying the thing that works.

  - <<: *open_row
    id: RS5-021
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P1
    title: Connector deletion leaves live-looking derived tool projections
    sources: [A5-015]
    technical_status: fixed_verified
    verified_commit: 2b752b2
    root_cause: >-
      Deleting an MCP connector disabled its projected registry tools but left
      their availability untouched. The rows survive on purpose — the projected
      tool id stays reserved so a later connector with the same namespace cannot
      silently inherit it — but a surviving row still read
      availability_status='available' with reason_code 'none' and no text, so it
      claimed a source that no longer existed.
      Setting those fields through save_tool does not work and fails silently:
      save_tool builds its row from ToolManifest, which models the portable tool
      contract and deliberately drops availability, so the values were discarded
      on the way to the database.
    failing_test: >-
      tests/unit/test_mcp_connector.py::TestMcpConnectorCommandService::
      test_delete_connector_keeps_projected_tool_id_reserved, extended here,
      fails against the previous code with KeyError: 'availability_status'.
    proving_test: >-
      The same test now requires the retained projection to read
      availability_status 'unavailable', reason_code 'source_connector_removed',
      and the deleted connector's id inside the reason text. MCP connector,
      connector step runtime and registry admin suites stay green at 423 passed,
      and the fast gate passes.
    packaged_evidence: >-
      Measured either side of the fix on packaged candidates, same database, same
      scenario: a disposable MCP connector pointed at the candidate's own MCP,
      synced, its discovered tools allowlisted as rs5021.project_list and
      rs5021.kb_search, then deleted through DELETE /api/mcp/{id}.
      BEFORE (candidate-6531889): after deletion both rows read enabled=false but
      availability_status=available, reason_code=none, reason text empty.
      AFTER (candidate-2b752b2): both read enabled=false,
      availability_status=unavailable, reason_code=source_connector_removed, and
      the text names the deleted connector id and what to do about it.
      In both cases the connector row itself was gone and the tools had already
      stopped being offered — GET /api/workflows/meta/connector-catalog listed
      nothing for them — so what changed is the row telling the truth about why.
    notes: >-
      The finding offered two acceptable resolutions: delete the projections
      transactionally with the connector, or retain them and label the source
      unavailable. Retention is the existing deliberate behaviour, because the id
      reservation prevents a later connector from taking over a tool id that
      workflows may still reference, and the update_connector path already
      refuses to reuse a reserved id. So the second resolution is the one that
      fits, and this closes the half that was missing.

  - <<: *open_row
    id: RS5-022
    technical_status: deferred_by_scope
    severity: deferred_beta_scope
    title: AI Builder follow-up edit disagrees with the canonical visible canvas
    sources: [A5-011]
    investigation: >-
      Read rather than reproduced, deliberately: the symptom is model-dependent
      and reproducing it means driving a generation session, which is neither
      deterministic nor evidence about the mechanism. The mechanism is readable
      and is recorded here so the decision can be made on it.
      WHAT THE GATE COMPARES. runtime_intent_gate takes required step kinds from
      the intent spec and phase plan, and matches them against
      _draft_step_kinds(draft) — the model's draft. It never reads the persisted
      workflow; the module does not receive one. So on a follow-up edit, a step
      the canvas already has but the new draft does not restate reads as
      missing. That is exactly the shape the finding describes: rejected for a
      step the operator can see.
      WHAT ALREADY EXISTS. The edit path does not ignore the canvas — it works
      around the gate rather than through it. _intent_with_existing_refine_
      external_grounding inspects the persisted workflow and, when it already
      carries an http_request, connector or invoke_workflow step, strips
      external_call and http_api from the required structures so the gate cannot
      demand them. There is a second carve-out in the build mixin: when a refine
      request is output-only and every remaining error is external/http noise,
      the errors are dropped.
      WHY IT CAN STILL FIRE. Both are conditional. The grounding helper returns
      the intent unchanged when the request names a new external target, carries
      a single explicit URL, or requests no output names; the second carve-out
      needs the request to be output-only AND every error to be external noise.
      A refine request that asks for something else as well — the audit's asked
      for a transform — satisfies neither, and the gate then demands a kind the
      canvas already provides.
    gap_against_the_bar: >-
      The audit's own reading is that this meets the agreed minimum Beta bar —
      it did not crash or corrupt the workflow and produced a valid, editable,
      runnable draft — and that the remedy is to prioritise state/canvas
      synchronisation over model tuning. That is a positioning judgement about
      generation quality, not a defect, and it is not something to close by
      changing code.
      The one part that is mechanical rather than positional is above: the gate
      validates the model's draft in isolation while the operator is looking at
      the merged canvas.
    what_building_it_would_take: >-
      Making the gate authoritative over the merged result rather than the draft:
      pass the persisted workflow into runtime_intent_gate and satisfy a required
      step kind from either the draft or the canvas it is being merged into, so
      requirement-stripping helpers become unnecessary rather than being extended
      case by case. That removes a class of false rejections instead of the
      instances that have been reported so far.
      It is a design change to the generation pipeline's validation contract,
      with its own risk: a gate that accepts what the canvas already has will
      also stop catching a draft that silently drops a step the user asked to
      keep. Deciding that trade is the owner's call.
    notes: >-
      Deliberately not fixed here, and deliberately not closed. Rewriting the
      gate's contract would be product scope presented as defect remediation,
      which is the worst available outcome on a row the audit itself classifies
      as positioning. What is added is the mechanism, the two carve-outs that
      already exist, the conditions under which they do not fire, and what a
      real repair would involve — so the decision can be taken on evidence
      rather than re-derived.
    owner_decision: >-
      Closed by scope, not by change. The owner has deliberately left the
      behaviour as it is: AI Builder is in Beta and has been worked on for
      months, this part is not critical, and a workflow can be assembled by hand
      when the builder disagrees with the canvas. The follow-up check on merging
      or replacing during a refine is cancelled with it.
      The mechanism above is kept in full on purpose. It is the part that will
      not be obvious again from scratch: the M4 gate takes required step kinds
      from the intent spec and matches them against the model's draft, and never
      receives the persisted workflow at all; the existing carve-out only strips
      the EXTERNAL requirement when the saved workflow already carries an
      http_request, connector or invoke_workflow step, so routing, dataset_query
      and loop structures have no equivalent and still read as missing when the
      draft does not restate them.
    runtime_evidence_2026_08_13: >-
      On exact candidate 9411658de284 with the owner's configured real model,
      four create attempts produced zero useful workflows and two refine attempts
      produced zero accepted edits. One deterministic Open-Meteo prompt generated
      a structurally runnable graph but omitted the required query parameters and
      then reported success on the empty request. Its refine request was rejected
      because the M4 gate said http_request was missing although the persisted
      visible canvas contained that step. The builder did not corrupt the registry;
      this remains deferred under the agreed Beta scope, with evidence captured in
      release-readiness-audit-2026-08-13.md.
    runtime_evidence_2026_08_15_round2: >-
      Exact candidate 8626eaa5f92c used the owner's verified gpt-5.6-luna route,
      so provider unavailability was excluded. Broad create prompts either stopped
      honestly at capability selection or collapsed the requested multi-phase graph
      into one generic agent phase. A minimal Analyst draft was applied but its
      generated invocation omitted the skill's required story_spec input; the job
      failed immediately with a typed missing-required-input error. A precise
      follow-up edit was then rejected by M4 for a missing agent kind already present
      on the saved workflow. No registry corruption occurred. This reconfirms the
      known create/refine state-contract weakness and remains deferred under the
      owner's explicit Beta scope.
    runtime_evidence_2026_08_16: >-
      Exact candidate d56a533f5b3b used a newly verified account-scoped custom
      gpt-5.6-luna provider, so credentials and model availability were proven by
      successful upstream usage. Three create sessions consumed 10,615 reported tokens
      and produced two reviewable plans but zero applicable drafts. One stopped with
      a structured missing-capability outcome; the next mapped a pinned Analyst/Analyze
      Requirements request to unrelated low-confidence Text operations; the last
      mapped an explicitly pinned std.text upper request to an
      agent phase and then failed M4 with missing required step kind/structure: agent.
      The service stayed available, returned structured safe outcomes, and the
      disposable workflow/project/provider were removed. Generation quality remains
      below a reliable first-draft bar but stays deferred under the explicit Beta scope.

