  - <<: *open_row
    id: RS5-080
    severity: P1
    title: Preserve the executable workflow graph during AI Builder refinement
    sources: [CRA19-AI-BUILDER-REFINE]
    technical_status: fixed_verified
    review_status: accepted
    reviewer: agent-release-audit-2026-08-20
    verified_commit: 4972faf362726aa4afc22442375d0a4e8f66ed0e  # pragma: allowlist secret - git commit SHA
    packaged_verified_commit: 4972faf362726aa4afc22442375d0a4e8f66ed0e  # pragma: allowlist secret - git commit SHA
    requires_immutable_candidate: true
    root_cause: >-
      The Track2 build mixin invokes _deterministic_refine_output_fallback for every
      refine request before the real builder. Because an existing callable workflow has
      required outputs, the fallback emits only a new set_variable output-shaping phase
      even when the request is an HTTP configuration edit. It does not preserve or patch
      the existing HTTP phase. The narrower _refine_request_is_output_only predicate
      exists but is not applied at this call site, so the runtime intent gate then
      rejects the fallback's missing HTTP path and output producer.
    failing_test: >-
      With a verified gpt-5.6-luna provider on exact candidate 226b61be4ea3, AI Builder
      created and applied a connector/http_request/stop_success Open-Meteo workflow and
      job 7fcc2416-3dbb-41a5-8d84-f75f1859fac3 completed. Refining that applied workflow
      to add timezone=auto, and independently changing only timeout_seconds to 20, both
      returned status failed with no draft: missing http_request structure, ungrounded
      external action, and missing response_json producer. Both traces explicitly used
      the deterministic refine output fallback.
    proving_test: >-
      Gate the output-only fallback with _refine_request_is_output_only and preserve all
      untouched phases/steps when producing a bounded edit patch. Add deterministic
      regressions for the exact timezone and timeout edits on an existing HTTP workflow,
      plus a true output-only positive fallback. Prove public create -> apply -> run ->
      refine -> apply -> run with a real provider on one immutable candidate, while
      retaining the safe missing_integration_spec negative for ungrounded integrations.
    source_evidence_2026_08_17: >-
      A dedicated deterministic HTTP refinement patch now deep-copies the containing
      phase, preserves every phase, step ID, and untouched runtime field, and changes
      only the requested timezone or timeout value. The failing-first regression passed,
      the complete Track2 suite passed 201/201, and release smoke ownership passed 69/69.
      The final full gate passed 11858 backend and 841 frontend tests.
    runtime_evidence: >-
      Authenticated D12 on immutable candidate 4972faf36272 used a verified real OpenAI
      provider with gpt-5.6-luna and passed all 4/4 assertions with exit 0. Public
      create/apply/run completed with three steps; timezone=auto refine/apply/run and
      timeout_seconds=20 refine/apply/run both completed while preserving step count
      3->3 and stable step IDs. The ungrounded request returned
      missing_integration_spec with no draft.
    packaged_evidence: >-
      Exact detached candidate 4972faf362726aa4afc22442375d0a4e8f66ed0e
      was built once with the recorded app, CLI, and MCP digests. D12 and the final clean
      full gate completed with exit 0 on that exact source and image identity.
    cleanup_evidence: >-
      D12 hard-deleted its project and all temporary workflow fixtures through public
      lifecycle APIs. Final candidate state was projects=0, jobs=0,
      owned_workflows=0, and RabbitMQ had zero ready or unacknowledged messages; the
      temporary provider and audit identity are candidate-owned and removed with the
      isolated candidate stack.
    notes: >-
      Release blocker under the owner-approved Beta promise: creation works, but the
      advertised edit path deterministically loses the executable workflow it is meant
      to refine.
    review_evidence_2026_08_20: >-
      Independent authenticated D12 on successor candidate e88f4d339e7f used a verified
      real gpt-5.6-luna route and passed grounded create/apply/run plus timezone and
      timeout refine/apply/run. Step count and IDs remained stable, while the ungrounded
      negative returned missing_integration_spec without inventing a draft.

