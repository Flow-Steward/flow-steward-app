      zero similarity as vector_similarity=0.0. The shared relevance helper sees only
      retrieval_mode, lexical_match, and that ambiguous number, so every nonlexical result
      below 0.55 is rejected, including graph-expanded records when vector search is disabled
      or that record has no embedding. Both code-intelligence search adapters separately add
      retrieval.count_records before applying the helper to items; the count has no matching
      post-retrieval relevance predicate. The public group total, category counts, has_more,
      and cursors can therefore describe rows that are not displayable.
    failing_test: >-
      Claude measured the candidate with 112 memory_records, zero embeddings, vector backend
      None, and vector_similarity=0.0 for every live result. Independent Docker reproduction
      supplied one graph-only candidate (lexical=false, vector=0.0, graph=0.05) and one
      lexical candidate to each adapter. memory_search_result_is_relevant rejected the graph
      result; search_code_intelligence and search_neo4j both returned total=2 with only the
      lexical item. The shipped defaults are vector_backend=null and
      context_graph_backend=postgres_age, so this state is a supported release configuration.
    proving_test: >-
      Represent vector-search-applied and per-record similarity availability explicitly,
      preserving lexical hits, graph evidence without a vector score, and strong semantic
      hits while rejecting weak vector-only neighbours below 0.55. Apply the same predicate
      to knowledge tools, both search adapters, and an authoritative relevant-count path.
      Cover vector disabled plus graph enabled, partial embeddings, lexical/graph/weak/strong
      vector combinations, multiple projects, and more relevant rows than one page. Assert
      total, returned_count, loaded_count, has_more, next_cursor, category counts, and visible
      IDs remain consistent under the downstream global semantic-score policy.
    source_evidence: >-
      Unified retrieval now exposes vector_search_applied, vector_similarity_available, and
      nullable vector_similarity, preserving computed zero separately from unavailable
      evidence. One shared relevance contract retains lexical, graph, and strong-vector hits,
      rejects weak vector-only neighbours below 0.55, and compensates for the 0.97 memory
      source weight so downstream global visibility agrees. Knowledge tools and both search
      adapters use that predicate; adapters derive page items and exact relevant total from
