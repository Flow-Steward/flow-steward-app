      TASK SUBMISSION, measured either side of the fix with the same request.
      Before (candidate-2b752b2): a submission missing task_summary returned 422
      with {"error":"Task submission validation failed",
      "code":"invalid_task_submission"} and nothing else.
      After (candidate-9b6019d): the same request returns the same code with
      "fields":[{"field":"task_summary","error":"missing","message":"Field
      required"}].
    notes: >-
      The response carries field locations and error types, never the rejected
      input. A task submission carries task content and this response is built
      before any of it has been accepted, so echoing values back would be a new
