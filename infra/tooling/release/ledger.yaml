    severity: P1
    title: Enforce the configured human-rejection rework budget
    sources: [RRA13-P1-04]
    technical_status: fixed_verified
    verified_commit: 1d0bc76d0fdad779a176e96882f1985499b5eae7  # pragma: allowlist secret - git commit SHA
    packaged_verified_commit: 1d0bc76d0fdad779a176e96882f1985499b5eae7  # pragma: allowlist secret - git commit SHA
    runtime_evidence: >-
      Exact candidate evidence is recorded in runtime_evidence_2026_08_14 below.
    runtime_evidence_2026_08_14: >-
      Exact candidate A23 passed all nine HITL assertions: initial side effect,
      duplicate-reject suppression, one bounded rework effect, feedback propagation,
      retry-budget exhaustion, completion after approval, terminal cancellation, and
      lifecycle cleanup without fixture residue.
    root_cause: >-
      Reject correctly maps to rework and re-gating, but the approval command returns
      the rework transition before the phase failure/retry budget is applied. Every
      rejection can therefore create another approval and another model-funded cycle.
    failing_test: >-
      Four consecutive rejects on a phase declaring max_retries 2 all returned 202,
      reran the phase, and reopened a fresh gate. A separate isolated reject followed
      by approve completed, proving the intended rework semantics themselves work.
    proving_test: >-
      Count reject-triggered rework against the configured budget, persist every actor,
      comment, and decision, and surface an explicit terminal cancel/escalate choice at
      exhaustion. Prove duplicate reject delivery is idempotent and already committed
      external effects are not repeated; one reject then approve must still complete.
    source_evidence_2026_08_13: >-
      Human rejection now consumes the same phase_retry_counts budget declared by
      on_failure.max_retries instead of bypassing retry policy. Each gate publishes its
      current retry ordinal and maximum; after exhaustion its allowed actions become
      approve/abort, another reject is denied before resume, and the React review
      workspace replaces Reject with an explicit Cancel run action. The hub also
      defensively refuses an over-budget stale rejection, while durable approval
      history records the resulting retry ordinal alongside the existing approval id,
      actor, action, and comment. Existing approval-id, transaction, idempotency, and
      resume fencing continue to provide first-decision-wins/effect deduplication.
      Docker verification passes 92 focused approval/hub tests and 25 job review/action
      component tests. Keep in_progress until the packaged A23 scenario proves reject
      then approve, exact exhaustion, duplicate/racing decisions, cancel, and unchanged
      effect deduplication on one immutable candidate.

