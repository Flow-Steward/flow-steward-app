      Measured on packaged candidates either side of the fix, with the same
      database. Before: an enabled, correctly configured sftp connection for
      flowsteward.file-transfer exists and the integration store returns it,
      while GET /api/workflows/meta/connector-catalog reports
      "connections": [] for that connector and for all 19 rows — zero
      connections attached anywhere. After: the same request attaches
