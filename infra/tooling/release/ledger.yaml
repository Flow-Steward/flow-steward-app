    packaged_evidence: *final_candidate_packaged
    cleanup_evidence: *final_candidate_cleanup
    root_cause: >-
      Lifecycle execution applies selected descendants before deciding whether the
      container root can be deleted. A partial selection can therefore return 200 after
      deleting a child link, while the next plan still carries that link and the next
      execution treats its absence as a 404 instead of an idempotent/stale condition.
    failing_test: >-
      Executing a project hard-delete plan with only its selected root returned 200
      status=updated, left the project in trash, and removed a workflow link. The next
      public plan/execute failed project workflow link not found. Restore-all followed
      by a fresh full-selection hard delete succeeded.
    proving_test: >-
      Reject invalid root-only/partial selections before any mutation or make the
      resulting state fully retryable. Add a real PostgreSQL test with a failure after
      the first selected child and require total rollback or a typed stale-plan result;
      a fresh plan must never fail because an already-applied child is assumed present.
    runtime_evidence: >-
      Historical A27 proves relational/artifact atomicity only. It did not exercise
      active-job fencing or product-owned RabbitMQ queue removal, so new exact-candidate
      evidence is required for the reopened branch.
    source_evidence_2026_08_14: >-
      Commit b43073f rejects any selected project/workspace hard-delete root whose
      selectable descendants are incomplete before mutation, preserves child-only
      partial deletes, and makes already-deleted workflow/dataset/connection children
      idempotent or typed stale instead of not-found. Focused unit cases passed 3/3;
      five real disposable-PostgreSQL cases prove zero mutation, rollback after the
      first child, fresh retry, idempotent replan, and full populated delete. Final
      A27 supplies the exact-candidate public lifecycle replay twice.
    regression_evidence_2026_08_15: >-
      Reopened for the active-job/queue branch. Public project hard delete calls
      delete_job(..., allow_active=True) without fencing or settling the worker and
      performs no RabbitMQ queue deletion. Live cleanup produced missing-job,
      missing-project execution-slot FK, and already-terminal worker errors; the
      generic consumer nacked those exceptions with requeue. After the audit project
      was successfully hard-deleted, both its durable project and dead-letter queues
      still existed. Immediately before manual audit cleanup the broker held 38 primary
      project queues plus 38 dead-letter queues while PostgreSQL contained one project.
      Cleanup removed only the two audit-owned queue pairs; final inventory still held
      36 primary plus 36 dead-letter project queues for that one live project. The smoke
      helper's private rabbitmqctl purge masks this product leak.
      Hard delete must reject while work is active or atomically cancel/fence and await
      settlement, then remove the exact project queues after commit. Missing/terminal
      messages must ack or dead-letter rather than requeue forever. Add live tests for
      queued, claimed, terminal, and already-missing jobs plus restart recovery.
    source_evidence_2026_08_15: >-
      Failing-first Docker regression proved project purge deleted an in_progress job
