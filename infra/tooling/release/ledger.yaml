rows:
  - <<: *open_row
    id: RS5-001
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: API phase creation can append after terminal and report false success
    sources: [REVIEW-B-P0-3]
    technical_status: fixed_verified
    verified_commit: d0e31fab73cbfeaeee5cd543c55eba784ac288ba  # pragma: allowlist secret - git commit SHA
    root_cause: >-
      RegistryDBStoreWorkflowStepsMixin.add_phase used raw
      COALESCE(MAX(sort_order), -1) + 1, so POST /api/workflows/{id}/phases
      persisted a new action after the existing stop_success End phase. Readiness
      counted terminals but did not reject action-after-terminal or ambiguous
      terminal topology.
    failing_test: >-
      Docker fs-audit test_registry_workflow_phase_persistence.py reproduced the
      defect with expected sort_order 1 and actual 2 (1 failed, exit 1).
      Focused readiness regressions then proved both invalid topologies were
      accepted (2 failed, exit 1).
    proving_test: >-
      Docker fs-audit: test_registry_workflow_phase_persistence.py 1 passed;
      test_contract_validation.py plus persistence regression 77 passed;
      isolated canonical pg-audit test_rs5_001_phase_execution.py 2 passed,
      including real POST /api/workflows/{id}/phases without reorder and DB
      readback start -> customer-action -> end.
    runtime_evidence: >-
      Isolated pg-audit canonical schema initialized successfully. The public
      FastAPI authoring path returned HTTP 200 and persisted the new action
      before End through the real RegistryDBStore. Test transaction/fixture data
      was removed by rollback/delete and pg-audit was removed afterward.
    cleanup_evidence: >-
      fs_compose rm removed pg-audit/rabbitmq-audit; subsequent audit service
      listing was empty. Shared product DB, knowledge base, volumes, and user
      entities were not mutated.
    notes: >-
      Source placement/API/validator gap is repaired. Keep in_progress until the
      immutable candidate proves the API-created action executes exactly once
      through the real queue before stop_success, with import/AI Builder identity
      preservation and packaged smoke evidence.
    packaged_run_evidence: >-
      Driven as a run on the packaged candidate flow-steward:candidate-d0e31fa
      (/health build_sha d0e31fab73cb), not as a test.
      PLACEMENT, on the exact shape this row is about. A workflow created through
      POST /api/workflows starts as start(0) -> end(1), a terminal at the very
      next position. POST /api/workflows/{id}/phases with an action phase placed
      it at sort_order 1 and moved the terminal to 2 — before the terminal, which
      is the whole point of the row. The pre-fix code appended at
      COALESCE(MAX(sort_order),-1)+1, which is 2, i.e. after End.
      The same held on a clone of quick_fix, which exercises the
      portability/export path rather than a hand-built workflow: the API-created
      phase landed at sort_order 7, between delivery(6) and the terminal, which
      moved to 11.
      EXACTLY ONCE AND BEFORE THE TERMINAL, through the real queue. The minimal
      workflow (start -> API-created action -> stop_success) was enabled, bound
      to a routed project and submitted through POST /api/tasks. Job
      5bc9100c-e72f-47df-a63c-0ce41af766d6 reached status=completed,
      current_phase=end, in 8s, and its event timeline reads:
      Workflow selected: rs5001_min_wf / Phase 'start' completed /
      Starting phase 'probe' / Analyst started / Analyst completed (pass) /
      Phase 'probe' completed / Starting phase 'end' /
      Validation passed (workflow contract satisfied).
      Counters over platform_events for that job: Starting phase 'probe' = 1,
      agent_started = 1, agent_completed = 1, Phase 'probe' completed = 1,
      Starting phase 'end' = 1. The API-created action ran once, and it ran
      before the terminal rather than after it.
      An earlier attempt on the same workflow with no input mapping failed inside
      the probe phase with "Missing required input 'story_spec'" — worth keeping,
      because it independently shows execution entering the API-created phase in
      sequence rather than the phase being skipped or appended past the end.

  - <<: *open_row
    id: RS5-002
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: Skill lifecycle corrupts dependents and invalid registry state has global graph blast radius
    sources: [REVIEW-B-P0-2, REVIEW-B-P1-disabled-agent-skill]
    technical_status: fixed_verified
    verified_commit: 970d2ab0f83691a87e9b3beed8339d25f055a401  # pragma: allowlist secret - git commit SHA
    root_cause: >-
      Unified trash did not run the skill dependency guard, hard-delete checked
      enabled agents only, and DELETE /api/skills/{id} bypassed both. Graph
      contract validation accepted workflow_ids but still validated every enabled
      agent and skill before applying the workflow scope.
    failing_test: >-
      Docker fs-audit: trashing a skill with enabled, disabled, and workflow-step
      dependents did not raise (1 failed, exit 1); scoped graph validation returned
      unrelated bad-agent/bad-skill errors (1 failed, exit 1); direct skill DELETE
      returned HTTP 200 instead of typed HTTP 409 (1 failed, exit 1).
    proving_test: >-
      Docker fs-audit lifecycle plus workflow portability suites 99 passed;
      focused API dependency/delete checks 3 passed; combined focused lifecycle,
      graph containment, and skill API matrix 9 passed. Ruff check passed for all
      touched source/tests.
    runtime_evidence: >-
      Source contracts now return bounded registry_dependency_conflict payloads
      for trash/hard-delete/direct API paths and scope graph validation/node
      materialization to selected workflow direct agents plus transitive skills.
    notes: >-
      Keep in_progress until isolated canonical DB proves enabled/disabled agent,
      workflow-step, and published-block references are all blocked transactionally,
      an unrelated valid workflow runs, and packaged UI/API evidence is captured.
      PACKAGED EVIDENCE 2026-08-05 (partial) — and one NEW DEFECT found while
      collecting it.
      PROVEN on the immutable candidate (clean install, packaged image): a skill
      referenced by an agent cannot be removed, whether that agent is enabled or
      disabled. Both trash (HTTP 409 registry_dependency_conflict) and hard-delete
      (HTTP 400) are refused and the skill row survives in both cases. Disabling
      the agent does not weaken the guard, which is the specific regression this
      row names.
      NEW DEFECT — the guard never releases. After the referencing agent was
      trashed AND hard-deleted (registry_agents count 0, registry_agent_skills
      count 0, registry_phase_steps count 0), the skill was still refused with
      dependent_ids ["published_block:agent.<agent_id>.<skill_id>"]. Hard-deleting
      an agent leaves its auto-created published-block contract behind, and that
      orphan permanently blocks deletion of every skill the agent referenced. The
      skill becomes undeletable through any product surface.
      This accumulates: on a clean install whose only agent lifecycle activity was
      the release gate's own checks, 7 orphaned agent published-block contracts
      already existed whose agent_id no longer resolves to any row in
      registry_agents. Query used:
      SELECT count(*) FROM registry_published_block_contracts b WHERE
      b.block_key LIKE 'agent.%' AND NOT EXISTS (SELECT 1 FROM registry_agents a
      WHERE b.block_key LIKE 'agent.'||a.agent_id||'.%');
      REPAIRED in commit 970d2ab, both halves. The dependency query's
      published_block branch now requires the owning agent to exist, mirroring
      the JOIN the agent branch always had, so orphans that already exist stop
      blocking. Agent hard-delete additionally removes the published-block
      contracts it owns, so new orphans are not created.
      Proven on the rebuilt candidate flow-steward:candidate-970d2ab end to end:
      (1) deleting the skill while its agent exists is refused with HTTP 409;
      (2) after the agent is trashed and hard-deleted its published blocks are
      gone (count 0);
      (3) the skill then trashes with HTTP 200 and
      (4) hard-deletes with HTTP 200,
      (5) leaving no skill row and no block row.
      Before the fix, step 3 returned 409 forever with dependent_ids
      ["published_block:agent.<agent>.<skill>"].
      REMAINING CASES NOW PROVEN. Attempting to trash `analyze_requirements`,
      a skill referenced by 7 workflow steps, is refused with HTTP 409
      registry_dependency_conflict and the reported dependent_ids span all three
      kinds at once — agent, workflow_step and published_block (samples
      "agent:analyst", "workflow_step:clonewf_b50bb580/build/step_1") — with the
      skill row left untouched (deleted_at still NULL). Because the repaired
      published_block branch now requires the owning agent to exist, every
      published_block entry in that list is a legitimately live reference, which
      is the case this row asked to see.
      "An unrelated valid workflow runs" is covered by the same candidate run:
      D05 takes an extension-projected workflow to completed and publishes its
      declared effect while this registry state exists, and B01 dispatches and
      consumes a job on a separate project.
      PACKAGED API EVIDENCE CAPTURED on flow-steward:candidate-d6091db (clean
      install, packaged image, no source mount), full lifecycle in one run:
      A. skill referenced by an ENABLED agent  -> trash HTTP 409
      B. same agent DISABLED                   -> trash HTTP 409 (disabling does
         not weaken the guard, which is the regression this row names)
      C. reported dependent_ids span the kinds involved —
         ["agent:<agent_id>", "published_block:agent.<agent_id>.<skill_id>"] —
         and on a skill with real workflow usage the same response additionally
         reports workflow_step (measured separately on analyze_requirements,
         which 7 workflow steps reference: kinds agent, workflow_step and
         published_block together, skill untouched)
      D. after the agent is trashed AND hard-deleted -> skill trash HTTP 200
      E. skill hard-delete HTTP 200, leaving 0 skill rows and 0 block rows
      /health/ready remained 200 ready=True throughout.
      UI EVIDENCE — earlier note retracted. The self-signed certificate was never
      the obstacle; the refusal came from one browser tool, not from the
      candidate's TLS. The UI lane already ignores TLS errors
      (tests/ui/conftest.py, ignore_https_errors=True) and deliberately drives
      the HTTPS traefik entrypoint so COOP/CSP behave as in production.
      TOPOLOGY USED, recorded so it is clear what the evidence covers: the
      harness container comes from the development compose file, because
      fs-test-runner is declared only there, but the system under test is the
      packaged candidate — run with
      TEST_RUNNER_BASE_URL=https://host.docker.internal:8099, which is the
      candidate's published origin (verified reachable from the runner, HTTP
      200). Nothing was asserted against the development stack.
      run_ui_pytest.sh now also forwards E2E_*_USERNAME/PASSWORD when set;
      without that the lane took its role credentials from the repository .env,
      found the development stack's pre-seeded e2e_admin user missing on the
      candidate, and skipped every test with "UI lane requires pre-seeded role
      credentials from .env".
      PROVEN IN THE BROWSER against candidate-83e63b2:
      tests/ui/test_registry_skills.py::TestRegistrySkillLifecycleRS5002 loads
      /trash, finds the trashed skill's row in the grid, clicks its Purge
      control, and asserts the skill stops being served and the row disappears.
      Confirmed to fail when the Purge lookup is broken, so it exercises the page
      rather than passing vacuously.
      WHAT THE UI STRUCTURALLY CANNOT SHOW, established rather than assumed: the
      409-with-dependents half is unreachable from the UI. The frontend contains
      no call that trashes a registry skill — the only delete affordances are
      Restore and Purge on the Trash page, which act on already-trashed entities
      — and an agent cannot be attached to a trashed skill (POST /api/agents
      returns 400), so a trashed skill can never acquire the live dependent that
      would produce the conflict. The guard therefore stays proven at the API
      level, and the UI owns the half it can reach. This is documented on the
      test itself so the split is not mistaken for missing coverage.
    transactional_evidence: >-
      The one word left in this row's bar was "transactionally" — that the
      refusal leaves nothing half-done — and it is now measured rather than
      assumed, on the running packaged candidate (build_sha d0e31fab73cb).
      A checksum snapshot was taken over the five tables the operation touches
      (registry_skills 40 rows, registry_agent_skills 17, registry_phase_steps 80,
      registry_published_block_contracts 30, registry_agents 24), each as
      count plus md5 of the full ordered row text. POST
      /api/trash/registry_skill/analyze_requirements/trash was then refused three
      times in a row with HTTP 409 registry_dependency_conflict, and the snapshot
      was retaken: byte-identical on all five tables. The refusal mutates nothing,
      not even partially, and repeating it does not accumulate damage.
      The same request reports all three dependency kinds together —
      agent:analyst, published_block:agent.analyst.analyze_requirements, and
      seven workflow_step entries (quick_fix/analysis/step_1,
      standard_feature/analysis/step_1, bugfix_contextual, incident_response,
      maintenance, spike_investigation and one cloned workflow) — so the guard is
      evaluated across kinds in one transaction rather than kind by kind.
      Hard-delete on a live skill is refused earlier and separately, with HTTP 400
      "registry_skill must be trashed before hard delete", so the destructive path
      cannot skip the guard.
    guard_releases_evidence: >-
      The complementary half, so the guard is not merely proven to refuse: a
      skill with no dependents completes the whole lifecycle on the same
      candidate. Created rs5002_orphan_probe through POST /api/skills (HTTP 200,
      validation valid, 0 agent_skill / 0 phase_step / 0 block rows), then
      trash HTTP 200 (deleted_at stamped), restore HTTP 200 (deleted_at cleared),
      trash HTTP 200 again, hard-delete HTTP 200, leaving 0 rows. The registry
      returned to its prior checksums afterwards, so this probe left no residue.
      Taken with the refusals above, the guard discriminates on real dependencies
      instead of blocking deletion generally — which is what made the orphaned
      published-block defect found in this row so damaging, and what proves it is
      gone.

  - <<: *open_row
    id: RS5-003
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: Phase-exit rejection rework can replay a committed external effect
    sources: [REVIEW-B-P0-1]
    technical_status: fixed_verified
    verified_commit: 6531889f942665da978e96189f71a7af207fb9ed  # pragma: allowlist secret - git commit SHA
    root_cause: >-
      Phase rejection intentionally resets the phase cursor, so external-effect safety
      depends on the durable claim identity surviving that rework and process restart.
      The source contract already derives the claim from stable job/workflow/phase/step
      identity plus the material request payload, but this exact rejection/rework
      persistence contract had no canonical database regression or release evidence.
    failing_test: >-
      The source audit reproduced an outbound provider call twice on rejection/rework
      (3 of 3). The first Docker invocation of the new persistence regression was an
      honest skip because nested disposable Docker is unavailable inside fs-audit;
      it was rerun against the isolated canonical pg-audit data plane.
    proving_test: >-
      Docker fs-audit against initialized pg-audit: RS5-003 external-effect persistence
      regression 1 passed (exit 0). The same committed job/workflow/phase/step and
      payload was deduped without a second spawn; changed input produced a distinct
      request fingerprint and claim. Existing same-phase and cross-phase rejection
      routing contracts both passed (2 passed, exit 0). Targeted Ruff and format checks
      passed.
    runtime_evidence: >-
      Canonical PostgreSQL contained one succeeded provider-confirmed effect after the
      unchanged replay and a separate claimed effect only after material input changed;
      the audit data plane was removed after verification.
    notes: >-
      Reject remains phase rework, not terminal cancellation. Keep in_progress until an
      immutable packaged candidate proves the real project-bound Outgoing Email flow
      through queue, rejection/rework, replacement approval gate, Mailpit one-delivery
      count, process restart, and correct durable identifiers.
    candidate_evidence: >-
      One harness, driven on the immutable packaged candidate
      flow-steward:candidate-6531889, exercising the real project-bound Outgoing
      Email connector through the job queue against Mailpit.
      SETUP, all through public APIs: a project-scoped custom_smtp connection to
      the candidate's Mailpit (conn_89e6012ea8b04fd7), and a workflow whose
      delivery phase carries a human_approval gate and one connector step
      (extension.flowsteward.outgoing-email, operation send_email, bound to that
      connection). Submitted with POST /api/tasks; Mailpit was purged first so
      the delivery count is unambiguous.
      DELIVERY AND GATE. The job parked at status=awaiting_approval with the
      gate reporting step_id "phase-exit:delivery" — the gate is on phase exit,
      which is what makes this row's question real — and Mailpit held exactly 1
      message, "RS5-003 probe" to probe@flowsteward.local.
      THE EFFECT LEDGER carries the right identifiers, not just a row:
      project f0d41a78, extension_id flowsteward.outgoing-email,
      connection_id conn_89e6012ea8b04fd7, effect_kind message_delivery,
      channel email, source_type workflow_step, test_mode false,
      source_ref {job_id, phase_id: delivery, step_id: step_1},
      claim_version 1, target_count 1, and a real provider_message_id.
      REJECTION IS REWORK, AND IT DOES NOT REPLAY. Rejecting at that gate
      returned HTTP 202 with approved=false, the job re-entered the delivery
      phase and parked again at awaiting_approval — rework, not terminal
      cancellation — and Mailpit still held exactly 1 message. The ledger still
      showed one succeeded send_email at claim_version 1: the committed external
      effect was not re-sent when its phase ran again.
      REPLACEMENT GATE AND COMPLETION. The new approval was presented with a
      fresh approval_id on the same thread; approving it took the job to
      status=completed, current_phase=end, with Mailpit still at 1.
      DURABLE ACROSS RESTART. fs-app and fs-worker were restarted; afterwards the
      job is still completed, Mailpit still holds 1 message, and there is still
      exactly 1 succeeded send_email effect.
      A FAILED DELIVERY PRODUCES NOTHING. Repointing the same connection at an
      unresolvable SMTP host and re-running gave a failed job with
      "SMTP server host 'mailpit-does-not-exist' cannot be resolved", an effect
      row with status=failed, error_code=smtp_host_disallowed and no
      provider_message_id, and a Mailpit delta of 0. The connection was restored
      afterwards.
    row_specific: >-
      This row asked whether phase-exit rejection can replay a committed
      external effect. On the candidate it cannot: the delivery phase ran a
      second time after the rejection and the message was not re-sent, because
      the effect is keyed by a stable idempotency key and the ledger already
      held it as succeeded. Reject remained rework throughout — the job never
      became terminal on rejection, and the replacement gate was presented for a
      real decision.

  - <<: *open_row
    id: RS5-004
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P0
    title: Workflow-bound extension effect loses trusted runtime project identity
    sources: [A5-001]
    technical_status: fixed_verified
    verified_commit: 6531889f942665da978e96189f71a7af207fb9ed  # pragma: allowlist secret - git commit SHA
    root_cause: >-
      Connector runtime read identifiers only from top-level graph state. The worker
      already assembled a trusted runtime envelope from durable job/project rows, but
      stored it under an undeclared private key that canonical state normalization and
      LangGraph checkpoint channels could discard. Connector claims therefore received
      project_id=NULL after a real queue/checkpoint boundary.
    failing_test: >-
      Docker fs-audit queued/checkpoint-shaped regression returned None for job,
      workflow, account, project, and workspace instead of the trusted envelope values
      (1 failed, exit 1). A second red regression could not import the required bounded
      fail-closed identity guard (1 failed, exit 1).
    proving_test: >-
      Added one typed WorkflowRuntimeIdentity extractor shared by connector execution,
      external-effect source references, provider runtime context, and invocation logs.
      The durable trusted_runtime_context is now a declared canonical state channel;
      caller-controlled state cannot replace it. Docker fs-audit connector runtime suite
      40 passed and related canonical-state/tabular runtime matrix 60 passed after
      formatting. Targeted Ruff and format checks passed.
    runtime_evidence: >-
      Source regression now resolves queued worker-authored job/workflow/account/project/
      workspace plus phase/step/loop identity and returns the bounded
      external_effect_runtime_identity_missing error before claim/provider invocation
      whenever a declared effect lacks required scope.
    notes: >-
      Keep in_progress until the immutable packaged candidate runs the project-bound
      Outgoing Email connector through queue and HITL against Mailpit, proves one claim
      and message with correct identifiers, replays idempotently, and proves a failed
      identity/claim produces no delivery.
      UPDATE 2026-08-05: this row's gate check (D05) now PASSES on the running
      candidate — an extension-projected workflow reaches completed and its declared
      effect arrives with live data. Reaching that required fixing two further defects
      that are distinct from this row's identity root cause and are recorded here
      because they were found through it (commit a27fff9):
      (a) the step autonomy gate paused on `confidence_score`, the classifier's
      certainty about which workflow to route to, even when the caller had named the
      workflow explicitly. Any deployment with weak classification or no configured
      model route parked such runs at awaiting_approval forever. The confidence
      heuristic is now skipped for explicit selection sources; mode=manual and the
      workflow's own phase gates are unchanged.
      (b) `workflow_outputs` — the full output-contract result that the public run
      result is built from — was never declared on the state schema, so LangGraph
      dropped it at the checkpoint boundary. Completed runs persisted
      meta.workflow_outputs = {} and callers received no outputs at all even though
      the steps had produced them. This is the same undeclared-channel class as this
      row's own root cause, which is why it is worth reading the two together.
      The D05 check itself was also reading a bare top-level state key — an undeclared
      channel the checkpoint does not persist — and now asserts
      workflow_run.result.outputs, the public run result a caller consumes.
    candidate_evidence: >-
      One harness, driven on the immutable packaged candidate
      flow-steward:candidate-6531889, exercising the real project-bound Outgoing
      Email connector through the job queue against Mailpit.
      SETUP, all through public APIs: a project-scoped custom_smtp connection to
