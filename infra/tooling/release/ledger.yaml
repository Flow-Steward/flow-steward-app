  - <<: *open_row
    id: RS5-092
    severity: P2
    title: Stop invalid SAVEPOINT statements in worker action-log persistence
    sources: [CRA21-ACTION-LOG-SAVEPOINT-NOISE]
    technical_status: fixed_verified
    review_status: accepted
    reviewer: agent-release-audit-2026-08-22
    verified_commit: 619e38cd89d4a2c23470123381f0cc39d113acd1  # pragma: allowlist secret - git commit SHA
    packaged_verified_commit: 619e38cd89d4a2c23470123381f0cc39d113acd1  # pragma: allowlist secret - git commit SHA
    root_cause: >-
      log_action attempts SAVEPOINT whenever job_id is present without first checking
      whether the psycopg connection is inside a transaction. Worker calls commonly use
      an autocommit/idle connection, so PostgreSQL rejects the savepoint; the exception is
      swallowed and the insert is retried without transactional protection.
    failing_test: >-
      Candidate PostgreSQL logged 582 "SAVEPOINT can only be used in transaction blocks"
      errors during the 30-minute audit window, all from
      SAVEPOINT platform_action_log_guard on the worker connection. Jobs and cost rows
      were still present, so this is not current data loss, but it creates persistent DB
      ERROR noise and masks genuine persistence incidents.
    proving_test: >-
      Branch on psycopg transaction status: use a savepoint only inside an active caller-
      owned transaction and perform the normal insert directly for idle/autocommit
      connections. Exercise real worker success, failure, retry, cancellation, and deleted
      job-reference cases. Require the expected action/cost rows and zero PostgreSQL
      transaction-state ERRORs in a bounded candidate log window.
    source_evidence: >-
      A failing-first idle-connection regression proved the invalid SAVEPOINT. log_action
      now creates its guard savepoint only for psycopg INTRANS connections and inserts
      directly for idle/autocommit/unknown states while retaining active-transaction FK
      recovery. The focused Docker action-log suite passed 7/7.
    runtime_evidence: >-
      Candidate worker success, failure, retry, cancellation, approval, and deleted-project
      lifecycle scenarios persisted their expected logs in both complete profiles. Neither
      bounded candidate log window contained invalid SAVEPOINT or PostgreSQL transaction-
      state errors.
    packaged_evidence: >-
      The transaction-status-aware action-log adapter is packaged in exact candidate
      619e38cd, which passed full, audit, and both 72/72 release profiles.
    cleanup_evidence: >-
      Action-log fixtures and their projects/jobs were removed; all residue counters were
      zero after both profiles and four-service log scans were clean.
    notes: >-
      Non-blocking for release if the P0/P1 set is closed, but should remain visible as a
      core observability and database-load defect.

