  - <<: *open_row
    id: RS5-024
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P2
    title: MCP wrong-scope business errors can be transport-success results
    sources: [A5-013]
    technical_status: fixed_verified
    verified_commit: fa7e6fe
    root_cause: >-
      MCP tools return their typed envelope as a normal string return value, and
      the SDK marks any normal return isError=false. An authorization refusal
      therefore arrived as a transport success carrying
      {"ok": false, "error": {"code": "forbidden"}}, while an unknown tool
      correctly returned isError=true. A client that trusts MCP error semantics —
      which the protocol invites — read the refusal as success.
    failing_test: >-
      tests/unit/test_mcp_error_envelope_semantics.py — six of its eight cases
      fail against the previous code, including that a refusal must raise and
      that non-authorization failures must not.
    proving_test: >-
      The same file pins all three shapes: a refusal raises with the typed
      envelope intact; other business failures still return theirs; a success is
      unchanged. Six existing tests across four files pinned the old shape and
      were updated to the corrected one, keeping every assertion they made about
      code, message and the tool body not running. Four of those were only found
      by running the whole unit suite — see RS5-039.
    packaged_evidence: >-
      Measured either side of the fix on packaged candidates with the same
      credential, a worker token that lacks jobs.read.
      BEFORE (candidate-0b604fc): tools/call job_status returned isError=false
      with ok=false and code=forbidden inside the result body.
      AFTER (candidate-fa7e6fe): the same call returns isError=true, and a
      correctly scoped project_list still returns isError=false with ok=true, so
      the success path is untouched.
    contract_change: >-
      Recorded rather than glossed, because it changes what a client parses. The
      SDK wraps any raised exception as
      ToolError(f"Error executing tool {name}: {e}"), so on a refusal the text of
      content[0] is no longer pure JSON — it is the literal prefix
      "Error executing tool <tool>: " followed by the envelope. The envelope is
      intact and recoverable, and isError=true is now correct, but a client that
      blindly json.loads(content[0].text) on a refusal must strip that prefix.
      The trade is deliberate: the risk this row names is a refusal being
      indistinguishable from success, and isError is the field that settles it.
    notes: >-
      Scoped to authorization on purpose. Every other business failure already
      carries a typed code a client can act on; only a refusal is dangerous when
      it reads as success, so those keep returning their envelope unchanged.
      An existing contract test already modelled a denial as isError=true with
      the typed envelope, so the server now matches intent that was already
      written down. That test constructs its own response and so does not
      exercise the SDK prefix; pinning the shipped text shape needs a test at the
      integration layer and is not done here.

