      terminal settlement, successful hard delete, and product-owned removal of the
      exact queue/dead-letter pair; the smoke fail-safe purge runs only after recording
      a failed product assertion. A bounded maintenance command inventories project
      UUID queue pairs with message/consumer counts, cross-checks PostgreSQL, plans only
      complete absent-project pairs at zero depth, requires an explicit destructive
