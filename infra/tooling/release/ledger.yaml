      now correctly shared by write and runtime paths, the false positive also breaks
      valid queries persisted before the upgrade.
    failing_test: >-
      Direct execution inside the exact c4c7760a5173 app image rejected
      "select count(*)::int as job_count from jobs limit 1" with
      saved_query_definition_invalid at params_schema_jsonb.properties.int. The same
      contract accepted the no-cast control and an explicitly declared :job_id
      parameter. Claude independently proved an already-persisted cast query fails its
      next dataset_query workflow run and cannot be repaired through the public writer.
    proving_test: >-
      Make placeholder tokenization distinguish a single-colon named parameter from all
      PostgreSQL cast colons without rewriting SQL. Cover ::int, ::text, chained casts,
      schema-qualified/array cast types, comments and quoted literals containing colons,
      and legitimate declared/undeclared :name parameters. Prove public create, update,
      validate, preview, and dataset_query execution accept valid cast SQL, and prove a
      pre-upgrade persisted cast query executes after upgrade.
    source_evidence: >-
      The saved-query scanner now distinguishes single-colon named parameters from
      PostgreSQL double-colon casts after literal/comment sanitization, including chained,
      schema-qualified and array casts plus quoted identifier colons. Named-parameter
      enforcement remains intact. Focused authoring/runtime regressions passed 75/75.
    runtime_evidence: >-
      Candidate saved-query authoring and dataset execution controls accepted PostgreSQL
      scalar, chained, schema-qualified, and array casts, preserved declared parameter
      binding, rejected undeclared single-colon parameters, and executed the pre-upgrade
      cast fixture in both release profiles.
    packaged_evidence: >-
      The lexical scanner and shared authoring/runtime contract are packaged in immutable
      app a8338c13b22c; exact-candidate full, audit, and two 72/72 profiles passed.
    cleanup_evidence: >-
      Query templates, connections, datasets, projects, jobs, and queues were removed;
      both release runs reported zero residue and clean bounded logs.
    notes: >-
      Release blocker because the regression converts previously working customer
