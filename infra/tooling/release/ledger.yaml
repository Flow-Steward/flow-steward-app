  - <<: *open_row
    id: RS5-014
    review_status: accepted
    reviewer: agent-release-audit-2026-08-25
    severity: P1
    title: Data Connection UI and API accept missing required primary fields
    sources: [A5-005]
    partial_fix_commit: fe511ee
    root_cause: >-
      Two separate causes, and only one of them is in the platform.
      UI (fixed): handleCreate validated connectionFieldGroups.advanced only,
      and createBlocked checked neither group, so the form enabled Create and
      submitted with required primary connector fields empty. Both groups carry
      the same `required` flag from the connector schema; one was simply never
      read.
      CONNECTOR SCHEMA (open): flowsteward.toolbox-dataset-connector declares
      connection_schema.required = ["prebuilt"] and nothing else, while its 16
      catalog variants each preset prebuilt themselves. So for a PostgreSQL or
      AlloyDB connection the schema declares no required field that the operator
      has to supply, and neither the form nor the API can reject a connection
      with no host, port, user or database without inventing per-dialect rules.
    failing_test: >-
      Packaged candidate-e54ec18 accepted POST with only
      {"prebuilt":"postgres"} as HTTP 200 and persisted a connection with no
      host, database, or user. The corresponding browser form left Create
      enabled with those connector-required fields blank.
    proving_test: >-
      assets/frontend/src/pages/registry/data-connections/
      data-connection-helpers.test.ts now pins that required fields land in both
      groups and that the password stays on the primary group, so a validator
      reading both reaches all of them. Frontend typecheck and vitest pass, and
      the fast gate passes.
    packaged_evidence: >-
      Measured on packaged candidates.
      API, before any change (candidate-e54ec18): an empty connection_config_jsonb
      is correctly refused with "connection_config_jsonb.prebuilt: required
      property is missing", and a blank value with "value '' is not in enum
      [...]". So the API does independently enforce what the schema declares.
      But POST with {"prebuilt": "postgres"} alone returns HTTP 200 and creates
      conn_rs5-014_unusable_probe whose stored config is exactly
      {"prebuilt": "postgres"} — no host, no port, no user, no database. The
      probe connection was deleted afterwards.
      UI, on the fixed image (candidate-fe511ee): the create form opens, a
      workspace and the AlloyDB Omni connector are selected, the name
      auto-populates, and Create remains enabled with the connection fields
      blank — because, per the schema, nothing else is required. The button state
      is now derived from the required fields rather than ignoring them; there
      are simply none to miss for this connector.
    notes: >-
      Deliberately not closed. The half this epic owns is fixed and the fix is
      the right one, but the row's headline stays true on a real deployment, and
      closing it on the UI change alone would overclaim.
      The remaining work belongs to the connector: connection_schema needs
      per-dialect requirements (an allOf/if-then on prebuilt, or a required list
      per catalog variant) so that "a PostgreSQL connection needs a host" is
      declared rather than assumed. Once declared, both the existing API
      validation and the repaired form enforce it with no further platform
      change — which is why guessing those fields here, across 16 dialects,
      would have been the wrong move.
    technical_status: fixed_verified
    verified_commit: 9859cb9
    scope_decision: >-
      Full scope approved by the owner, with the constraint that database
      knowledge must not enter Python: this connector is the worked example
      third-party extension authors copy, so requirements are declared in JSON.
    layer_1_loud_refusal: >-
      The validator was a hand-written subset that silently skipped every
      keyword it did not recognise, so a schema declaring allOf/if/then was
      decoration and its author had no way to find out. Unknown keywords are now
      refused at install-time contract validation.
      Annotations stay allowed. `format` is among them deliberately: JSON Schema
      itself defines it as annotation-only unless a format-assertion vocabulary
      is enabled, so permitting it without executing it is what the
      specification says rather than a loophole. The keyword inventory was taken
      from the shipped schemas rather than assumed, and a parametrised test
      asserts every shipped schema is fully executable, so this cannot regress
      into a silent skip again.
    layer_2_execution: >-
      oneOf/anyOf, allOf + if/then/else and dependentRequired are now executed.
      That immediately made a shipped declaration real: the oneOf in
      flowsteward_outgoing_email's subscriptions schema had never run, and
      `to: 42` was accepted. It is now rejected, and both declared shapes still
      pass.
      When alternatives all fail, the reported branch is chosen by matching the
      value's actual type rather than by fewest errors — for a list against
      `string | array of string` the fewest-errors rule picked the string branch
      and said nothing useful.
    declaration: >-
      The sixteen prebuilts are declared as five shapes: host-addressed
      (host, database, user); Google Cloud managed (project, region, instance,
      database, user); AlloyDB for PostgreSQL, which adds cluster; Snowflake
      (account, user, database); Spanner (project, instance, database); and
      SQLite (database). Port, query_params, protocol, ip_type, schema,
      warehouse, role and dialect stay optional, and no password is required —
      Cloud SQL and AlloyDB authenticate through IAM.
    the_trap_that_cost_a_build: >-
      The first packaged candidate still accepted a bare PostgreSQL connection
      even though the schema file carried the rules. The connector declares
      connection_schema TWICE — in schemas/config.schema.yaml and inline in
      extension.yaml — and the platform serves and validates against the inline
      copy. A rule present only in the file reviews correctly, ships, and never
      runs. Both copies now carry the same branches, and a test requires
      identical missing-field sets across all five shapes so they cannot drift
      apart silently in the direction that looks right.
      Also collapsed: two near-identical copies of the validator itself, in
      extensions.lifecycle_ports and management.command_services_common, which
      had already drifted. Both delegate to one implementation now.
    packaged_evidence: >-
      Measured on packaged candidate-9859cb9, the exact bar.
      API: POST with {"prebuilt": "postgres"} returns 400 naming all three
      missing fields — "connection_config_jsonb.host / .database / .user:
      required property is missing". The same connection fully specified returns
      200. A bare sqlite returns 400 naming only `database` and never a host, so
      the shapes really are distinct rather than one blanket rule.
      FORM: with Postgres selected and the fields blank, Create is disabled, the
      form names the blocking field ("Host is required"), and HOST, DATABASE OR
      DATASET and USER are marked required — none of which was true before.
    notes: >-
      One repair to my own earlier RS5-014 change came out of this: with Create
      disabled while a required field is empty, clicking it explained nothing —
      a dead control with no reason is its own defect. The form now names the
      blocking field and says when it lives under Additional settings. The test
      that covered the old click-to-explain path was updated rather than
      deleted, and it was only found by running the page suite, which my
      touched-areas selection had missed when that change landed.
      Field grouping was left alone on purpose: requiredness and placement are
      independent, and mixing them would have been scope creep.
    gate_fixture_repair: >-
      The smoke gate went 63/0 to 61/2 on this change, and the two failures were
      the right kind: B10 and B11 build their own data connection with
      {"prebuilt": "postgres"} — the exact incomplete config the fix now
      refuses. Their setup stopped succeeding, so they failed without ever
      reaching their subject, which is workspace deletion rather than config
      validation.
      Both fixtures are now fully specified, with a comment saying why, so a
      later tidy-up does not trim them back. The gate is 63/0 again.
      Recorded because a fixture that depended on the defect is the same species
      as a test that pinned it: green while the product was wrong, red when it
      was fixed.

