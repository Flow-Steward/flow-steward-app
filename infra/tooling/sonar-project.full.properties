# Full SonarQube profile (backend + frontend + canonical schema).
# Keeps core production scope broad while avoiding OOM on large test suites.
#
# Every sonar.exclusions / sonar.test.exclusions / sonar.coverage.exclusions /
# sonar.issue.ignore setting in this file is part of the current local
# quality-gate contract. Do not add or modify exclusions casually.
sonar.projectKey=flow-steward-full
sonar.projectName=Flow Steward (Full)
sonar.projectVersion=2026.09.14-r1
sonar.sourceEncoding=UTF-8

sonar.sources=core,assets,db/schema
sonar.tests=tests

sonar.python.version=3.11
sonar.python.file.suffixes=.py
sonar.html.file.suffixes=.html
sonar.css.file.suffixes=.css
sonar.javascript.file.suffixes=.js
sonar.javascript.node.maxspace=4096
sonar.typescript.tsconfigPaths=infra/tooling/tsconfig.sonar-js.json
# Disable JS/TS bundle detection to reduce Node.js bridge memory pressure.
sonar.javascript.detectBundles=false

sonar.python.coverage.reportPaths=logs/quality/sonar/coverage.sonar.xml

sonar.exclusions=.git/**,.venv/**,venv/**,node_modules/**,**/node_modules/**,docs/**,ops/**,neo4j-data/**,assets/frontend/dist/**,assets/frontend/test-results/**,assets/frontend/src/test/**,assets/frontend/src/**/*.test.ts,assets/frontend/src/**/*.test.tsx,assets/frontend/src/**/*.spec.ts,assets/frontend/src/**/*.spec.tsx,assets/vendor/**,**/__pycache__/**,**/*.min.js,**/.DS_Store
sonar.coverage.exclusions=assets/**
# Full profile keeps tests excluded because combined Python+JS analysis in one
# scanner process is unstable on local 8GB Docker setups (scanner OOMKilled).
# Run `./core/entrypoints/cli/scripts/lint.sh --sonar-py` to analyze backend test files.
sonar.test.exclusions=tests/**
# Blame collection in containerized dirty worktrees can fail; keep scan stable.
sonar.scm.disabled=true

# Temporary baseline for existing backend debt (Q-08) and frontend UI
# modernization debt (Q-09):
# - python:S3776 (cognitive complexity)
# - python:S107  (long parameter lists)
# - typescript:S3358 (nested ternary)
# - typescript:S3776 (cognitive complexity)
# - typescript:S7735 (negated conditions)
# - typescript:S6819 (semantic JSX roles)
# - typescript:S2004 (deeply nested functions)
# - typescript:S4624 (nested template literals)
# - typescript:S6772 (ambiguous JSX spacing)
# Deadline for removal: 2026-06-30
sonar.issue.ignore.multicriteria=py_replace_assign_jobs,py_replace_return_jobs,py_replace_assign_webhook,py_replace_return_webhook,py_internal_http_installer,py_complexity,py_arity,ts_nested_ternary,ts_complexity,ts_negated_condition,ts_semantic_roles,ts_nested_functions,ts_nested_templates,ts_jsx_spacing
sonar.issue.ignore.multicriteria.py_complexity.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.py_complexity.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.py_arity.ruleKey=python:S107
sonar.issue.ignore.multicriteria.py_arity.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.ts_nested_ternary.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.ts_nested_ternary.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_complexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.ts_complexity.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_negated_condition.ruleKey=typescript:S7735
sonar.issue.ignore.multicriteria.ts_negated_condition.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_semantic_roles.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.ts_semantic_roles.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_nested_functions.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.ts_nested_functions.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_nested_templates.ruleKey=typescript:S4624
sonar.issue.ignore.multicriteria.ts_nested_templates.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_jsx_spacing.ruleKey=typescript:S6772
sonar.issue.ignore.multicriteria.ts_jsx_spacing.resourceKey=assets/frontend/src/**/*

# Sonar's Python type inference models dataclasses.replace() as returning
# DataclassInstance. It returns the same class -- provable at runtime,
# type(replace(r)) is Req -- so the concrete annotations on these four lines are
# correct and the rule is not. A cast() would silence Sonar and mypy together,
# and mypy is the checker that works here, so the suppression is narrowed to the
# two files instead. AC17 Sonar closure, 2026-09-22.
sonar.issue.ignore.multicriteria.py_replace_assign_jobs.ruleKey=python:S5890
sonar.issue.ignore.multicriteria.py_replace_assign_jobs.resourceKey=core/application/jobs/task_execution_request.py
sonar.issue.ignore.multicriteria.py_replace_return_jobs.ruleKey=python:S5886
sonar.issue.ignore.multicriteria.py_replace_return_jobs.resourceKey=core/application/jobs/task_execution_request.py
sonar.issue.ignore.multicriteria.py_replace_assign_webhook.ruleKey=python:S5890
sonar.issue.ignore.multicriteria.py_replace_assign_webhook.resourceKey=core/application/workflows/workflow_webhook_creation_service.py
sonar.issue.ignore.multicriteria.py_replace_return_webhook.ruleKey=python:S5886
sonar.issue.ignore.multicriteria.py_replace_return_webhook.resourceKey=core/application/workflows/workflow_webhook_creation_service.py
# The installer proxy origin is http by contract, not by oversight:
# validate_internal_http_origin refuses anything but a credential-free http
# origin, because this is a loopback hop between runtime roles on one host.
# Changing it to https would break the contract the validator enforces.
sonar.issue.ignore.multicriteria.py_internal_http_installer.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.py_internal_http_installer.resourceKey=core/entrypoints/api/extension_installer_proxy.py
