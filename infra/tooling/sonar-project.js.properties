# JS/TS SonarQube profile for faster frontend iteration.
# Project key/name can be overridden from core/entrypoints/cli/scripts/lint.sh via CLI flags.
#
# Every sonar.exclusions / sonar.issue.ignore setting in this file is part of
# the current local quality-gate contract. Do not add or modify exclusions
# casually.
sonar.projectKey=flow-steward-js
sonar.projectName=Flow Steward (JS)
sonar.sourceEncoding=UTF-8

sonar.sources=assets
sonar.javascript.file.suffixes=.js
sonar.inclusions=**/*.js,**/*.ts,**/*.tsx
sonar.javascript.node.maxspace=4096
sonar.typescript.tsconfigPaths=infra/tooling/tsconfig.sonar-js.json

# Disable JS/TS bundle detection to reduce Node.js bridge memory pressure.
sonar.javascript.detectBundles=false

# Coverage files are optional; SonarQube will continue if they are absent.
# Ignore generated/noisy paths to keep feedback focused.
sonar.exclusions=.git/**,.venv/**,venv/**,node_modules/**,**/node_modules/**,docs/**,ops/**,neo4j-data/**,assets/frontend/dist/**,assets/frontend/test-results/**,assets/frontend/src/test/**,assets/frontend/src/**/*.test.ts,assets/frontend/src/**/*.test.tsx,assets/frontend/src/**/*.spec.ts,assets/frontend/src/**/*.spec.tsx,assets/vendor/**,**/__pycache__/**,**/*.min.js,tests/**,**/*.py,**/.DS_Store

# SCM blame can fail inside dockerized scans on dirty worktrees; disable for reliability.
sonar.scm.disabled=true

# Temporary baseline for pre-existing JS modernization debt (Q-09):
# These rules flag code patterns that predate the audit baseline (2026-03-28).
# They exist throughout the current assets/ codebase and require a dedicated
# modernization story to address properly.
# Deadline for removal: 2026-09-30
sonar.issue.ignore.multicriteria=js_var,js_window,js_dataset,js_parseint,js_empty_catch,js_for_of,ts_nested_ternary,ts_complexity,ts_negated_condition,ts_semantic_roles,ts_nested_functions,ts_nested_templates,ts_jsx_spacing
sonar.issue.ignore.multicriteria.js_var.ruleKey=javascript:S3504
sonar.issue.ignore.multicriteria.js_var.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.js_window.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.js_window.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.js_dataset.ruleKey=javascript:S7761
sonar.issue.ignore.multicriteria.js_dataset.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.js_parseint.ruleKey=javascript:S7773
sonar.issue.ignore.multicriteria.js_parseint.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.js_empty_catch.ruleKey=javascript:S2486
sonar.issue.ignore.multicriteria.js_empty_catch.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.js_for_of.ruleKey=javascript:S4138
sonar.issue.ignore.multicriteria.js_for_of.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.ts_nested_ternary.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.ts_nested_ternary.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_complexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.ts_complexity.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_negated_condition.ruleKey=typescript:S7735
sonar.issue.ignore.multicriteria.ts_negated_condition.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_semantic_roles.ruleKey=typescript:S6819
