sonar.issue.ignore.multicriteria.ts_nested_functions.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.ts_nested_functions.resourceKey=assets/frontend/src/**/*
sonar.issue.ignore.multicriteria.ts_nested_templates.ruleKey=typescript:S4624
sonar.issue.ignore.multicriteria.ts_nested_templates.resourceKey=assets/frontend/src/**/*
