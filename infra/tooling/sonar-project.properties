# Base SonarQube project config for local/prod self-hosted scans.
# Project key/name can be overridden from core/entrypoints/cli/scripts/lint.sh via CLI flags.
#
# Every sonar.exclusions / sonar.coverage.exclusions / sonar.issue.ignore
# setting in this file is part of the current local quality-gate contract.
# Do not add or modify exclusions casually.
sonar.projectKey=flow-steward
sonar.projectName=Flow Steward
sonar.sourceEncoding=UTF-8

# Stable profile: frontend source + SQL only.
# Python quality/security gates are covered by Ruff/Mypy/Bandit/Semgrep in core/entrypoints/cli/scripts/lint.sh.
sonar.sources=assets,db/schema
sonar.html.file.suffixes=.html
sonar.css.file.suffixes=.css
sonar.javascript.file.suffixes=.js
sonar.javascript.node.maxspace=4096
sonar.typescript.tsconfigPaths=infra/tooling/tsconfig.sonar-js.json

# Disable JS/TS bundle detection to reduce Node.js bridge memory pressure.
sonar.javascript.detectBundles=false

# Coverage files are optional; SonarQube will continue if they are absent.
# Stable profile does not currently generate browser LCOV in this repository.
# Keep maintainability/security checks, but exclude frontend sources from coverage gating
# so SonarQube doesn't fail on missing reports that no local pipeline emits.
sonar.coverage.exclusions=assets/**,db/schema/**

# Keep scan robust: ignore known noisy/generated files.
#
sonar.exclusions=.git/**,.venv/**,venv/**,node_modules/**,**/node_modules/**,docs/**,ops/**,neo4j-data/**,assets/frontend/dist/**,assets/frontend/test-results/**,assets/frontend/src/test/**,assets/frontend/src/**/*.test.ts,assets/frontend/src/**/*.test.tsx,assets/frontend/src/**/*.spec.ts,assets/frontend/src/**/*.spec.tsx,assets/vendor/**,**/__pycache__/**,**/*.min.js,tests/**,**/*.py,**/.DS_Store,assets/platform-renderer.js

# TEMP (2026-06-27): targeted ignores for shared (non-template) components.
# The js/full Sonar profiles already ignore these React/JSX-heavy rules frontend-wide;
# the stable profile only defers them for the specific shared components below, which are
# slated for the same UI redesign that reworks the page templates:
#   - S3776 (cognitive complexity): large render/derivation functions to be split.
#   - S6819 (prefer semantic tag over ARIA role): custom modal/combobox/group components
#     where converting to native <dialog>/<select>/<fieldset> would change behaviour/UX.
# The deterministic nested-ternary (S3358), negated-condition (S7735) and nested-function
# (S2004) findings in these files were fixed in code rather than ignored. Remove entries
# here as the redesign lands.
sonar.issue.ignore.multicriteria=ts_cc_helpers,ts_cc_appshell,ts_cc_header,ts_cc_assign,ts_cc_errors,ts_role_select,ts_role_assign,ts_role_wsmodal,ts_role_lifecycle
sonar.issue.ignore.multicriteria.ts_cc_helpers.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.ts_cc_helpers.resourceKey=assets/frontend/src/components/layout/app-shell-helpers.ts
sonar.issue.ignore.multicriteria.ts_cc_appshell.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.ts_cc_appshell.resourceKey=assets/frontend/src/components/layout/AppShell.tsx
sonar.issue.ignore.multicriteria.ts_cc_header.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.ts_cc_header.resourceKey=assets/frontend/src/components/layout/app-shell-header.tsx
sonar.issue.ignore.multicriteria.ts_cc_assign.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.ts_cc_assign.resourceKey=assets/frontend/src/components/shared/assignment-selector.tsx
sonar.issue.ignore.multicriteria.ts_cc_errors.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.ts_cc_errors.resourceKey=assets/frontend/src/lib/http/errors.ts
sonar.issue.ignore.multicriteria.ts_role_select.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.ts_role_select.resourceKey=assets/frontend/src/components/shared/searchable-select.tsx
sonar.issue.ignore.multicriteria.ts_role_assign.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.ts_role_assign.resourceKey=assets/frontend/src/components/shared/assignment-selector.tsx
sonar.issue.ignore.multicriteria.ts_role_wsmodal.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.ts_role_wsmodal.resourceKey=assets/frontend/src/components/shared/workspace-delete-plan-modal.tsx
sonar.issue.ignore.multicriteria.ts_role_lifecycle.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.ts_role_lifecycle.resourceKey=assets/frontend/src/components/shared/lifecycle-plan-modal.tsx

# SCM blame can fail inside dockerized scans on dirty worktrees; disable for reliability.
sonar.scm.disabled=true
