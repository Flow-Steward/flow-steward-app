# Python-only SonarQube profile for faster backend iteration.
# Project key/name can be overridden from core/entrypoints/cli/scripts/lint.sh via CLI flags.
#
# Every sonar.test.exclusions / sonar.exclusions / sonar.issue.ignore
# setting in this file is part of the current local quality-gate contract.
# Do not add or modify exclusions casually.
sonar.projectKey=flow-steward-py
sonar.projectName=Flow Steward (Python)
sonar.sourceEncoding=UTF-8

sonar.sources=core
sonar.tests=tests

sonar.python.version=3.11
sonar.python.file.suffixes=.py
sonar.python.coverage.reportPaths=logs/quality/sonar/coverage.sonar.xml

# Include Python tests in backend-focused scans. Override via CLI/-D if needed.
sonar.test.inclusions=tests/**/*.py
# Keep backend test coverage broad while excluding currently blocked suites
# (scanner/OOM and/or known red/structurally skip-heavy suites).
sonar.test.exclusions=tests/ui/test_admin_grid_wiring.py,tests/unit/test_registry.py,tests/unit/test_platform_logger_jobs_schema.py,tests/unit/test_extension_runtime.py,tests/unit/test_guardrails.py,tests/unit/test_extension_format.py,tests/unit/test_serve_endpoints.py,tests/unit/test_registry_admin_api.py,tests/unit/test_query_services.py
sonar.exclusions=.git/**,.venv/**,venv/**,node_modules/**,**/node_modules/**,docs/**,ops/**,neo4j-data/**,**/__pycache__/**,**/*.js,**/*.css,**/*.html,**/*.sql,**/.DS_Store

# Disable JS/TS sensor entirely in the Python-only profile — the sonar-scanner-cli
# still spawns a Node.js bridge even when all *.js files are excluded, which causes
# "Analysis of JS/TS files failed: WebSocket connection closed abnormally" on some
# Docker Desktop configurations (known upstream issue, tracked in G-04).
sonar.javascript.analysis.disabled=true

# SCM blame can fail inside dockerized scans on dirty worktrees; disable for reliability.
sonar.scm.disabled=true

# Temporary baseline for existing backend debt (Q-08):
# - python:S3776 (cognitive complexity)
# - python:S107  (long parameter lists)
# Deadline for removal: 2026-06-30
sonar.issue.ignore.multicriteria=py_replace_assign_jobs,py_replace_return_jobs,py_replace_assign_webhook,py_replace_return_webhook,py_internal_http_installer,py_complexity,py_arity
sonar.issue.ignore.multicriteria.py_complexity.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.py_complexity.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.py_arity.ruleKey=python:S107
sonar.issue.ignore.multicriteria.py_arity.resourceKey=**/*.py

# Sonar's Python type inference models dataclasses.replace() as returning
# DataclassInstance. It returns the same class -- provable at runtime,
# type(replace(r)) is Req -- so the concrete annotations on these four lines are
# correct and the rule is not. A cast() would silence Sonar and mypy together,
# and mypy is the checker that works here, so the suppression is narrowed to the
# two files instead. AC17 Sonar closure, 2026-09-22.
sonar.issue.ignore.multicriteria.py_replace_assign_jobs.ruleKey=python:S5890
sonar.issue.ignore.multicriteria.py_replace_assign_jobs.resourceKey=core/application/jobs/task_execution_request.py
sonar.issue.ignore.multicriteria.py_replace_return_jobs.ruleKey=python:S5886
sonar.issue.ignore.multicriteria.py_replace_return_jobs.resourceKey=core/application/jobs/task_execution_request.py
sonar.issue.ignore.multicriteria.py_replace_assign_webhook.ruleKey=python:S5890
sonar.issue.ignore.multicriteria.py_replace_assign_webhook.resourceKey=core/application/workflows/workflow_webhook_creation_service.py
sonar.issue.ignore.multicriteria.py_replace_return_webhook.ruleKey=python:S5886
sonar.issue.ignore.multicriteria.py_replace_return_webhook.resourceKey=core/application/workflows/workflow_webhook_creation_service.py
# The installer proxy origin is http by contract, not by oversight:
# validate_internal_http_origin refuses anything but a credential-free http
# origin, because this is a loopback hop between runtime roles on one host.
# Changing it to https would break the contract the validator enforces.
sonar.issue.ignore.multicriteria.py_internal_http_installer.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.py_internal_http_installer.resourceKey=core/entrypoints/api/extension_installer_proxy.py
