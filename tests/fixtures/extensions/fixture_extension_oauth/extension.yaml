manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: fixture.extension-oauth
kind: tool_provider
version: 1.0.0
display_name: Neutral OAuth Fixture
description: Synthetic neutral OAuth provider used by core conformance tests.
vendor: {name: Flow Steward Test Fixtures}
features: [tool]
required_scopes: [extension:invoke]
account_scope:
  scope_type: project
  description: OAuth grants and tokens are connection-local within each project.
entrypoint: {mode: subprocess, command: [python3, main.py]}
health: {command: [python3, health.py], timeout_seconds: 5}
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
callbacks:
  - callback_id: oauth_authorization
    purpose: oauth_authorization
    methods: [GET]
    connection_scoped: false
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    oauth_providers:
      - provider_id: example
        display_name: Example Identity
        description: Neutral OAuth provider used by contract and lifecycle tests.
        setup_page_id: oauth_setup
        help_page_id: oauth_help
        error_help_anchors:
          invalid_client: client-credentials
          authorization_required: authorize-again
        flow: {type: authorization_code, pkce: s256}
        credential_fields:
          - field_id: client_id
            value_type: text
            required: true
            secret: false
            change_policy: reauthorization_required
            label: Client ID
            help_text: Enter the OAuth application client ID.
            placeholder: example-client-id
            autocomplete: username
            validation: {min_length: 1, max_length: 512}
          - field_id: client_secret
            value_type: secret
            required: true
            secret: true
            change_policy: runtime_revalidate
            label: Client secret
            help_text: Enter the OAuth application client secret.
            autocomplete: current-password
            validation: {min_length: 1, max_length: 4096}
          - field_id: browser_origin
            value_type: text
            required: false
            secret: false
            change_policy: reauthorization_required
            label: Browser origin
            help_text: Optional canonical HTTPS origin for browser integrations.
            placeholder: https://app.example.test
            autocomplete: "off"
            validation: {type: https_origin, min_length: 9, max_length: 2048}
        authorization_endpoint: {url: https://identity.example.test/authorize}
        token_endpoint: {url: https://identity.example.test/token, client_auth_method: client_secret_post}
        revocation_endpoint: {url: https://identity.example.test/revoke}
        callback_id: oauth_authorization
        authorization_intents:
          - intent_id: connect
            static_parameters: {access_type: offline}
            user_inputs:
              - {input_id: email_hint, parameter: login_hint, validation: {type: email, max_length: 320}}
          - intent_id: files_connect
            static_parameters: {access_type: offline}
            user_inputs:
              - {input_id: folder_hint, parameter: folder_hint, validation: {type: text, max_length: 120}}
        post_connect_action_id: verify_identity
    connection_types:
      - connection_type_id: example_mail
        auth: {type: oauth2, provider_id: example, scopes: {required: [mail.read], optional: [mail.write]}}
      - connection_type_id: example_files
        auth: {type: oauth2, provider_id: example, scopes: {required: [files.read], optional: []}}
