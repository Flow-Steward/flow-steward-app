# Flow Steward canonical installed configuration.
environment = "production"
deployment_profile = "compact"
runtime_http_port = 8080
redirect_http_port = 8080
worker_processes = 2
file_storage = "local_fs"
ingress_mode = "bundled_traefik"
development_tools = []
tls_mode = "self_signed"
public_host = "fs.example.test"
public_port = 443
reverse_proxy_backend_host = "127.0.0.1"
reverse_proxy_backend_port = 18099
reverse_proxy_mcp_port = 18100
proxy_placement = "host"
proxy_kind = "nginx"
proxy_trusted_ips = ["127.0.0.1/32", "::1/128"]
traefik_network = ""
traefik_https_entrypoint = "websecure"
traefik_http_entrypoint = "web"
traefik_cert_resolver = ""
proxy_network = ""
acme_contact = ""
acme_directory_url = ""
extension_installer_origin = "http://fs-extension-installer:8099"
certificate_path = ".ssl/cert.pem"
private_key_path = ".ssl/key.pem"
s3_endpoint = ""
s3_bucket = ""
s3_region = ""
s3_credentials_path = ""
allow_insecure_s3_http = false
